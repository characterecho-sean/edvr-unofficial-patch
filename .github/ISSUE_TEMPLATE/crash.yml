name: Crash, or the game will not start
description: The game closes by itself, freezes, or never reaches the menu.
title: "[crash] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry this is happening. First, so you can play in the meantime.

        **Try launching once more.** EDVR notices when a run died in its first seconds and switches every fix in `d3d11.dll` off for the next launch by itself, so the second attempt usually gets you in. The log says `SENTINEL TRIPPED` when that has happened. If you would rather it stayed off, **delete `d3d11.dll`** from the game folder and the game is immediately back to stock; if you also installed `openvr_api.dll`, delete that and rename `openvr_api_orig.dll` back.

        **Then get me the zip.** Run `edvr-installer.exe` and press **Save logs**. It writes one zip to your Desktop with the breadcrumb file, the last session's logs, your `edvr.ini`, the install record and your graphics settings — the right files, from the right session, in one attachment. (`edvr-installer.exe --collect-logs` does the same from a command line.)

        Everything else below is a question the zip cannot answer for me.

  - type: textarea
    id: logs
    attributes:
      label: The zip from Save logs
      description: |
        Drag it in. It is the whole report — the fields under it are the parts no file knows.

        **If you installed by hand and have no installer**, attach these instead: `edvr_breadcrumbs.txt` and `edvr_FATAL.txt` (if there is one) from next to `EliteDangerous64.exe`, and everything in `edvr_logs\` — or at least `edvr_gfx_*.log` and `edvr_vr_*.log` with matching timestamps from the run that crashed. The two halves of EDVR are separate DLLs and each logs things the other cannot see. `edvr_breadcrumbs.txt` matters most: the logs are buffered and a crash eats their last lines, and the breadcrumb file is written one line at a time so it survives.

        **What is in it:** EDVR's own logs and settings, and your Elite graphics settings. The logs contain your game folder path, and if EDVR read your Elite key bindings they name your `.binds` file, which may include your commander name. Worth a glance if that matters to you.
      placeholder: Drag the zip here.
    validations:
      required: true

  - type: textarea
    id: what-happens
    attributes:
      label: What happens, and when
      description: |
        How far does it get — no window at all, the launcher, the main menu, in flight, on foot? Every time, or now and then? If now and then, roughly how long into a session?

        If launching again gets you in, say so. That tells me the crash is in the first few seconds, which is a different problem from one that waits.
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other mods
      description: |
        **Name the DLL each one is installed as.** EDHM, ReShade and 3Dmigoto all install as a `d3d11.dll` or a `dxgi.dll`, and two of them reaching for the same thing is a recurring cause of exactly this. Version numbers help.

        Write "none" if there are none — that is a useful answer too.
      placeholder: |
        EDHM v22.01, renamed to d3d11_edhm.dll
        ReShade 6.8.0, installed as dxgi.dll
    validations:
      required: true

  - type: input
    id: headset
    attributes:
      label: Headset and runtime
      description: Which headset, and what it runs through — SteamVR, Oculus, Oasis, WMR, Virtual Desktop.
      placeholder: HP Reverb G2 via the Oasis driver
    validations:
      required: true

  - type: textarea
    id: system
    attributes:
      label: System (optional)
      description: Graphics card and driver version especially. A crash that turns out to be the display driver looks exactly like a crash in EDVR from the outside.
      placeholder: |
        Windows 11, latest update
        RTX 5080, driver 581.15
        Intel Core i7 9700K

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else (optional)
      description: |
        Whatever did not fit above. Some things that have mattered before: an Elite update landing the same day, a crash report or dialog from the game itself, a Windows *Application Error* entry in Event Viewer.

        On that last one — the faulting address it names is worth including but does not decide anything on its own. Elite routes every fatal error it has through one address, so unrelated bugs report the identical module and offset. The breadcrumb file's `gfx: stack:` line is what tells them apart, and that is in the zip.
