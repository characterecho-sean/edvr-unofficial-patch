# EDVR settings.
#
# This file lives next to EliteDangerous64.exe. Everything here is optional --
# with the file missing entirely you get the defaults below, which are what
# most people want.


[fix]
# Stop one eye going darker than the other near bright lights.
#
# Elite works out how bright the scene is separately for each eye. Near a star
# or a station floodlight, one eye can see the light and the other cannot, so
# one eye dims and the other does not. It is uncomfortable and hard to unsee.
#
# This makes both eyes use the same brightness. 1 on, 0 off.
share_exposure = 1

# Make the space around the on-foot screen pure black.
#
# On foot, Elite shows the world on a flat screen floating in front of you,
# surrounded by dark grey. On an OLED headset that grey is lit pixels, so it
# reads as a glowing rectangle. This makes it properly black.
#
# 1 on, 0 off. No effect in the ship.
black_void = 1

# Make the on-foot screen sharper.
#
# Elite renders that screen at 1920x1080 no matter what your headset or your
# display can do, which is why text on foot looks soft. This raises it. It also
# applies to HMD (Cinema Mode), which puts the whole game on that same screen.
#
# 1920x1080 below is Elite's own resolution, so as shipped this does nothing at
# all -- it is set to the stock value rather than to 0 so you can see what the
# game does and what you are changing it from. Raise it to turn the fix on.
#
# 16:9 sizes only. The screen's shape is set by the game, so another aspect
# stretches the picture instead of widening it.
#
#   2880 x 1620   just over twice the detail
#   3200 x 1800   in between, if 4K costs you frames
#   3840 x 2160   four times, and a clear improvement
#   5120 x 2880   seven times, if you have the headroom for it
#
# Anything 16:9 between 640 wide and 8192 works; those are just the useful ones.
#
# It is not free, and the cost grows with the area. At 3840x2160 the game makes
# over a hundred render targets of about 32 MB each, plus others that grow with
# it; 5120x2880 is roughly another 1.8x on top of that. If your frame rate drops
# below your headset's refresh, step down -- juddering is worse than soft text.
#
# READ THIS ONE BEFORE TURNING IT ON. Unlike everything else here, this changes
# the game's code in memory while it runs. It does not touch any file on disk,
# and it puts the original values back when the game closes.
#
# It finds what to change by recognising its shape rather than by trusting a
# version number, so an Elite update does not automatically break it. If it does
# not find exactly what it expects, it does nothing and says so in the log. And
# it cannot corrupt anything: it swaps one number for another of the same size,
# so the game runs the same instructions either way.
#
# Needs a game restart to take effect, unlike the settings above -- and it is
# not covered by the Scroll Lock toggle either. It changes the SIZE the game
# makes its images at, and images it has already made keep the size they were
# made at, so switching it while playing would leave a mix of both and look
# worse than either. To compare it, change the numbers and restart.
vscreen_res_width = 1920
vscreen_res_height = 1080

# How far away the on-foot screen sits.
#
# 1.0 is Elite's own distance. Lower brings it closer, higher pushes it away --
# 0.5 is noticeably close, 2.0 is far. Change it while the game is running and
# the next second shows the result.
panel_distance = 1.0

# Stop the one-frame flash when you jump, drop out of supercruise, or close the
# galaxy map.
#
# Occasionally the game draws a single frame from the wrong viewpoint -- a hard
# cut to somewhere else and straight back. On a monitor it is a blink. In a
# headset it reads as the world lurching, which is the part that hurts.
#
# This spots that frame and does not send it to your headset. SteamVR shows the
# previous frame for a moment longer instead, exactly as it does whenever a game
# misses a frame, so you see nothing rather than something wrong.
#
# NEEDS openvr_api.dll INSTALLED TOO. The detection happens in d3d11.dll but the
# decision has to be made where frames go to SteamVR. With only d3d11.dll
# installed this still writes to the log but cannot stop anything. See the
# README for the extra install step.
#
# 1 on, 0 off.
transition_flash = 1


[hotkey]
# Turn the brightness fix on and off while playing, to see the difference.
#
# Not a function key: Elite uses most of the F row, and F11 is the external
# camera. Scroll Lock, Pause and Num Lock are usually free.
# Takes effect when the game starts.
toggle_exposure = SCROLLLOCK

# Write the last ten seconds of viewpoint history to the log.
#
# Press this straight after seeing a flash that got through. It writes about 900
# lines describing where the game was drawing from on each of the last few
# hundred frames, which is what makes a report about a flash actionable rather
# than anecdotal -- it shows whether the frame was detected and let through, or
# never detected at all.
#
# Nothing is written until you press it, and it changes nothing about how the
# game renders.
dump_camera = PAUSE


[log]
# EDVR writes a short plain text log to edvr_logs\ next to the game, saying
# which fixes started and whether they found what they needed. If you report a
# problem, open it in Notepad and paste the whole thing -- it is a few
# kilobytes and contains nothing personal.
#
# 0 writes nothing at all.
enabled = 1


# ---------------------------------------------------------------------------
# Advanced, and you should not need these.

[advanced]
# Which number in the screen's position data is its distance. Only change this
# if panel_distance stops moving the screen after a game update, which would
# mean Elite has rearranged that data.
panel_distance_index = 47

# Pin the brightness fix to one specific shader. Leave empty.
#
# Empty means EDVR finds the right one itself, every launch, by what it does
# rather than by which version of Elite compiled it -- so a game update does
# not break it. Only fill this in if the log says it picked the wrong one.
exposure_shader =

# Run alongside another mod that is also installed as d3d11.dll, such as EDHM
# or ReShade.
#
# Only one file can be called d3d11.dll, so:
#
#   1. Rename the other mod's d3d11.dll to something else, for example
#      d3d11_edhm.dll. Leave it in the same folder.
#   2. Put EDVR's d3d11.dll in its place.
#   3. Put the name you chose here.
#
# EDVR then loads that file and passes everything through it, so both mods work.
# Anything the other mod does not handle goes to Windows' own d3d11.dll.
#
# If the name here is wrong or the file will not load, EDVR says so in the log
# and carries on without it -- the game still starts, you just do not get the
# other mod. Needs a restart to take effect.
real_dll =

# The same idea for openvr_api.dll: the name you renamed the game's own copy to.
# Empty means openvr_api_orig.dll, which is what the README tells you to use.
real_openvr_dll =

# How sensitive the transition flash fix is.
#
# A frame is treated as bad when the viewpoint it was drawn from is further than
# this from where the two frames before it were heading. Ordinary flight moves
# about 30 units a frame; the bad frames measured here were 9,900 to 24,000 out.
# 2000 sits well clear of both.
#
# The speed factor covers acceleration: during a jump the viewpoint legitimately
# gains thousands of units a frame, so the threshold becomes whichever is larger
# of the number above and this multiple of the current speed.
#
# Lower means more frames withheld. Withholding a frame that was fine costs one
# repeated frame, which is invisible on its own -- but a run of them is judder,
# which is worse than the flash. If the log shows far more frames withheld than
# you made jumps, raise these rather than lowering them.
transition_flash_units = 2000
transition_flash_speed_factor = 8.0

# Never withhold more than this many frames in a row, whatever the detector
# thinks. The bad frame is a single frame by definition, so a run of them means
# the detector is wrong about the scene rather than that the game glitched
# repeatedly.
transition_flash_max_consecutive = 2

# Where the viewpoint lives: the size of the constant buffer holding it, and the
# position of the first of its three coordinates within that buffer.
#
# This is the one part of EDVR that is specific to a build of Elite rather than
# to the shape of what it does, because there is no instruction pattern to
# recognise here -- only a block of numbers. If a game update moves it, EDVR
# notices that what it is watching does not behave like a viewpoint, disables
# the fix, and says so in the log. It does not guess.
camera_buffer_bytes = 5376
camera_buffer_offset = 1100

