# TEMPORARY (F178): Standing ADS body left / right: the crouched dial above, for standing: moves your body to the left of the gun (positive) or to the right of it (negative), in cm across the
# direction you aim, while you are standing and aiming down sights, so the stock meets the right shoulder instead of the left one; your eye and the gun do not move, the body and its arms do,
# and the left hand stays on the foregrip. The move grows with the sights and shrinks as you crouch (the crouched dial takes over), so it is 0 at the hip. 0 moves nothing. -30 to 30.
# In native on foot VR only, with the full third-person body. Live. It is a test dial: once the right value is found it becomes the behaviour and this key goes. The default, 23, is the value the pilot flew with.
