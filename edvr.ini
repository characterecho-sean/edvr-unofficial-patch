#hud_grain_vs =








# Developer instrument: while a census runs, every recorded draw whose vertex
# shader matches this hash (the census's vh= column) also dumps the CONTENTS
# of its b0 constant buffers -- vertex and pixel stage -- as DCW lines: the
# bytes the GPU reads for exactly that draw, captured from the game's own
# writes. Same-frame dumps pair by q; diffing eye A's against eye B's is how
# a per-eye value hiding in shared buffer objects gets caught. Empty is off.
#
# For the FSS ring split: 953C8123AD8DC13B is the composite that pastes the
# scanner body into each eye. Its textures are measured identical between
# the eyes (2026-08-25); its constants are the channel the census cannot
# otherwise see.
#
# Also matches COMPUTE shaders (2026-08-26): a dispatch of a watched hash
# dumps its CS b0 and b1 the same way (slots x and y in the DCW lines), and
# a second comma-separated hash watches two shaders in one census -- built
# for the reconstruction pair E861F611375E7ECC,B74273EC13F7CD59, whose
# shared 80-byte block is the per-eye-rewrite idiom this key exists for.
#census_cb_watch =

# Developer instrument: which constant-buffer SLOT census_cb_watch reads,
# 0 to 13. 0 is b0 and the old behaviour.
#
# It was b0 and only b0, and twice that has been the wrong buffer: the
# loading wash's pixel shader reads b2, and the intro movie's panel is
# placed by a scale and a transform in its VERTEX shader's b2. Both times
# the census reported "no constant buffer" for a draw whose whole
# behaviour was in one, because the column only looked at slot zero. Set
# this to 2 with census_cb_watch naming the shader to dump it.
#census_cb_slot = 0

# Developer instrument: write every shader the game creates to
# edvr_logs\shaders, for reading a draw's own code when a fix needs it.
# Costs file writes during loading; needs a restart.
#glare_shader_dump = 0

# Curved-screen tuning. The sign is 1 for "toward you", correct on the game
# build this was measured against; -1 is the escape hatch if an update
# flips the panel transform's handedness. Segments is how many columns the
# screen is cut into -- 64 is far past what the eye can see, and below
# about 8 the screen visibly facets. The gain is the bend's depth scale in
# the panel's own units: EDVR reads it from the game automatically, and
# this overrides that reading if a game update moves it (0 = use what was
# read).
#panel_curvature_sign = 1
#panel_curvature_segments = 64
#panel_curvature_z_gain = 0.0


