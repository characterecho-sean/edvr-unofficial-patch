# EDVR settings.
#
# This file lives next to EliteDangerous64.exe. Everything here is optional --
# with the file missing entirely you get the defaults below, which are what
# most people want.
#
# Commented-out lines (like "#max_mb = 16") show expert settings at their
# defaults. A normal install never needs them; they are listed so that when
# the log or a support thread names one, you can find it. Uncomment to change.
#
# How each fix works, with measurements, lives in the docs folder
# (docs\*.md) -- this file only tells you what a setting does for you.


# ============================================================================
# [fix] -- the fixes themselves. Everything here is safe to change and most
# take effect within a second of saving.
# ============================================================================
[fix]

# --------------------------------------------------------------------------
# Night vision
# --------------------------------------------------------------------------

# Keep the night-vision pulse line at a stable distance when turning your
# head. Preserves the game's terrain shading, texture outlines and brightness.
# Works with AA Off, TAA or DLSS, independently of the experimental Realistic
# nightvision appearance. Turn off to compare the original pulse. Live.
# ui: Night vision pulse stability | menu
night_vision_stability = 1

# --------------------------------------------------------------------------
# The on-foot screen
# --------------------------------------------------------------------------

# Keep weapons, tools and their attached parts steady while moving and
# turning on foot. While the game says you are on foot, EDVR moves the
# game's wait for the next frame from its pose fetch to its eye submit, so
# the arms are drawn for the pose they are shown at; in a ship nothing
# changes. Also tracks the weapon's animated geometry for temporal AA,
# including aiming and sway, so walking/crouching does not drag scenery
# history through it. Costs about a frame of latency on foot and keeps
# SteamVR motion smoothing / Oculus ASW from engaging there. Works with AA
# Off, TAA or DLSS. Needs the journal watcher (d3d11.journal_watch, on by
# default). Turn off to compare with the game's original movement. Live.
# ui: Weapon stability | menu
weapon_stability = 1

# Make the space around the on-foot screen pure black instead of glowing
# grey. On an OLED headset the difference is stark. 1 on, 0 off. No effect
# in ships. Live.
# ui: Black surround for the on-foot screen | menu
black_void = 1

# Make the on-foot screen (and HMD Cinema Mode) sharper. Elite renders that
# screen at 1920x1080 regardless of your headset, which is why text on foot
# looks soft. "auto" (the default) sizes it itself, from the width your
# headset actually rendered per eye last session, by one of two rules (the
# log's "vScreen resolution:" line says which one ran, and why):
#
#   fitted   when the VR on-foot world route will run (it needs
#            the route itself, which is always selected, the UI
#            layer on, and EDVR's own OpenXR runtime; a curved screen,
#            fix.panel_curvature, does not stop it): about 70% of the
#            width the screen has in your eyes head-on at your
#            fix.panel_distance, which is about 1.4 eye pixels per texel
#            of the screen. EDVR measures that width at the middle of the
#            screen while you are on foot and remembers its head-on floor
#            (the lowest tenth of the readings, so a turned head does not
#            inflate it) for the next launch. The route anti-aliases the
#            world at that size, so more pixels than the eye can show only
#            cost frame time. Never under 2880, never over the legacy
#            width. A bent screen's edges come nearer than its middle, so
#            on a near screen they are enlarged more than the middle is;
#            if they look softer than the middle, type a width.
#   legacy   otherwise: 125% of the width your headset rendered per eye,
#            rounded to a clean 16:9 pair. With nothing anti-aliasing the
#            on-foot world before it reaches the screen, the extra width
#            does that job.
#
# A sharper VR render resolution or a changed panel_distance brings either
# one along, one restart later, with nothing to set. Type a width in pixels
# instead to pick your own, used exactly; the height always follows it at
# 16:9 and is not a separate setting any more. 16:9 widths that were the
# useful ones under the old pair:
#
#   2880 wide   just over twice the stock detail
#   3840 wide   four times, a clear improvement
#   5120 wide   seven times, if you have the headroom
#
# Costs GPU memory and time in proportion; if your frame rate drops below
# your headset's refresh, step down -- judder is worse than soft text.
# Unlike everything else here, this changes values in the game's memory
# while it runs (never any file on disk). Needs a game restart; typing the
# stock 1920 turns it off, same as before, and "auto" has nothing to go on
# until one session with VR running has completed. The first fitted launch
# starts from a calibration (3504 wide at panel_distance 0.7 on a 4032 wide
# eye, where the screen spans about 5000 px head-on); the measurement
# replaces it after one session on foot.
# ui: On-foot screen resolution: width | range 640..8192 | menu
vscreen_res_width = auto

# How far away the on-foot screen sits. 1.0 is Elite's own distance; 0.5 is
# noticeably close, 2.0 far. Pairs well with panel_curvature: 0.7 with a
# 0.3 curve is a comfortable on-foot starting point. Live.
# ui: On-foot screen distance | recommended 0.7 | range 0.5..2.0 | menu
panel_distance = 1.0

# Bend the on-foot screen (and HMD Cinema Mode) toward you, the way Virtual
# Desktop curves its virtual screen (docs\screen-curvature.md). The number
# is the fraction of a full circle the screen wraps around you: 0 is flat
# and off, 0.1 a gentle theatre curve, 0.3 a comfortable wrap. The screen
# keeps its width, so the edges come nearer rather than the middle moving
# away. Try 0.3 here with panel_distance 0.7 on foot. The VR on-foot world
# route draws the
# curved screen through this same curve, so it runs with the bend on. The
# intro movie (visual.intro_video = screen) and the splash screen follow the same
# curve. Live, and composes with panel_distance.
# ui: Screen curve (on foot, intro, splash) | recommended 0.3 | range 0..1 | percent | menu visual
panel_curvature = 0.0

# --------------------------------------------------------------------------
# The intro
# --------------------------------------------------------------------------

# The backdrop behind the intro and the menu. That picture is stored in an
# old compressed format and is very dark, so its gradients come out
# stepped -- magnified across a headset's field of view the steps read as
# blocks and patches (docs\menu-backdrop.md). "splash" (the default)
# keeps the NICER of the two pictures the game already loaded -- the big
# splash it shows first and normally throws away seconds later -- and
# smooths the banding out of it once, when it first draws. It is the
# game's own art either way; nothing is added to your install. "stock"
# leaves the game alone. Live.
# moved-from: fix.menu_backdrop (default stock)
# ui: Intro background picture | choices splash, stock | menu visual
intro_backdrop = splash

# Where the loading dialogs' dimming happens. While a loading dialog is
# up the game dims your ENTIRE view -- a frosted wash plus a full-view
# tint -- which is ordinary on a monitor and oppressive in a headset,
# covering artwork far beyond the dialog's edges
# (docs\loading-panel-handoff.md). "screen" (the default) moves that
# dimming where it belongs: the wash and the full-view tint go, and the
# splash screen itself steps back by the same tint instead, exactly while
# a dialog is up. The dialog's box, border and text are the game's own,
# untouched. The intro only -- this retires for the session the moment a
# rendered scene arrives. "stock" leaves the game alone. Live.
# moved-from: fix.loading_panel (default stock)
# moved-from: fix.loading_splash_dim (default on)
# ui: Loading screen dimming | choices screen, stock | menu
loading_dim = screen

# --------------------------------------------------------------------------
# Jumps, stars and smoke
# --------------------------------------------------------------------------

# Stop the sun's glare riding your head (docs\sun-glare.md). The game draws
# a star's whole glare -- corona, smudge, beams, rays, lens flare -- flat on
# your view like a camera overlay: it rolls when you roll and the beams stay
# pinned to your face. The star's own disc is separate and never touched.
#
#   realistic  the glow a real eye would see: corona and smudge anchored in
#              the world, steady under every head motion, identical in both
#              eyes. Camera artifacts (beams, rays, lens flare) removed.
#   vivid      everything drawn: corona, smudge and beams locked to the
#              world, the lens flare keeping its slide across your view --
#              the movie-camera look without the head coupling.
#   stock      leave the game alone.
#
# vivid is the default. Live -- swap modes mid-flight and compare.
# ui: Sun glare | choices vivid, realistic, stock | menu
sun_glare = vivid

# Stop smoke and steam plumes swimming as you look around
# (docs\particle-billboards.md). The game builds each particle's quad
# against the camera's own up vector, so tilting your head -- or swinging
# the camera on foot -- rolls every puff of smoke with you. "steady"
# builds them against world up instead: they still turn to face you, but
# a rising plume stays upright in the world. Geysers are where this shows
# most. "steady" is the default; "stock" leaves the game alone. Live.
# ui: Smoke and steam plumes | choices steady, stock | menu
particle_billboard = steady

# Whether the hyperspace tunnel keeps its starfield. "on" is the game's own
# behaviour and the default; "off" leaves the tunnel empty, so a jump is
# the swirling walls and nothing streaking past inside them.
#
# This exists because 0.12.3 emptied that tunnel by accident -- a fix aimed
# at solar flares was pointed at the starfield's shader by mistake -- and a
# player who saw it asked to keep it. It is done properly here: the draw is
# withheld, not corrupted, so nothing else about the jump changes.
#
# Off costs nothing when on: one comparison per particle draw. Live.
# ui: Hyperspace tunnel starfield | choices on, off | menu
witchspace_stars = on

# Whether supercruise shows the space dust streaks. "on" is the game's own
# behaviour and the default; "off" draws none of them. Off can help Virtual
# Desktop's Synchronous Space Warp.
#
# On costs one comparison per draw. Changes apply live.
# ui: Supercruise space dust | choices on, off | menu
supercruise_dust = on

# Whether normal space (near planets, stations and ships) shows the drifting
# dust specks. "on" is the game's own behaviour and the default; "off" draws
# none of them.
#
# On costs one comparison per draw. Changes apply live.
# ui: Normal-space dust | choices on, off | menu
normal_space_dust = on

# --------------------------------------------------------------------------
# Native on foot VR
# --------------------------------------------------------------------------
# The Native on foot page of the in-headset menu lists the settings below whose ui: line names that page, in this order and under these
# headings (F127): the switch first, then look and aim, aiming down sights, body and view, and the HUD last. The settings after the last
# heading have no menu row; they stay in this file and in the installer's window.

# Whether an on-foot Cinema request from the game is answered with the headset's
# own stereo instead of the flat screen. "on" (the default) forwards the request as
# HMD stereo while a game session is live; "off" leaves the game's own behaviour.
#
# TEMPORARY, for flight F2 of native on-foot VR (docs\design-native-onfoot-vr-2026-10-13.md).
# It goes away when the feature ships as behaviour. Every setter call is logged as
# "native on foot:" lines whatever this says. Changes apply live.
# ui: Native on foot VR | choices on, off | recommended on | menu native_on_foot
native_on_foot = on

# --------------------------------------------------------------------------
# Look and aim
# --------------------------------------------------------------------------

# Look to aim. On: on foot your head is your look. Where you look, up and down included, is where your
# body faces, where you walk and where your weapon points, with a weapon drawn or not; the view is always
# exactly your head's. The mouse and a controller's right stick no longer look up and down, and turn you
# only as the turn style below says (snap steps or a smooth turn), so you can still turn around seated.
# The panel pointer still follows the mouse. The HUD comes with your view. Off (the default): the mouse
# and the stick look as the game's own, and your head looks around the body. In native on foot VR only,
# with the full third-person body. Live.
# ui: Look to aim | choices on, off | recommended off | live | menu native_on_foot
native_on_foot_look_to_aim = off

# Turn style, with look to aim on. snap (the default): push the right stick to the side, or flick the
# mouse sideways, and you turn one step (the snap turn step below) while the view blinks dark for a
# moment; push again for the next step. smooth: the stick's sideways and the mouse's sideways movement
# turn you continuously, as the game's own turning does. Either way the view and the body turn together,
# also while aiming down sights. Live.
# ui: Turn style | choices snap, smooth | recommended snap | live | menu native_on_foot
native_on_foot_turn_style = snap

# Snap turn step: how far one snap turns you, in degrees (15 to 90). Live.
# ui: Snap turn step | range 15..90 | step 15 | unit deg | recommended 45 | live | menu native_on_foot
native_on_foot_snap_turn_deg = 45

# Look to aim smoothing: how quickly your body turns to where you look while nothing is drawn, in
# milliseconds. 0 turns it at once; the default 50 is a slight easing. With a weapon or tool drawn, and
# while aiming down sights, the weapon follows your head at once. Your view is never smoothed. Live.
# ui: Look to aim smoothing | range 0..1000 | step 10 | unit ms | zero exact | recommended 50 | live | menu native_on_foot
native_on_foot_look_to_aim_smoothing_ms = 50

# --------------------------------------------------------------------------
# Aiming down sights
# --------------------------------------------------------------------------

# RETIRED in F152: the Native on foot page's setting for how far forward of the game's aiming eye point your eye sat while you aimed down sights, a cap at 21 cm. While you aim
# the held weapon's eye depth is now the game's own aiming camera for the weapon, plus a back-off baked in for the weapons whose camera puts the eye inside the gun, plus the
# developer tier's "ADS eye forward / back" (0 by default; -30 to 30 cm), so a weapon can be moved forward as well as back. The old value is not carried over: its meaning
# changed, and 14 read as an offset would push every weapon 14 cm forward. The key stays here at its last shipping value (21), so a stock file reads clean; a value that
# differs is named once in the log.
# ui: hidden -- retired (F152): ignored.
native_on_foot_ads_eye_distance_cm = 21
# ADS: sight eye: the eye that comes to the sights while you aim down sights. Your view moves so that this eye sits on the weapon's sight line, and the other eye sits one eye
# distance to its side. both: the right eye comes to the sights and both eyes see the view from it, so the sights sit centred in both eyes and neither eye is closed. It
# comes in as the sights come to your eye (0.15 s) and goes as they come down (0.3 s). Depth flattens while you aim, as it does through a real scope. At the far left of your
# view, which your right eye does not see, the left eye keeps its own view. right: the right eye comes to the sights and each eye keeps its own view (the normal stereo
# view): the left eye sees the sights from its own side. left: the left eye comes to the sights and each eye keeps its own view: the right eye sees them from its side. In
# native on foot VR only, with the full third-person body. A value saved for the old "ADS: sight in both eyes" setting carries over (on is both, off is right).
# moved-from: fix.native_on_foot_ads_sight_both_eyes (default on) (values on=both, off=right)
# ui: ADS: sight eye | choices both, right, left | recommended both | live | menu native_on_foot
native_on_foot_ads_sight_eye = both
# ADS: aim with head: while you aim down sights the weapon follows your head. Each frame your head's turn is sent to the game as look input and the turn the game applies is
# taken back out of your view, so the view stays yours and the weapon goes where you look; a guard stops it for the rest of a press if the view and your head part. off: the
# weapon stays where the game aims it (your mouse or stick) while your view follows your head; your eye still comes to the sights, in both eyes. It switches
# live, also while aiming: turned off, the weapon turns back to where it pointed over 0.3 s; turned on, it follows your head from there. In native on foot VR only, with the
# full third-person body (body align = body with native_on_foot_hide_fp_body and native_on_foot_body_unclip on). With it on, while you aim down sights the mouse and the
# stick no longer look up and down (your head does); they still turn you sideways, turning the view with the body. If the guard stops the head aim for the rest of a press
# they look up and down again. With look to aim on, your head aims all the time, in the sights too, the mouse and the stick never look up or down, and this setting changes
# nothing. off: the mouse and the stick look up and down and sideways as the game does, and your view follows your head.
# ui: ADS: aim with head | choices on, off | recommended on | live | menu native_on_foot
native_on_foot_ads_head_aim = on
# ADS: scope zoom: while you aim down sights through an optical sight (a scope) whose zoom EDVR knows, the picture inside the scope's frame is shown magnified by the game's own zoom
# for that weapon, as the flat game zooms its camera; the rest of your view stays at true scale. It is made in your right (aiming) eye after the upscaler and sharpening, so the lens
# shows the world at the detail you see it, only larger (a digital zoom). With ADS: sight eye at both the left eye follows with the same picture; with left there is no lens, because
# the lens is the right eye's. The scope's own marks (the gunsight chevron) stay at their own size over the magnified picture, at the brightness the game gives them: they are drawn
# in the same layer as the weapons' light and added to the picture after the zoom, as the weapons' light is. That needs a temporal anti-aliasing mode (the Performance page's Anti-aliasing,
# not off), which the lens needs too; with the layer stood down the mark stays in the scene and is magnified with the world, and the log's scope zoom (S1) line says so. A weapon with an
# iron, reflex or holo sight, and one EDVR has no zoom for, get no lens. on is the default; off: the scope shows the world at true scale. In native on foot VR only. Live.
# ui: ADS: scope zoom | choices on, off | recommended on | live | menu native_on_foot
native_on_foot_ads_scope_zoom = on

# --------------------------------------------------------------------------
# Body and view
# --------------------------------------------------------------------------

# Eye height: how far your eyes sit above the commander's neck standing upright, with your head level. Your view sits this far above the neck, so looking down
# you see your shoulders and legs where they belong. With a weapon or tool drawn your eyes stay at the height they have empty-handed in the same stance (standing
# or crouched), and the commander's leaning weapon stance stands upright under your eye; this one setting moves both. 15.5 is the commander's own neck-to-eye
# height; lower brings your view down toward the shoulders, higher lifts it. Looking down still lowers the eye about the neck as your head pitches. In native on
# foot VR only, with the full third-person body. Live.
# retired-default: 4
# ui: Eye height | range 0..30 | step 0.5 | unit cm | recommended 15 | live | menu native_on_foot
native_on_foot_eye_height_cm = 15
# Weapon view offset: positive shifts your view and body right relative to the fixed equipped weapon or tool; negative shifts left. The weapon or tool stays put.
# While aiming down sights, the eye aligns to the actual sight independently and the body keeps this offset. Otherwise it applies in native on-foot VR while the full third-person body pin is active and an item is equipped.
# ui: Weapon view offset | range -10..10 | step 0.5 | unit cm | recommended 0.0 | live | menu native_on_foot
native_on_foot_weapon_view_offset_cm = 0.0
# Weapon eye forward: positive moves your eye toward the weapon or tool drawn at the hip, negative away from it, along the character's forward. TEMPORARY F88 (live): the offset is in
# the character's axes, so it turns with the body and not with your head; it is 0 unarmed and ramps in and out over 0.25 s when you draw or holster. It stays on while you aim down
# sights (F89): the ADS eye distance still decides where the eye is, and when the sights come down the eye goes straight back to the offset eye. 0 leaves the view as it was. Only
# with the full third-person body pin. Live.
# ui: Weapon eye forward | range -10..25 | step 0.5 | unit cm | recommended 10.0 | live | menu native_on_foot
native_on_foot_weapon_eye_forward_cm = 10.0

# The visor in breathable air. "up" holds the helmet's visor up while you are on foot in breathable
# air (the game's own visor override; it hides the RemLok helmet's edge lines). "game" leaves the
# visor to the game. Applies only while native stereo is on foot. Live.
# ui: Visor in breathable air | choices up, game | menu native_on_foot
native_on_foot_breathable_visor = up

# ui: hidden -- retired (F128): ignored.
native_on_foot_visor_axis = on

# --------------------------------------------------------------------------
# HUD
# --------------------------------------------------------------------------

# How far the on-foot HUD sits from your eyes, in metres: the game's own distance is 0.192,
# and the HUD keeps its angular size as it moves. Only applies while native stereo is on
# foot and the HUD mesh test is on. Live.
# ui: HUD distance | range 0.01..0.40 | step 0.01 | unit m | recommended 0.19 | live | menu native_on_foot
native_on_foot_hud_distance = 0.19

# How large the on-foot HUD is, as an angle: the basis is multiplied by this and the distance
# stays where it is, so the elements move toward the line of sight. Distance is the depth of
# the HUD; size is the control for spread. Live.
# ui: HUD size | range 0.30..3.00 | step 0.05 | recommended 1.00 | live | menu native_on_foot
native_on_foot_hud_size = 1.00

# The size of the on-foot HUD's elements, as the game lays them out: 0 leaves the game's own
# scale. Otherwise 0.30 to 2.00 replaces the game's scale for every element and its spread
# around the centre; a value under 0.30 is read as 0.30. The default is Sean's tuning, 1.35.
# Applies only while native stereo is on foot and the HUD mesh test is on. Live.
# ui: HUD element scale (0 = game) | range 0.00..2.00 | step 0.05 | recommended 1.15 | live | menu native_on_foot
native_on_foot_hud_element_scale = 1.15

# How much room the on-foot HUD has before the edge of its canvas clips it. The elements keep their
# angular size; the room shrinks the element scale (scale / room) and enlarges the HUD's mesh (size x
# room) so the same elements fit further out. 1.00 is the game's own room. Applies only while native
# stereo is on foot and the HUD mesh test is on. With the element scale at 0, the room needs the game's
# own scale, which is read on foot; until then the room is not applied. Live.
# ui: HUD room (space before the edge clips) | range 1.00..2.50 | step 0.05 | recommended 1.00 | live
native_on_foot_hud_room = 1.00

# How far apart the on-foot HUD's elements sit: pulls them toward the centre of your view by
# moving the game's HUD margins (0 = the game's own layout). Applies only while native stereo
# is on foot and the HUD mesh test is on. Live.
# ui: HUD spread (pull elements toward the centre) | range 0.0..0.45 | step 0.01 | recommended 0.05 | live | menu native_on_foot
native_on_foot_hud_spread = 0.05

# Move one group of the on-foot HUD sideways (x) or up (y), as a fraction of the HUD's own canvas:
# 0.10 moves it a tenth of the canvas to the right or up. The groups: left (radar, vitals, the
# wheels, chat, wing), top (compass, alerts, conflict zone, capture point, tool progress), right
# (the humanoid panel, conversations, mining meters) and centre (the grenade indicator, the
# sampling tool, the tutorial). Live.
# ui: HUD left group X | range -0.30..0.30 | step 0.01 | recommended 0.00 | live
native_on_foot_hud_left_x = 0.00
# ui: HUD left group Y | range -0.30..0.30 | step 0.01 | recommended 0.02 | live
native_on_foot_hud_left_y = 0.02
# ui: HUD top group X | range -0.30..0.30 | step 0.01 | recommended 0.00 | live
native_on_foot_hud_top_x = 0.00
# ui: HUD top group Y | range -0.30..0.30 | step 0.01 | recommended -0.09 | live
native_on_foot_hud_top_y = -0.09
# ui: HUD right group X | range -0.30..0.30 | step 0.01 | recommended -0.07 | live
native_on_foot_hud_right_x = -0.07
# ui: HUD right group Y | range -0.30..0.30 | step 0.01 | recommended 0.00 | live
native_on_foot_hud_right_y = 0.00
# ui: HUD centre group X | range -0.30..0.30 | step 0.01 | recommended 0.02 | live
native_on_foot_hud_centre_x = 0.02
# ui: HUD centre group Y | range -0.30..0.30 | step 0.01 | recommended 0.00 | live
native_on_foot_hud_centre_y = 0.00

# What the on-foot HUD follows. "head" keeps it in front of your head as you turn; "body" keeps
# it where the body's view puts it. Live.
# ui: HUD follow | choices head, body | recommended body | menu native_on_foot
native_on_foot_hud_follow = body

# How long the HUD takes to follow your head, in milliseconds (0 = exact). Live.
# ui: HUD follow smoothing | range 0..500 | step 10 | unit ms | zero exact | recommended 0 | live
native_on_foot_hud_follow_smoothing_ms = 0

# --------------------------------------------------------------------------
# Native on foot: other settings
# --------------------------------------------------------------------------
# Settings with no row on the Native on foot page of the menu: the ones below that show a label can be set here or in the installer's
# window; the rest are the arc's hidden test keys and its retired ones.

# RETIRED in F155: the mouse cursor on on-foot panels such as lockers and terminals is always drawn in VR, at the game's place with the magnification of the panel's pick
# mesh undone (hidden where that is not known), so the setting that hid it (off) or drew it (on) and the test setting that chose among five placements in the F154 flights
# (drawn won) are gone. They stay here at the value that now holds (on and drawn), so a stock file reads clean; a value that differs is named once in the log.
# ui: hidden -- retired (F155): ignored.
native_on_foot_panel_mouse = on
# ui: hidden -- retired (F155): ignored.
native_on_foot_panel_cursor_test = drawn

# RETIRED in F122: the two test settings for where the cursor is drawn on an on-foot panel (the first for a turned panel, the second for
# a head turn). Both placements were removed in F155. They stay here at their last shipping values (panel), so a stock file reads clean; a
# value that differs is named once in the log.
# ui: hidden -- retired (F122): ignored.
native_on_foot_panel_cursor_fix = panel
# ui: hidden -- retired (F122): ignored.
native_on_foot_panel_cursor_follow = panel

# RETIRED in F127: the setting for where the aim reticle sits on foot (aim, head or game). The reticle now always sits where the game aims it, on the mouse-aim
# axis at the distance the game gives it, which was the default. It stays here at its last shipping value (aim), so a stock file reads clean; a value that
# differs is named once in the log.
# ui: hidden -- retired (F127): ignored.
native_on_foot_reticle_follow = aim

# TEMPORARY F15 test: while native stereo is on foot, the first-person body (the EVASuit arms and
# hands and the first-person skeleton) is hidden from both eyes. Only the first-person body is
# touched; the third-person body is left as it is. Goes away when the arc picks one. Live.
# ui: Hide first-person body (test) | choices on, off | recommended on
native_on_foot_hide_fp_body = on

# TEMPORARY F18 test: how the torso draws of your own third-person body are culled while native
# stereo is on foot. "game" (the default) leaves them as the game draws them; "none" draws both
# faces of each triangle; "front" draws only the back faces, so the inside of the torso shows and
# its outside does not. Only the local player's third-person body is matched; other people and
# everything else are left alone. Goes away when the arc picks one. Live.
# ui: Body torso culling (test) | choices game, none, front
native_on_foot_body_cull = game

# TEMPORARY F19 test: while native stereo is on foot, the parts of your own third-person body that
