#fss_eye_dump = 0

# Developer instrument: the same idea as fss_eye_dump with the scanner
# knowledge removed -- both eyes, at EVERY stage of one frame, anywhere in
# the game (docs\eye-split.md).
#
# fss_eye_dump recognises the scanner's ring quad and body composite by
# shader hash, so it never arms on a planet seen from the cockpit. This one
# needs no such knowledge: on the armed frame it remembers every render
# target the scene draws into, and copies them all at the frame boundary.
# A deferred renderer hands over its stages for free that way -- geometry
# buffer, lit HDR image, tonemapped LDR image, one of each per eye -- and
# the offline comparison (tools\diff_eye_split.py) reports which stage the
# two eyes first disagree at. That names the pass that breaks without
# anyone having to guess which draw is the body first.
#
# Built 2026-08-30 for the planetary body that renders as a featureless
# black disc in the right eye, where eight rounds of the draw census
# eliminated every channel the census can read.
#
# The number is which scene frame to capture, counted from arming (frames
# that draw no scene do not count, so a menu cannot spend it). A measured
# frame is sixteen targets, written at every fourth texel of every fourth
# row -- about 20 MB of files into edvr_logs\dumps\, one visible hitch, one
# dump per arming. 0 or empty is off and the only shipped state. Live;
# re-arming needs the key cleared and set again.
#eye_split = 0

# Developer instrument: draw the deferred lighting resolve through a
# replacement shader that answers a question instead of lighting the scene
# (docs\eye-split.md, and the disassembly notes beside it).
#
# For the planetary body that renders as a featureless black disc in one
# eye. The eye-split dump placed the loss between two stages -- the surface
# reaches BOTH eyes' geometry buffers and one eye loses it during lighting
# -- and the single draw between them is this resolve. Its disassembly,
# with this rig's measured constants substituted in, multiplies BOTH the
# diffuse and specular terms by one value out of a buffer no instrument
# here has ever captured: those buffers are render-target slots 1 and 2 of
# the terrain pass, and the census and eye_split both read slot 0 only.
#
#   white    the resolve emits a constant. The pass covers the whole
#            screen, so the view goes white -- and any region that does NOT
#            is where the pixel shader's output is being rejected AFTER it
#            runs: stencil, blend mask or predication, none of which the
#            census records and the last of which is invisible by
#            construction. A body-shaped hole in one eye names that class.
#
#   inputs   the resolve emits its own inputs -- red the flag byte, GREEN
#            the multiplier above, blue the shadow mask. A body showing
#            green in one eye and not the other is the answer.
#
# Field result 2026-08-31: "white" emits a CONSTANT, reading nothing at
# all, and the affected eye's body stayed black -- so nothing about the
# pass's inputs can be the cause, and its output is being rejected after it
# runs. Only the body goes dark while the same draw lights the rest of the
# frame, so the rejection is per-pixel, which leaves the depth test and the
# stencil test. Depth is known written in that eye, because the disc
# occludes the star field. Hence the three state modes, which leave the
# game's own shader alone:
#
# Words may be joined with '+' -- at most one shader word and one state
# word. "white+noboth" is the combination that matters: a shader that
# cannot output black, with nothing able to reject it per pixel. If a
# body-shaped dark region survives THAT, the write lands and something
# later paints over it, which points at the draws after the resolve rather
# than at the resolve. A whole spec is refused rather than half-applied.
#
#   nostencil  the game's own depth-stencil state, copied, with the STENCIL
#              test disabled and every other comparison, mask and pass-op
#              left as the game set it. A body that appears can then only be
#              the test that was turned off.
#   nodepth    the same, with the DEPTH test disabled.
#   noboth     both.
#
# If nostencil restores the body, that is the mechanism AND the shape of a
# fix: force that state for the affected eye's resolve.
#
# noblend (2026-09-01) is the remaining rejection path: the resolve draws
# with NO blend state -- the API default, blending off, every channel
# written, full sample mask -- and the game's own state, factor and mask
# go back after each draw. The white run showed the replacement's constant
# landing in one eye and not the other with depth and stencil both off,
# and the blend unit is the one stage after the shader nothing had yet
# probed or recorded. Joins the others with '+': white+noboth+noblend
# runs all three; noblend alone draws the game's own lighting through a
# clean blend, which is the fix-shaped test.
#
# Live; the scene will look very wrong while set, which is the probe
# working. Any failure to compile or create the shader stands down and the
# game draws its own, with the reason in the log. off is the only shipped
# state.
#resolve_probe = off

# Developer instrument (the black planet in the right eye, 2026-08-31):
# issue ONE named draw with a different stencil reference and change nothing
# else about it.
#
# Two weeks of skipping draws one at a time found nothing -- every draw in
# the failing eye's lighting pass has now been dropped without the body
# appearing. What separated the eyes was a count, not a skip. Grouping a
# census by render target splits a frame into its two eye passes, and the
# second eye's is periodically missing exactly four draws, always all four
# or none, never once absent from the first eye across eighteen recorded
# passes. Skipping those four by hand in the working eye changes nothing you
# can see, so they are not the body -- they mark a decision taken upstream.
#
# Diffing the SAME eye between a frame that has them and a frame that does
# not leaves one other difference. 9BFC7FD232328391 -- 1800 vertices,
# writing all four channels, drawn where the four belong -- runs with
# stencil reference 8 in the frame the body survives and 16 in the frame it
# is black. Every other draw in the pass is identical. That reference is a
# CPU-set value, so it is the game choosing a number, not a race.
#
# vs:HASH:REF -- the 16-digit hex the census logs as vh=, then the reference
# as a plain number 0 to 255. The game's own depth-stencil state OBJECT is
# re-bound unchanged, so its comparisons, masks and pass-ops stay exactly as
# the game set them and only the number beside it differs; anything that
# changes is attributable to that number alone. Both are restored after
# every draw.
#
#   vs:9BFC7FD232328391:8    the body should APPEAR in the failing eye
#   vs:9BFC7FD232328391:16   it should VANISH in the working one
#
# Run both. The second is the confirmation the first cannot supply on its
# own. The log counts how often the game had already chosen the reference
# being forced and how often it had another, because the fault is
# intermittent -- a run whose "something else" count is zero never
# reproduced the state being tested, whatever the picture looked like.
#
# Live. A spec that is not vs:HASH:REF is refused whole rather than
# half-applied, with the reason in the log. off is the only shipped state.
#stencil_probe = off

