# ============================================================================
# [log]
# ============================================================================
[log]

# EDVR writes a short plain-text log to edvr_logs\ next to the game. If you
# report a problem, paste the whole file -- it is small and contains nothing
# personal. 0 stops it.
enabled = 1

# Where the log goes. Empty means edvr_logs\ next to the game.
#dir =

# Stop writing once the log reaches this many megabytes; the log then says so
# once, at its end. The memory watch's mem: lines are the one exception: they
# go on from a fixed reserve of 1 MiB a session, and the log says when that is
# spent. 16 is the default since 2026-10-01 (it was 4): a long
# session, or one with freeze lines in it, reached 4 MB and went silent. A line
# that says max_mb = 4 here keeps 4. 0 never stops it. The flat edition reads
# this key from edvr-flat.ini first, then from this file, with the same default.
# With on_foot_detail (below) on, a cap you have not set here is 64 instead.
# Needs a game restart: it is read once, when the log opens.
#max_mb = 16

# A detailed log on foot. off (the default) writes a summary line every 10
# seconds for each measurement EDVR takes on foot, and every event (a press,
# a boarding, a reset, an error) as it happens. on writes a line a second for
# each measurement, the per-frame traces and the lines of features that are
# settled: the log grows by about 4 MB a minute on foot. Turn it on when you
# are asked for a detailed log. Live. When it is on as the game starts and
# max_mb above is not set, the log's cap is 64 MB instead of 16; the cap is
# read once, when the log opens, so turning this on later keeps the cap the
# log opened with.
#on_foot_detail = off

# How much text may queue in memory between two writes to disk, in megabytes.
#
# Not the same thing as max_mb. EDVR hands lines to a background thread that
# writes them every 250 ms; this is how much may pile up in one of those
# gaps. Anything past it is DROPPED, and the log says so where it happened.
#
# It matters for one thing: a draw census emits a line per draw for a few
# whole frames, which at 90 Hz is over in about 20 milliseconds, so the whole
# capture arrives inside a single gap. Measured 2026-09-07, one frame of a
# busy scene is about 3,900 lines and just over a megabyte -- and at the old
# one-megabyte buffer every census taken lost its tail, including the table
# that says what each @N in it refers to, which made the rest unreadable.
#
# 16 covers a three-frame census of a dense scene. It is a ceiling on what
# may queue, not memory EDVR holds: the buffer starts small, grows only as
# far as a burst takes it, and is handed back afterwards. Raise it if a
# census still reports dropped lines; the ceiling is 256.
#
# Needs a game restart: it is read once, when the log opens.
#buffer_mb = 16

# How often EDVR adds an "alive" line to edvr_breadcrumbs.txt, in seconds.
#
# The breadcrumb file is the one thing that survives a hard crash: the log can
# lose its last buffer, this cannot. Without a heartbeat it only ever recorded
# startup, so a game that died after two hours left a trail identical to one
# that died after thirteen seconds -- which is why a crash report can arrive
# with nothing in it. Each line carries a frame number, so two of them together
# say whether frames were still arriving at rate when it stopped.
#
# The cost is one small file write at this interval, made by a small thread of
# EDVR's own (the render thread only hands it the frame number), so a slow or
# filtered disk can delay the line but never a frame. Set it to 0 if you would
# rather EDVR never touched the disk mid-session, at the price of a crash
# landing nowhere.
#
# Needs a game restart: it is read once, on the first frame.
#breadcrumb_heartbeat_seconds = 30


# ============================================================================
# [d3d11] -- what EDVR reads from the game to know where you are. Read-only
# and narrow; nothing here can see your position, cargo, credits or
# missions.
# ============================================================================
[d3d11]

# Read the game's own journal (the documented file Elite writes for
# third-party tools) for gameplay boundaries: session start, disembarking,
# jumps. Event names only -- no other content is read or kept. 0 turns it
# off; EDVR then falls back to heuristics.
journal_watch = 1

# Bring Elite's window to the front as soon as it creates its swap chain,
# for the launcher/Steam/whatever-else-had-focus case where the game loads
# behind another window. 1 on, 0 off.
focus_on_launch = 1

# Where the journal lives, if your Saved Games folder was moved. Empty
# means the standard place.
journal_dir =


# ============================================================================
# [advanced] -- safety valves, measured tuning and developer instruments.
# The log will name one of these if it ever wants you to change it; nothing
# here needs touching on a normal install.
# ============================================================================
[advanced]

# The flat profile's jitter cycle: how many sub-pixel positions the picture is
# nudged through before the sequence repeats, a whole number from 8 to 64.
# Anything else (a word, 7, 100) reads as 8, the shipped value, and the log
# says so once. More positions give the upscaler more samples of each output
# pixel: the faint pulse a thin bright edge shows as the cycle repeats gets
# slower and may get smaller, and the picture takes longer to settle after a
# cut or a reset. It costs no frame time. NVIDIA and AMD suggest about
# 8 x (output / render)^2 when the game renders below the output: 32 at half
# its size. XeSS-SR automatically uses at least that many phases based on its
# actual evaluation and render sizes, even when this key is left at 8 and even
# when the minimum exceeds this key's 64-phase limit. This setting is flat
# profile only, and the longer cycle runs only on the upstream camera route,
# which is the one it normally uses; the older legacy route keeps 8,
# because its lighting patch refuses a nudge past 7/16 of a pixel. Live: a
# change restarts the temporal history once, and the "flat jitter:" line in the
# log names the count in use (phases=).
# dev: hidden
#temporal_aa_jitter_phases = 8

# The pool probe (docs\per-object-motion.md). It finds the pool of poses
# the scene's vertex shaders read (a buffer of 336-byte records at t33) --
# with fix.temporal_aa on it always does -- so an eye run's ledger can copy
# it every frame of the run for tools\eye_run_ledger.py. 1 also runs it
# without fix.temporal_aa and says in the log when no pool turns up. (The
# per-object motion estimate it once fed -- two frames diffed every eighth
# frame, the rigid motions they carried, the origin's rebasing -- retired
# on 2026-09-23.) Nothing on the draw path but one shader-resource read a
# second; nothing changes on screen. 1 on, 0 off. Live.
#object_probe = 0

# Eye-run depth capture: with an armed eye run (the eye-dump hotkey), also
# save each eye pass's COMPLETED depth -- the depth-stencil texture the scene
# drew into (R32_TYPELESS or the R32G8X24 family), copied the moment the pass
# ends, for the first two frames of the run -- as
# edvr_logs\pool\depth_HHMMSS_f<frame>_<A|B>.bin, one binary file per eye per
# frame (header, then that pass's VS b1 float4 registers [256..336) from its
# first pool-carrying draw -- the view-projection at registers 270..273, the
# eye origin at 275 -- then the depth as plain R32_FLOAT texels; the
# R32G8X24 family is converted at capture, stencil byte dropped). Files
# before 2026-09-22 (version 1) hold registers 64..147 and no camera.
# tools\eye_depth_dump.py reads the files. This is the eval-level culling
# evidence the colour-only eye dumps cannot carry: which submitted pool
# record actually won the depth test at a pixel. Eye A/B is the depth
# probe's scene pair (first-bound pass = A), which this instrument switches
# on by itself even with fix.temporal_aa off. About
# 28 MB per eye per frame at the flight rig's 2665x2632; nothing changes on
# screen; off unless a depth question is open. 1 on, 0 off. Live.
#eye_depth_capture = 0

# Eye-run cull-gate capture: with an armed eye run (the eye-dump hotkey),
# also record what the game's own per-view visibility tests decided for
# every scene object in the run's first three complete frames -- the
# distance/LOD test, the per-view gate, the draw builder's frustum test and
# its per-part test (each part's own sphere, per view), per eye and per
# offscreen view, beside each object's pose, bounding sphere and parts --
# plus the game's view array (every view's planes and camera) and the
# geometry, index buffers and blend state of the first frame's instanced
# scene draws, so the occlusion-culling design (its doc's sections 9 and 10)
# can be priced offline against the depth capture. Files:
# edvr_logs\pool\gate_HHMMSS.bin and version 9 of
# drawstate_HHMMSS.eyemesh.bin; tools\cull_gate_probe.py reads them. Pair it
# with eye_depth_capture = 1. It watches only -- nothing is culled, nothing
# changes on screen -- and costs a few milliseconds on the three frames it
# records and ~80 MB of buffers while armed. Since version 3 of the file it
# also keeps each part's level-of-detail table, once per table, so a
# level-of-detail question is exact offline. 1 on, 0 off. Live.
#cull_gate_capture = 0

# Eye-run pixel probe: with an armed eye run (the eye-dump hotkey), name
# every draw that changes up to four chosen pixels of the run's first
# frame -- vertex/pixel shader hashes, topology, counts, blend and depth
# state -- so a pixel with no known source (wrong depth or motion, no UI or
# holo marking) can be tied to the draw that painted it. Up to 4 "x,y"
# points, normalised eye-texture coordinates (0 to 1), separated by ';',
# applied to both eyes -- for example 0.583,0.50;0.583,0.53. A 16x16 window
# around each point is copied on every eye draw of that one frame and
# diffed at frame end; nothing is changed on screen, and it costs nothing
# unless this is set. Malformed values are refused and logged, not
# half-applied. Empty is off. Live.
#pixel_probe =

# The keyboard gate's probe, a dev instrument for the settings menu
# (docs\settings-menu.md, Phase 0 gate G1): every five seconds, a line
# counting how the game read the keyboard -- DirectInput state and buffered
# reads (and whether the game's own device reached EDVR's hook), the user32
# key-state calls, the keyboard messages through its pump, any WM_INPUT
# (which would mean Raw Input after all) -- and how many the gate zeroed or
# swallowed. Answers which of the three doors matter on a given build. Live.
#input_probe = off

# Local GPU elapsed time from the first covered render command after poses
# through both accepted submits and EDVR follow-up copies. Shown separately
# on Monitor; excludes later mirror work.
# Also logs sparse original-game-draw GPU timing and passed-sample statistics
# in bounded windows, separately from the Monitor interval. These diagnostics
# observe draw calls without suppressing them; query overhead is not a saving.
# Live; off disables the local queries for an overhead comparison.
#app_gpu_timing = off

# Run alongside another mod that also installs as d3d11.dll (EDHM, ReShade):
# rename the other mod's d3d11.dll (e.g. d3d11_edhm.dll), put EDVR's in its
# place, and put the name you chose here. Both then work. Needs a restart.
# Set it once, here: it applies to both the VR and the flat profile. The flat
# profile's own file, edvr-flat.ini, can override it with another name, or say
# "none" to run flat without the chain.
real_dll =

# Pin the brightness fix to one specific shader. Empty means EDVR finds the
# right one itself each launch; only fill this if the log says it picked
# wrong.
exposure_shader =

# The size this rig renders one eye at, when supersampling or an upscaler
# makes it differ from what the headset is handed. Empty is right for
# everyone: EDVR measures it only when needed and says so in the log. Set
# "off" to refuse the measurement, or WIDTHxHEIGHT to pin it. Live.
#eye_render_size =

# RemLok tuning: how much of each eye's width "outer" keeps, from the
# temple inward (0.50..0.95); swap which eye is which if the lines land on
# your nose (the log's "first applied" line is the evidence); and the
# manual overlay scale used only when the angle placement is off or the
# second file is not installed (0.50..1.00). All live.
#remlok_keep_fraction = 0.55
#remlok_swap_eyes = 0
#remlok_scale = 1.0

# Which number in the screen's position data is its distance. Only change
# if panel_distance stops working after a game update.
#panel_distance_index = 47

# Install the render hooks even with both panel fixes off (the jump-flash
# hold reads the camera through them).
#panel_hooks_always = 1

# Ignore the crash sentinel for one launch.
#ignore_sentinel = 0

# TEMPORARY (issue 124, docs\design-game-update-signatures-2026-10-25.md),
# removed when that arc closes. on: once at start-up, on a background thread,
# EDVR runs the signature search it would use to find its hook addresses after
# a game update against the running game, and writes one "game update check:"
# line to the log saying whether every address it found is where the hooks
# already look. It changes nothing the hooks use, and runs only on the game
# build the hooks are made for. off (the default) runs nothing. VR and flat.
#game_update_check = off

# Turn every fix in d3d11.dll off, permanently, without uninstalling
# anything. The crash sentinel already does this for ONE launch after a
# crash; this is the setting for a machine where they crash EVERY launch,
# so the game stops alternating crash and play. The openvr half keeps
# running: the launch recentre and the compositor's own
# fixes never touched this half. 1 is normal.
#d3d11_fixes = 1

# Intercept DirectInput keyboard creation and gate keyboard input while the
# in-headset or flat settings menu is open, so keystrokes do not leak into
# ship controls. 1 (the default) hooks keyboard devices created by the game.
# 0 turns off DirectInput keyboard hooking and leaves input untouched.
#input_gate = 1

# How EDVR hooks the game's render context.
#   auto     let EDVR decide, by asking whose code implements the context.
#            It picks live when the methods are Windows' own and shared when
#            another mod wraps them. The shipped default; the log names which
#            one it chose. This is what makes the launch crash (issues #20 and
#            #21) fix itself with no setting here at all -- auto used to pick
#            private, and private is the mode that hung.
#   shared   patch the table the game shares with every other tool. Composes
#            with wrappers; anything else that writes those slots can bypass
#            EDVR's fixes, and EDVR says so in the log when it happens.
#   private  give the context a FROZEN copy of the table to itself. A tool
#            that writes the shared table cannot bypass EDVR's fixes, but the
#            copy is a snapshot: it does not follow the runtime if the runtime
#            re-points its own entries, and on a rig where Windows' d3d11.dll
#            re-lays the table mid-frame that snapshot desyncs and hangs the
#            GPU a second or two after launch (issues #20/#21). The older
#            mechanism, kept only as an escape hatch -- live supersedes it.
#   live     give the context a table to itself in which every entry reads
#            the game's own entry at the moment of each call. Keeps what
#            private buys -- nothing else can write the table the context
#            dispatches through -- and gives up the snapshot, so the runtime
#            may change its own entries as often as it likes and the next
#            call follows. Costs two extra jumps per call, which is nothing
#            anybody has been able to measure. This is what auto chooses when
#            the methods are Windows' own.
# Only change this against a log. auto already avoids the launch crash; if the
# game still dies a second or two after "arming d3d11 hooks", try shared. If
# shared keeps the game alive but the log then says EDVR's hooks are being
# pushed out of the table, live is the one to set by hand: it is both
# unbypassable and never out of date. Please report whether it helps, with
# both logs. Needs a game restart.
#context_hook_mode = auto

# Developer instrument: name whoever writes to one of the render context's
# function-table slots. 0 is off; any other number is the slot to watch.
#
# Every other line in the log that names a module for a slot is naming the
# POINTER FOUND THERE, not the code that stored it. This makes the slot's
# page read-only, catches the next write, and reports the instruction that
# did it -- the author, with no guessing. Needs context_hook_mode = shared.
#
# ARMED, EVERY WRITE ANYWHERE ON THAT PAGE TAKES AN EXCEPTION, and a page
# holds far more than one table. For one short session with a purpose; set
# it back to 0 afterwards. It stops on its own once it has seen enough.
# Needs a game restart.
#vtable_writer_probe = 0

# Developer instrument: log every change to the render context's function
# table -- what changed, from what to what, when, and who did it.
#
# The probe above names whoever writes to one slot. This answers the
# question a crash report needs instead: the game's own function table is
# rewritten constantly, almost always with the values it already held, and
# the interesting event is the rare write that puts something DIFFERENT
# there. Writes that change nothing are counted and dropped. Writes that
# change something get a line with the frame number, the time to a tenth of
# a millisecond, the slot, both values, the instruction that did it, which
# thread it was on and how it was reached -- and the first few are also
# written to edvr_breadcrumbs.txt, which survives the game being killed by
# a hung graphics card. A long frame and the once-a-second table check each
# print the last few as well, so a log that ends in a crash says whether
# the table changed before it or after.
#
# In the shared hook mode the table churns constantly -- the game's own
# graphics runtime writes its entry back over EDVR's hook, every frame -- so
# the per-change lines stop early there, after 4000 of them. (EDVR's own
# writes are not in the list at all: it opens the memory before writing, so
# those never reach this.) The running tally of who changed what carries on
# to the end of the session either way, and the closing summary says where
# the lines stopped.
#
# ARMED, EVERY WRITE ANYWHERE ON THAT MEMORY TAKES TWO EXCEPTIONS, which on a
# healthy machine is hundreds a frame; the closing summary says what that
# cost, in milliseconds per frame. It switches itself off, loudly, if that
# ever passes 4 ms a frame -- but never in the first ten seconds, because the
# crash it exists for happens in the first two. It also stops after two
# million caught writes, whichever comes first. One short session with a
# purpose, then back to 0. Only one of this and vtable_writer_probe can be
# armed at a time -- the log says which one is holding it if both are asked
# for. Needs a game restart.
#vtable_flip_timeline = 0

# Developer instrument: install the private table with NOTHING in it.
#   off    normal
#   swap   the render context gets a byte-identical private copy of its
#          function table and no fix is installed on it at all -- every
#          call runs exactly the code it always ran, from a new address.
#   live   the same, except every entry reads the game's own entry at the
#          moment of the call, so nothing can ever be out of date. The only
#          thing that is not stock is where the table lives.
# For a machine that dies seconds after the private-copy mode goes in:
# if it still dies with swap, the copy itself is fatal and no fix was ever
# the cause; if it lives, a fix is. If swap dies and live lives, what was
# fatal was the copy being a SNAPSHOT rather than the copy existing, which
# is a different thing to fix. Every d3d11 fix is off while either is set.
# One session each, then back to off. Needs a game restart.
#context_hook_probe = off

# Developer instrument: name the frame scheduler that drives the engine's
# kinematic/bucket worker entries (docs/engine-render-pipeline.md stage 0).
# Every worker entry is invoked only through a vtable-table callback stub, so
# no static read of the binary can say who calls them. This watches the four
# scheduler-fed entries (the two worker entries, the per-record drain and the
# reset+repopulate) and captures, read-only, the return addresses on the live
# stack at each entry -- one bounded scan, hashed into a signature, counted
# per target. 0 is off (the shipped state). One session with a purpose, then
# back to 0. What a flight tells you: ONE VA recurring at a consistent frame
# position across signatures is the dispatcher; VAs in 0x1462b0000..0x1462c0000
# or 0x145dd0000..0x145dde000 are the table stubs (the caller above the stub
# is the scheduler); anything else named in .text is a scheduler candidate
# directly. Totals and the top three signatures per target print every 20 s.
# Needs a game restart.
#scheduler_probe = 0

# Flat camera producer probe (docs/design-flat-camera-integration.md, the C1
# step): who computes the scene CB's camera rows. on hooks the game's
# Ghidra-validated single-site constant-upload helper (executable patch, the
# same mechanism as the write watches), learns the 5376-byte staging block,
# and arms a bounded hardware write breakpoint on its camera-row span -- the
# writer's RIP is named with a bounded stack. Budgets: 8 blocks, 8 re-arms, 8
# writers, 30 s armed; every budget says its name when reached. Diagnostic
# only; off is the shipped state. Live (hot-reload), no game restart needed.
#flat_camera_producer_probe = off

# CPU timing in the log (flat profile only): on times EDVR's own work on the
# render thread, and the engine-motion hooks on the game's threads, and the
# "flat cpu 5s" lines then carry the milliseconds a frame by part. Off, the
# default, those lines still carry the Present times, the GPU spans and the
# call counts, say the timing is off and say how to turn it on, and no clock
# is read. On costs a frame in sixteen several milliseconds at a busy
# settlement (a stutter a few times a second) and about a quarter of a
# millisecond a frame on average, so leave it off unless asked for a log with
# it. The environment variable EDVR_FLAT_CPU_CLOCKS=1 (or 0) decides it
# either way. Live (hot-reload), no game restart needed.
# ui: CPU timing in the log | live | menu debug
#flat_cpu_timing = off

# Flat refusal view (flat profile only), the motion source view: on paints,
# over the resolved image, the motion each pixel got and why the temporal pass
# refused a pixel's history (its per-pixel class, in the colours the log line
# names: green the engine's exact record, blue the camera term, red, yellow,
# pink, orange, cyan and white the refusals), so a jagged edge says why.
# Diagnostic only; off is the shipped state. Live (hot-reload), no game
# restart needed.
# ui: Motion source view | live | menu debug
#flat_refusal_view = off

# VR camera census (design doc section 82, "Pre-build findings"): which camera
# is which at the game's view-constant refresh, so the on-foot world route's
# jitter can reach the world's camera and never an eye's. on installs the hook
# the flat camera path uses (EliteDangerous64.exe+0x592360) in an OBSERVE-ONLY
# mode: it never writes a bound pair, a dirty flag or a row, and the flat
# runtime is never asked anything. It logs "vr camera census" lines, about four
# hundred a session at most: a 5 s line (calls, calls on other threads, kinds,
# callers, distinct cameras, where in the frame the calls fall against the tone
# draw), one line per distinct camera with its field signature and the view it
# belongs to, the whole call sequence of the first three on-foot frames, and,
# at the eye composite draw of the first four on-foot frames, the eye's own
# constant-buffer rows read back from the GPU (a stall of a few milliseconds
# each, eight times a session). An on-foot frame is one in which the tone is
# drawn while Elite's own journal says on foot; with no journal the tone alone
# decides, and with no tone (the world route reports no draw progress) the
# journal alone does. Read it with python tools\edvr_log.py --camera-census.
# While it is on, the world route also counts the pixels its resolver refuses
# (stage 2 experiment build): one frame in four, a small compute pass over a
# class byte per pixel, summed by cause on a "vr world route refusal 5s:" line,
# which splits the stale-slot pixels into stale-refused and stale-kept (what
# the steady-detail depth check, always on, kept). The line is printed while the
# census is off as well, carrying only the depth check's frame counts.
# VR profile only: the flat profile reads it as off. Diagnostic. Zero mutation.
# Off is the shipped state. Live: on installs the hook at the next frame; off
# stops the census and leaves the hook in place, inert, until the game exits.
# dev: choices off, on
vr_camera_census = off

# Developer instruments for isolating which draw makes an effect: skip
# eye-texture draws matching a census spec ("X:15360", ranges and @ filters
# supported, or "vs:4435F2E50020E7F3" to skip everything drawn by one
# vertex shader -- the census logs each draw's shader as vh=, and two
# effects sharing a pipeline can still be told apart that way), skip draws
# into an offscreen buffer named by size, or skip by position in the frame
# and bisect. Live; empty is off, and off is the only shipped state. The
# log counts what it drops.
#
# census_skip_offscreen also takes an optional draw spec after the size:
# "4259x2395" skips everything drawn into that buffer, "4259x2395:X:2508"
# skips only the indexed-instanced draws with 2508 indices. A size alone
# answers "is the thing built in here"; the spec answers "which draw".
#
# The particle billboard family, mapped 2026-08-29 by disassembling every
# vertex shader in a shader dump (advanced.glare_shader_dump) and looking
# for the construction docs/particle-billboards.md describes: a quad basis
# built once from the camera, cross(cb1[278], cb1[279]) -- cameraUp with
# cameraForward. That pair, crossed, is the fingerprint of this bug in any
# dump. SEVEN shaders carry it, and fix.particle_billboard now replaces
# two of them:
#
#   vs:EB787F983BC1F5A3   the geyser and smoke plume -- REPLACED
#   vs:6041FD2D3D0164E1   the solar flare -- REPLACED (found this way)
#   vs:9AEC596A2B036EA6   the witchspace starfield -- NOT replaced, and
#                         must not be: 0.12.3 gave it the flare's
#                         replacement on a likeness and the starfield
#                         vanished. It writes the same values to different
#                         output registers under different TEXCOORD
#                         indices, so it needs its own transcription or
#                         nothing at all.
#   vs:9F4BBCFCD3B68BC9
#   vs:78F5F08D02EE38CC
#   vs:BBAD1CA808E1E292
#   vs:1B285CBC9F185D4D
#
# The last four are the same bug on effects nobody has named yet. To find
# which of them draws an effect, park where it is visible and set
# census_skip to one at a time -- the key is live, so no restart is needed,
# and the effect disappearing names its shader.
#
# Two things the flare hunt cost, worth not paying twice. A dump holds only
# shaders CREATED in sessions that ran with the dump on, so it records
# scenes visited rather than the game: the flare's shader was in no dump,
# and a sweep over the dump could not have found it. And these shaders do
# NOT share a signature -- the plume is 13-in/12-out, the flare 10-in/5-out
# -- so a replacement cannot simply be pointed at another hash; each
# signature group needs its own transcription.
#
# DB113566B6A59C5B shares the family's inputs but selects a supplied axis
# or world up instead of the camera, and guards its length BEFORE dividing.
# It is what a correct one looks like inside the game; read it first.
#census_skip =
#census_skip_offscreen =

# Developer instrument: re-issue ONE batched draw without some of its
# rectangles. WIDTHxHEIGHT:KIND:COUNT:LO[-HI] -- the draw of that shape
# into that offscreen target is drawn as the indices before quad LO plus
# the indices after quad HI, six indices to a quad. Elite batches its solid
# UI rectangles, so skipping the whole draw takes a dialog and the wash
# behind it together; this is how one of them gets named. Live; empty is
# off, and off is the only shipped state.
#census_skip_quad =

# With census_skip_quad set, CLIP its quads to a centred box instead of
# omitting them: fractions of the target, 0 to 1, and both must be set.
# For a dark rectangle that is not unwanted but the wrong SIZE -- it spans
# the view when it only needs to sit behind a dialog. Empty or 0 keeps the
# omit behaviour. Live: change and look.
#census_clip_width =
#census_clip_height =

# Developer instrument: read the RECTANGLES a draw paints.
# WIDTHxHEIGHT:KIND:COUNT[:SKIPFRAMES] names a draw signature into one
# target -- any target, the eye textures included. COUNT is INDICES for
# kinds I and X (six to a quad) and VERTICES for D and N, where the only
# shape read is a four-vertex strip quad. After letting SKIPFRAMES matching
# frames pass (the first is usually mid fade-in -- 120 waits out about two
# seconds for steady state), the next frame containing a match has EVERY
# draw of that signature copied, each from ITS OWN vertex buffer, and each
# occurrence's quads are logged -- extents, viewport and scissor, plus the
# vertex bytes past the position, where a colour or uv would live. Two
# same-signature draws with different extents are different rectangles
# sharing one widget, which is what a census, matching by signature, can
# never show. One capture per session; re-set the value to ask for
# another. Empty is off.
#quad_probe =

# Developer instrument: hold the quad probe until this many milliseconds
# into the session, then let its SKIPFRAMES count start. 0 is off.
#
# The skip counts MATCHING FRAMES, which is right for "let the fade-in
# finish" and wrong for "wait until the intro movie is over": the movie
# plays at about 178 frames a second on the measured rig and the menu
# behind it runs at 13, so a skip big enough to clear the movie leaves you
# sitting at the menu for minutes while the rest trickles past. This says
# the same thing in the unit that survives a frame rate changing under it.
# Both have to be satisfied, so "thirty seconds in, then two seconds of
# steady frames" is expressible; neither alone can say it. Live.
#quad_probe_at_ms = 0

# Developer instrument: arm a census at named moments after the session's
# first frame, in milliseconds -- up to eight, comma separated, e.g.
# "1000,4000,9000". Everything else that arms a census needs something
# known in advance (a hand on the census key, a journal event, or the size
# of a target somebody already censused), and the startup has none of
# those: it is over before a human reacts, and for its first phase the
# size of one eye has not been published to the d3d11 half yet. These
# censuses record offscreen draws whatever census_offscreen says, since
# that is the only thing worth aiming them at. Read once, at the first
# frame -- editing it mid-session does nothing. Empty is off.
#census_at_ms =

#census_skip_range =

# Developer instrument: skip compute DISPATCHES by shader hash -- the hash
# the census logs as "ch" on DCX lines -- up to four comma-separated. The
# draw skips' completing half: the FSS black-square stack is built by
# compute (a per-eye 16x16-tile mask with no draw to skip), and a system
# only compute touches needs its dispatches skippable to be localised live.
# The scene may look very wrong while set; that is the probe working. Live;
# empty is off, and off is the only shipped state. The log counts drops.
#census_skip_dispatch =

# Developer instrument: make the draw census (the dump_draws key) also record
# draws that land OUTSIDE the eye textures, logged as DCO lines. Off by
# default, because a full scene is thousands of draws a frame and three frames
# of that spends the census line cap on the way past.
#
# Turn it on when the question is "where is this actually drawn". An FSS
# census in 2026-08 showed 220 eye draws a frame, and skipping both of its
# largest families removed nothing visible -- the bodies on screen were being
# built in an offscreen target and composited in, where the eye-sized gate
# could not see them. The r= column on a DCO line names that target, and the
# interned table at the end of the census gives its size.
#census_offscreen = 0

# Developer instruments: how many whole frames one census records, and how
# many lines it may write. The defaults (3 and 4096) are right for the
# steady-state diffs the census was built for; a capture that has to span a
# progressive build -- the FSS body tiling in after a zoom -- wants the
# window long (30) and the cap high (16384, about 2.3 MB of log), or the tail
# of the build falls off the end. Read when a census starts. The cap counts the
# offscreen draws, copies, clears and dispatches; the eye draws (DC) have a
# budget of the same size of their own, so the offscreen ones cannot push the
# lit eye's frame out of the log.
# Name a render target by size and the colour every clear gives it is
# logged, up to eight times. For finding a wash that no draw paints --
# a buffer's clear colour is invisible to any draw census, however the
# spec is written. Nothing is changed; empty is off.
#clear_probe =

#census_frames = 3
#census_lines = 4096

# Developer instrument: arm a census AUTOMATICALLY the first time a draw
# lands in an offscreen target of exactly this size after two quiet seconds,
# as if the dump_draws key were pressed at that moment. One WIDTHxHEIGHT;
# empty is off. At most 8 firings a session; re-saving the ini resets the
# allowance. The census it arms records offscreen draws even if
# census_offscreen is 0, since an offscreen build is the only thing worth
# aiming this at.
#
# It exists because a keypress census records what the scanner looks like
# AFTER it settles -- human reaction lands twenty frames late -- and the FSS
# ring bug lives only in the build frames. Set this to the body target's size
# (2170x2142 on the measured headset; check your own census's interned
# table), open the FSS, and zoom onto a ringed body: the census arms itself
# on the first build draw and catches what no keypress can.
#census_auto =

# Developer instrument: while a census runs, every recorded draw whose vertex
# shader matches this hash (the census's vh= column) also dumps the CONTENTS
# of its b0 constant buffers -- vertex and pixel stage -- as DCW lines: the
# bytes the GPU reads for exactly that draw, captured from the game's own
# writes. Same-frame dumps pair by q; diffing eye A's against eye B's is how
# a per-eye value hiding in shared buffer objects gets caught. Empty is off.
#
# For the FSS ring split: 953C8123AD8DC13B is the composite that pastes the
# scanner body into each eye. Its textures are measured identical between
# the eyes (2026-08-25); its constants are the channel the census cannot
# otherwise see.
#
# Also matches COMPUTE shaders (2026-08-26): a dispatch of a watched hash
# dumps its CS b0 and b1 the same way (slots x and y in the DCW lines), and
# a second comma-separated hash watches two shaders in one census -- built
# for the reconstruction pair E861F611375E7ECC,B74273EC13F7CD59, whose
# shared 80-byte block is the per-eye-rewrite idiom this key exists for.
#census_cb_watch =

# Developer instrument: which constant-buffer SLOT census_cb_watch reads,
# 0 to 13. 0 is b0 and the old behaviour.
#
# It was b0 and only b0, and twice that has been the wrong buffer: the
# loading wash's pixel shader reads b2, and the intro movie's panel is
# placed by a scale and a transform in its VERTEX shader's b2. Both times
# the census reported "no constant buffer" for a draw whose whole
# behaviour was in one, because the column only looked at slot zero. Set
# this to 2 with census_cb_watch naming the shader to dump it.
#census_cb_slot = 0

# Developer instrument: write every shader the game creates to
# edvr_logs\shaders, for reading a draw's own code when a fix needs it.
# Costs file writes during loading; needs a restart.
#
# Vertex, pixel AND compute (vs_, ps_, cs_ by content hash). Compute was
# added 2026-09-07: their hashes had been recorded on census dispatch lines
# since the hook was written, so a capture could name one and nothing could
# read it. Two of them turned out to be reading the scene depth's stencil
# plane, which is a thing a fix needs to know before it writes there.
#glare_shader_dump = 0

# Curved-screen tuning. The sign is 1 for "toward you", correct on the game
# build this was measured against; -1 is the escape hatch if an update
# flips the panel transform's handedness. Segments is how many columns the
# screen is cut into -- 64 is far past what the eye can see, and below
# about 8 the screen visibly facets. The gain is the bend's depth scale in
# the panel's own units: EDVR reads it from the game automatically, and
# this overrides that reading if a game update moves it (0 = use what was
# read).
#panel_curvature_sign = 1
# dev: range 1..256
#panel_curvature_segments = 64
#panel_curvature_z_gain = 0.0

# Texture filtering, for the shimmer a repeating pattern makes on a
# distant surface -- a station's ribbed panels, a hull's hatching. That
# is a mip chosen sharper than the pixel covers, and nothing at the
# submit door can undo it: the detail was never sampled. anisotropy
# forces the game's plainly linear and anisotropic samplers to that
# many taps (1 to 16); lod_bias adds to their mip choice, positive for
# blurrier and quieter, negative for sharper. Point, comparison,
# minimum and maximum filters are never touched. 0 leaves the game's
# own choice alone; the log's texture filtering
# census says what it asked for. Read at device creation, so a change
# needs a restart.
#
# lod_bias also takes "auto", which is the right answer whenever the game
# renders smaller than the headset asks for and something brings it back
# up. Mips are chosen for the size being RENDERED, so an upscaled frame is
# reconstructed from textures blurrier than its output deserves, and the
# correction is log2 of the render fraction: -0.42 at three quarters,
# -1.00 at a half. auto reads that fraction from Elite's own graphics
# preset (its HMDRenderTargetMultiplier) instead of asking you to keep a
# number in step with it by hand, so changing HMD Quality moves the bias
# on the next launch. The log line names the fraction it read and the bias
# it derived, and says so plainly if the preset gave it nothing.
#texture_anisotropy = 0
# Auto is the default with temporal AA enabled; AA off leaves the mip bias
# unchanged unless explicitly overridden. Read at device creation: restart
# after changing AA mode to pick up its default texture bias.
#texture_lod_bias = auto

# --------------------------------------------------------------------------
# Freezes: where the render thread stopped
# --------------------------------------------------------------------------

# on (the default) or off. When the game's render thread goes about 150 ms
# without a Present -- the one-to-two-second freezes some setups see -- the
# log says which module and address it was stuck in, in lines that start
# "stall:". A watchdog thread notices the stall, and at 150, 500 and 1000 ms
# of it stops the render thread for a few tens of microseconds, copies its
# stack, lets it go, and then names the modules on the copy: the game, the
# graphics driver (nvwgf2umx), a chained mod such as EDHM, or an ntdll wait.
# That is the question a freeze report cannot otherwise answer.
#
# It works in this process only, on this one thread, and writes nothing to
# it. While the game is not stalling it costs one store a frame and a thread
# that wakes about seven times a second. At most six stalls back to back, one
# more every two seconds, and two hundred a session, so a bad session cannot
# fill the log with them.
#
# off starts no thread and takes no sample. The LONG FRAME and FREEZE lines
# are written either way: they do not depend on it.
#
# Needs a game restart: it is read once, on the first frame.
#freeze_location = on

# TEST ONLY. 0 (the default) does nothing. A value from 1 to 5000 makes the
# render thread sleep that many milliseconds, once, sixty seconds into the
# session, so the freeze lines and the stall sampler above can be checked in
# one flight without waiting for a real freeze: the log shows a freeze of
# about that length and a "stall:" line naming an ntdll sleep called from
# EDVR's own d3d11.dll. It stops the game on purpose; leave it at 0.
#
# Needs a game restart: it is read once, on the first frame.
#freeze_test_ms = 0

# TEST ONLY. 0 (the default) does nothing. A value from 1 to 500 makes the
# OpenXR runtime hold every xrEndFrame it makes that many milliseconds longer,
# for 40 seconds, starting 90 seconds into the session, so the runtime's
# long-xrEndFrame lines and its slow-frame-rate lines can be checked in one
# flight without a headset runtime that misbehaves: the runtime's log shows a
# native_end_frame_episode line for the first held call and its end line, and
# native_slow_regime lines (SLOW, still_slow, end) naming the vendor's
# xrEndFrame; the graphics log shows "slow test:" lines at the start and the
# end. 80 is about the length of the Quest 3 report this was written for (six
# display periods at 72 Hz, 10 fps). It slows the game on purpose; leave it
# at 0.
#
# Needs a game restart: it is read once, on the first frame.
#slow_test_ms = 0

# ============================================================================
# [experimental] -- present but not finished; off by default and safe to
# ignore. Here so the curious can try them and the log can name them.
# ============================================================================
[experimental]

# --------------------------------------------------------------------------
# Night vision
# --------------------------------------------------------------------------

# Experimental alternative appearance: outline geometry instead of fine
# surface textures, without a green fill. Brighten exterior terrain while
# retaining its colour and texture, and exclude cockpit/body surfaces and
# their outlines on the background. Off by default. The normal Night vision
# pulse stability fix remains independent and on by default. Live.
# ui: Realistic nightvision | live
night_vision_realistic = 0

# How bright the exterior terrain and its outlines are with Realistic
# nightvision on, 1.0 to 16.0. It multiplies the light already there,
# keeping the terrain's colour and texture; 1.0 removes the extra lift
# altogether, and 8.0 is the default. Lower it if the ground reads washed
# out, raise it for a darker world. The cockpit and your body stay excluded
# at every value. Has no effect when Realistic nightvision is off. Live.
# moved-from: fix.night_vision_brightness
# moved-from: advanced.night_vision_brightness (default 2.0)
# ui: Night vision brightness | range 1..16 | live
night_vision_brightness = 8.0

# Calm the brightness swing when you tilt your head between a bright console
# and dark space near a star. 0 is the game's own behaviour; 0.7 keeps 30% of
# the swing; 1 holds brightness steady. Only acts around stars -- menus,
# stations and on-foot always run stock. Experimental: it has been flown and
# it works, but how much damping is right is still a matter of taste rather
# than a measurement, and holding brightness still is not always what an eye
# expects. Live.
# moved-from: fix.exposure_damping
#exposure_damping = 0

# How slowly the damped brightness above follows a genuinely new scene, in
# seconds. Larger is steadier but adapts slower. 1..600. Live.
# moved-from: fix.exposure_damping_tau
#exposure_damping_tau = 45

# Render the Full System Scanner's zoomed body -- planet and rings -- at
# full eye resolution instead of the half resolution the game picks. The
# body is a mono image pasted into both eyes; at half size it reads as a
# pixelated sprite, and a thin ring resampled per eye from too few pixels
# can alias differently in each -- segments visible in one eye and not the
# other while a scan resolves (docs/fss-scanner.md). Costs 4x the pixels
# for that one offscreen layer, only while the scanner is zoomed. Live:
# flipping it changes the next FSS zoom, no restart. 1 on, 0 off.
# moved-from: fix.fss_res
#fss_res = 0

# Reconstruct the selected target's direction indicator instead of smearing
# it. stock is the game's own; sharp is the fix.
#
# Selecting a target adds exactly one draw per eye: a quad that composites a
# sub-region of an interface surface into the view, through a pixel shader
# that is -- in full -- one bilinear sample, an alpha discard and a colour
# matrix. The indicator's content occupies a fixed number of surface texels
# however large that surface is (measured: the surface grew 1.635x between
# two headsets and the indicator did not sharpen, and creating it larger
# changed nothing), so the quad always magnifies it by the same factor and
# that one bilinear tap is where the blockiness comes from.
#
# sharp replaces that shader with the same colour maths -- transcribed from
# the game's own disassembly and diffed against it instruction for
# instruction -- over AMD's EASU, an edge-adaptive kernel that is meaningfully
# better than a cubic on thin line art. A rig where EASU will not compile
# falls back to Catmull-Rom and says so.
#
# It CANNOT add detail: no resampler can. Cleaner edges and no bilinear
# diamonds is the whole prize. Live; any compile failure draws the game's own
# shader and says so.
#target_indicator = stock

# How far away the Full System Scanner's screen sits. 1.0 (the default)
# is the game's own distance; 0 inherits panel_distance, so one setting
# places both screens -- opt-in, because with a customised on-foot
# distance it moves the WHOLE scanner UI (field-attributed 2026-08-27:
# inherit at 0.7 shifted everything on zoom). The screen moves along
# your line of sight without changing its angular size -- closer means
# nearer stereo depth, not a bigger picture. Drawn through a replacement
# of the game's own composite shader pair (docs/fss-panel.md); if a game
# update rebuilds those shaders this does nothing and the log says the
# fix never engaged. Live.
# moved-from: fix.fss_panel_distance
#fss_panel_distance = 1.0

# --------------------------------------------------------------------------
# Anti-aliasing: the tuning keys
# --------------------------------------------------------------------------
#
# The switches are under [fix] (temporal_aa and render_sharpness, which
# the installer's settings window shows); what sits here is their tuning
# -- the temporal pass's jitter, weight and clamp -- all live, and worth
# touching only when the log names one. A line left under [fix] or
# [experimental] from an earlier layout still works and is read as the
# new name for that session, with a note in the log saying so.

# --------------------------------------------------------------------------
# Temporal anti-aliasing
# --------------------------------------------------------------------------

# --------------------------------------------------------------------------
# Field of view trim
# --------------------------------------------------------------------------

# Take degrees off the top AND the bottom edge of each eye. The game is told
# a narrower view and given a smaller render target, so DLSS and every
# full-screen pass shrink with it. You lose visible field at the trimmed
# edges; beyond them is black. Costs nothing but what you choose to give up.
# Applies within a second or two, because the game rebuilds its render targets
# when the recommended size changes. Needs openvr_api.dll installed.
#
# All three trims are PER HEADSET: how many degrees you can give up is a
# fact about the lenses in front of you, so the value is a list of
# runtime/system:degrees entries, one per headset, separated by commas, up
# to 8, each 0 to 30:
#
#   pimax-openxr/pimax-crystal-super:10, virtualdesktopxr/meta-quest-3:5
#
# The key for the headset you are wearing is the log's "headset_key," line:
# the runtime name and the headset name lowercased, with everything but
# letters and digits turned into "-". Copy it from there rather than typing
# the names, which contain slashes. These three are set in this file only:
# there is no menu row for them. A headset with no entry gets no trim; a
# bare number on its own (the 5 this key used to take) names no headset and
# is ignored, with the log saying so; and emptying the value clears every
# headset's entry. Live.
# moved-from: fix.fov_trim_vertical
# dev: hidden
fov_trim_vertical =

# The same, on each eye's outer (temple-side) edge. You lose visible field at
# the outer edges; beyond them is black. Per headset, in the same entries as
# the key above (pimax-openxr/pimax-crystal-super:5). Live.
# moved-from: fix.fov_trim_outer
# dev: hidden
fov_trim_outer =

# The same, on each eye's inner (nose-side) edge. This one shrinks only the
# stereo overlap -- the part both eyes see -- not the total field of view, so
# it is the cheapest degrees to give up. Per headset, in the same entries as
# the keys above (pimax-openxr/pimax-crystal-super:5). Live.
# moved-from: fix.fov_trim_nasal
# dev: hidden
fov_trim_nasal =

# --------------------------------------------------------------------------
# Native on foot: weapon readouts
# --------------------------------------------------------------------------

# Weapon UI forward: moves the readout the game draws on the weapon you hold (the ammunition counter), in cm along the weapon's barrel: positive toward the muzzle, negative back
# toward you. EDVR places each weapon's readout from a table of the pilot's own settings; this adds to it for the weapon in your hands, on the readout that is drawn now (the hip's,
# or the sights' while you aim), for adjusting a weapon's readout from feedback. 0 adds nothing. -30 to 30. In native on foot VR only, with the full third-person body. Live.
# moved-from: fix.native_on_foot_weapon_ui_forward_cm
# ui: Weapon UI forward | range -30..30 | step 0.5 | unit cm | signed | live
native_on_foot_weapon_ui_forward_cm = 0.0

# Weapon UI left: the same, across the weapon: positive moves the readout to the left of the barrel, negative to the right. Live.
# moved-from: fix.native_on_foot_weapon_ui_left_cm
# ui: Weapon UI left | range -30..30 | step 0.5 | unit cm | signed | live
native_on_foot_weapon_ui_left_cm = 0.0

# Weapon UI up: the same, along the weapon's up: positive raises the readout, negative lowers it. Live.
# moved-from: fix.native_on_foot_weapon_ui_up_cm
# ui: Weapon UI up | range -30..30 | step 0.5 | unit cm | signed | live
native_on_foot_weapon_ui_up_cm = 0.0

# Weapon UI toward you: positive brings the readout toward your eye along your line of sight to it, negative pushes it away; only its depth changes, not where you see it.
# Applied after the three moves above. Live.
# moved-from: fix.native_on_foot_weapon_ui_toward_eye_cm
# ui: Weapon UI toward you | range -30..30 | step 0.5 | unit cm | signed | live
native_on_foot_weapon_ui_toward_eye_cm = 0.0

# --------------------------------------------------------------------------
# Native on foot: aiming down sights
# --------------------------------------------------------------------------

# ADS eye forward / back: moves your eye along the sight line while you aim down sights, for the weapon in your hands: positive moves it forward (the sights look closer),
# negative back. The eye's depth is the game's own aiming camera for the weapon plus a back-off baked in for the weapons whose camera puts the eye inside the gun, plus this;
# the result is held between 0 and 30 cm forward of the game's aiming eye point, and the eye never goes closer than 6 cm to a part of the weapon it can see on the line of sight.
# 0 adds nothing. -30 to 30. In native on foot VR only, with the full third-person body. Live.
# ui: ADS eye forward / back | range -30..30 | step 0.5 | unit cm | signed | live
native_on_foot_ads_eye_offset_cm = 0.0

# TEMPORARY (F168): Crouched ADS body forward / back: moves your body toward the gun (positive) or away from it (negative), in cm along the direction you aim, while you are crouched and aiming
# down sights, for finding where the body should stand against the gun so the left arm reaches it without folding; your eye and the gun do not move, the body and its arms do. The move
# grows with the crouch and with the sights, so it is 0 standing and at the hip. 0 moves nothing. -20 to 20. In native on foot VR only, with the full third-person body. Live. It is a
# test dial: once the right value is found it becomes the behaviour and this key goes. The default, 1, is the value the pilot flew with.
# ui: Crouched ADS body forward / back | range -20..20 | step 0.5 | unit cm | signed | live
native_on_foot_crouch_ads_body_forward_cm = 1.0

