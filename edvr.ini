# EDVR settings.
#
# This file lives next to EliteDangerous64.exe. Everything here is optional --
# with the file missing entirely you get the defaults below, which are what
# most people want.
#
# Commented-out lines (like "#max_mb = 4") show expert settings at their
# defaults. A normal install never needs them; they are listed so that when
# the log or a support thread names one, you can find it. Uncomment to change.
#
# How each fix works, with measurements, lives in the docs folder
# (docs\*.md) -- this file only tells you what a setting does for you.


# ============================================================================
# [fix] -- the fixes themselves. Everything here is safe to change and most
# take effect within a second of saving.
# ============================================================================
[fix]

# --------------------------------------------------------------------------
# When the eyes disagree
# --------------------------------------------------------------------------

# Stop one eye going darker than the other near bright lights. Elite meters
# brightness per eye, so near a star one eye can dim while the other does
# not. This makes both eyes share one brightness. 1 on, 0 off. Read at
# startup, so a change here needs a game restart; the Scroll Lock hotkey
# toggles it during a session.
# ui: Both eyes share one brightness
share_exposure = 1

# Make both eyes show the same Full System Scanner image. Stock, the
# scanner's zoomed body can disagree between the eyes -- hard-black
# not-yet-resolved tiles in one eye that the other has already filled
# (a stock game bug, reproduced clean; docs/fss-scanner.md and the
# vendor report in docs/frontier-fss-bug-report.md). One key, two
# mechanisms underneath: for a few seconds after each zoom press
# (journal-gated) the left eye's hard-black pixels are filled from the
# right eye's image at your headset's own optical-infinity disparity,
# only inside the scanner screen's measured rectangle, never touching
# the neon wireframe; and the body composite's second eye draws from
# byte-identical copies of the first eye's inputs, so the resolve
# animation cannot split by construction. The squares you still see are
# the game's own scan art, now in both eyes, fused. Needs the
# openvr_api.dll half installed; every stand-down says so in the log.
#
# on | off. Developer values, one mechanism each: heal (the arrival
# fill), mirror (stamp the left's blacks into the right instead), sync
# (the composite input freeze), steady (the constants snapshot). Live.
# Do not run together with fss_composite_probe -- the probe wins and
# this stands aside for those draws.
# moved-from: fix.fss_reveal_sync
# moved-from: experimental.fss_eye_heal
# moved-from: fix.fss_eye_heal
# ui: FSS eye sync | choices on, off
fss_eye_sync = on

# Make the scanned body render in both eyes. Stock, on some machines, the
# planet in the surface scanner (DSS) and the system scanner (FSS) turns
# into a featureless black disc in one eye -- a stock game bug that
# predates EDVR (field-traced and field-VERIFIED 2026-09-01; the write-up
# is docs/scanner-body.md). The game issues the second eye's lighting draw
# with one of its inputs missing, so that eye's lighting lands nowhere
# and the body keeps only its silhouette. This lends the draw the input
# the first eye's just used -- the game uses one and the same for both
# eyes when healthy -- for that single draw, put back exactly as found.
# On a machine without the bug it never engages and costs one state read
# on a handful of draws.
#
# on | off. Live.
# ui: Scanned body in both eyes | choices on, off
scanner_body = on

# --------------------------------------------------------------------------
# The on-foot screen
# --------------------------------------------------------------------------

# Make the space around the on-foot screen pure black instead of glowing
# grey. On an OLED headset the difference is stark. 1 on, 0 off. No effect
# in ships. Live.
# ui: Black surround for the on-foot screen
black_void = 1

# Make the on-foot screen (and HMD Cinema Mode) sharper. Elite renders that
# screen at 1920x1080 regardless of your headset, which is why text on foot
# looks soft. Raise these to fix it. 16:9 sizes only:
#
#   2880 x 1620   just over twice the detail
#   3840 x 2160   four times, a clear improvement
#   5120 x 2880   seven times, if you have the headroom
#
# Costs GPU memory and time in proportion; if your frame rate drops below
# your headset's refresh, step down -- judder is worse than soft text.
# Unlike everything else here, this changes values in the game's memory
# while it runs (never any file on disk). Needs a game restart; the stock
# 1920x1080 below means "off".
# ui: On-foot screen resolution: width | range 640..8192
vscreen_res_width = 1920
# ui: On-foot screen resolution: height | range 360..4608
vscreen_res_height = 1080

# How far away the on-foot screen sits. 1.0 is Elite's own distance; 0.5 is
# noticeably close, 2.0 far. Pairs well with panel_curvature: 0.7 with a
# 0.3 curve is a comfortable on-foot starting point. Live.
# ui: On-foot screen distance | recommended 0.7 | range 0.5..2.0
panel_distance = 1.0

# Bend the on-foot screen (and HMD Cinema Mode) toward you, the way Virtual
# Desktop curves its virtual screen (docs\screen-curvature.md). The number
# is the fraction of a full circle the screen wraps around you: 0 is flat
# and off, 0.1 a gentle theatre curve, 0.3 a comfortable wrap. The screen
# keeps its width, so the edges come nearer rather than the middle moving
# away. Try 0.3 here with panel_distance 0.7 on foot. Live, and composes
# with panel_distance.
# ui: On-foot screen curve | recommended 0.3 | range 0..1 | percent
panel_curvature = 0.0

# --------------------------------------------------------------------------
# The intro
# --------------------------------------------------------------------------

# The launch movie, played properly. Elite draws it on a small head-locked
# rectangle -- 1024x576 pixels, about 27 degrees wide, pinned to your face
# (docs\intro-video.md). "screen" (the default) plays it on the splash's
# own virtual screen instead: world-anchored on the game's forward, sized
# to what the splash after it covers, so the cut between them just works
# -- and resampled first with AMD's FSR so the magnification does not read
# as pixelation. HOW SHARP it can get is your on-foot screen resolution:
# the movie is upscaled to vscreen_res_width above, the same question
# about the same GPU, asked once. "stock" leaves the game alone. The
# world anchor needs openvr_api.dll installed; without it the movie stays
# head-locked and the log says so. Live, though the movie is only there
# for the first half-minute of a session.
# moved-from: fix.intro_video_size (default stock)
# moved-from: fix.intro_video_lock (default head)
# moved-from: fix.intro_video_upscale (default stock)
# ui: Intro movie | choices screen, stock
intro_video = screen

# The backdrop behind the intro and the menu. That picture is stored in an
# old compressed format and is very dark, so its gradients come out
# stepped -- magnified across a headset's field of view the steps read as
# blocks and patches (docs\menu-backdrop.md). "splash" (the default)
# keeps the NICER of the two pictures the game already loaded -- the big
# splash it shows first and normally throws away seconds later -- and
# smooths the banding out of it once, when it first draws. It is the
# game's own art either way; nothing is added to your install. "stock"
# leaves the game alone. Live.
# moved-from: fix.menu_backdrop (default stock)
# ui: Intro background picture | choices splash, stock
intro_backdrop = splash

# Where the loading dialogs' dimming happens. While a loading dialog is
# up the game dims your ENTIRE view -- a frosted wash plus a full-view
# tint -- which is ordinary on a monitor and oppressive in a headset,
# covering artwork far beyond the dialog's edges
# (docs\loading-panel-handoff.md). "screen" (the default) moves that
# dimming where it belongs: the wash and the full-view tint go, and the
# splash screen itself steps back by the same tint instead, exactly while
# a dialog is up. The dialog's box, border and text are the game's own,
# untouched. The intro only -- this retires for the session the moment a
# rendered scene arrives. "stock" leaves the game alone. Live.
# moved-from: fix.loading_panel (default stock)
# moved-from: fix.loading_splash_dim (default on)
# ui: Loading screen dimming | choices screen, stock
loading_dim = screen

# When the handover into VR is paid for.
#
# OFF BY DEFAULT AGAIN, as of 0.12.4. Shipped on in 0.12.1, and users on
# runtimes neither of this project's headsets could test reported the game
# crashing seconds into startup. The cause is understood and fixed, but the
# fix has been proven on two rigs and the crash was on a third, so it goes
# back to something you switch on rather than something you are given.
#
# On OpenComposite, launching in VR costs a pause of about two and a half
# seconds while the runtime throws away the session it started with and
# builds a new one for the game's graphics card. SteamVR does not do this
# at all, and neither does Elite -- the game behaves the same on both.
#
# "stock" (the default) leaves that pause where it falls, which is inside
# the game's first call to the compositor -- part-way through the launch
# movie, so the movie freezes and comes back several seconds further on
# than it should. That is the freeze OpenComposite users learn to press
# Escape past.
#
# "early" pays it sooner, before the game asks for the compositor at all:
# EDVR hands the runtime a single one-pixel frame on the game's own device,
# which is the same thing the game does a moment later. The pause is the
# same length. It costs you nothing, because the game runs its VR startup
# on a different thread from the one drawing your frames, and at that point
# in the launch the game is drawing nothing anyway. The movie then plays
# from its start.
#
# On SteamVR "early" is free: the runtime declines the one-pixel frame
# straight away, in under a millisecond, because it has no session to
# rebuild. There is nothing to turn off.
#
# IF THE GAME CRASHES during startup, set this back to stock -- and please
# report it with both logs, because that is the one thing this project
# cannot test for itself.
#
# What is left on either runtime is a single stutter as the picture arrives
# in the headset -- a few hundred milliseconds usually, and up to about
# eight tenths of a second the first time you launch after an update. That
# is the game and the runtime setting aside memory for your eyes, it is
# there with "stock" too, and it is not this setting's to move.
#
# Needs d3d11.dll installed as well -- the frame has to be made on the
# game's device, and that is the half that knows it. Without it this
# quietly does nothing and says so.
#
# Takes effect at the next launch: the whole point is a thing that happens
# once, during startup, and by the time you could change this it is done.
# retired-default: early
# ui: VR handover | choices stock, early | restart
vr_handover = stock

# Start every session with the world centred on you.
#
# OpenComposite puts your play space somewhere different every time the
# game starts. Measured across five launches with nobody moving, it placed
# the player 0.6, 3.5, 0.1, 4.2 and 0.3 m from where the game thinks the
# middle of the room is. Anything the game hangs in its world then lands
# somewhere new each launch -- the splash screen, the loading screens, and
# the intro movie with them. That is why the splash is sometimes in front
# of you, sometimes beside you, and sometimes directly behind. SteamVR does
# not do this, and neither does Elite.
#
# "auto" (the default) turns this on only where it is needed. EDVR works
# out which runtime is underneath from what its openvr_api.dll exports --
# neither one carries a readable name -- and only OpenComposite has been
# measured moving its centre about. On SteamVR auto leaves everything
# alone, checked on a real install. "on" and "off" decide it yourself.
#
# When it is on, EDVR asks the runtime, once, to put its own centre where
# your head is. It is the recentre you would have reached for, done before
# you noticed you needed it. Nothing is taken out of your movement
# afterwards: the runtime's own space moves, and everything else follows
# from that.
#
# It changes where you START, not what you are looking at: your height is
# untouched, so is which way you are facing, and your controllers move with
# you rather than staying behind. Walking about works exactly as before.
# Needs openvr_api.dll installed.
#
# Live, with one wrinkle worth knowing: it centres on wherever you are when
# it first runs. Switch it on mid-session and it centres on you THERE,
# which is just a recentre; the launch behaviour is what you get after a
# restart.
# ui: Centre the world on you at launch | choices auto, on, off
launch_centre = auto

# --------------------------------------------------------------------------
# Jumps, stars and smoke
# --------------------------------------------------------------------------

# Stop the one-frame flash of a wrong viewpoint when you jump, drop out of
# supercruise, or close the galaxy map. The bad frame is caught and the
# previous good one is shown in its place. NEEDS openvr_api.dll INSTALLED
# TOO (see the README). 1 on, 0 off. Needs a game restart.
# ui: Stop the one-frame flash on jumps
transition_flash = 1

# Stop the sun's glare riding your head (docs\sun-glare.md). The game draws
# a star's whole glare -- corona, smudge, beams, rays, lens flare -- flat on
# your view like a camera overlay: it rolls when you roll and the beams stay
# pinned to your face. The star's own disc is separate and never touched.
#
#   realistic  the glow a real eye would see: corona and smudge anchored in
#              the world, steady under every head motion, identical in both
#              eyes. Camera artifacts (beams, rays, lens flare) removed.
#   vivid      everything drawn: corona, smudge and beams locked to the
#              world, the lens flare keeping its slide across your view --
#              the movie-camera look without the head coupling.
#   stock      leave the game alone.
#
# vivid is the default. Live -- swap modes mid-flight and compare.
# ui: Sun glare | choices vivid, realistic, stock
sun_glare = vivid

# Stop smoke and steam plumes swimming as you look around
# (docs\particle-billboards.md). The game builds each particle's quad
# against the camera's own up vector, so tilting your head -- or swinging
# the camera on foot -- rolls every puff of smoke with you. "steady"
# builds them against world up instead: they still turn to face you, but
# a rising plume stays upright in the world. Geysers are where this shows
# most. "steady" is the default; "stock" leaves the game alone. Live.
# ui: Smoke and steam plumes | choices steady, stock
particle_billboard = steady

# Whether the hyperspace tunnel keeps its starfield. "on" is the game's own
# behaviour and the default; "off" leaves the tunnel empty, so a jump is
# the swirling walls and nothing streaking past inside them.
#
# This exists because 0.12.3 emptied that tunnel by accident -- a fix aimed
# at solar flares was pointed at the starfield's shader by mistake -- and a
# player who saw it asked to keep it. It is done properly here: the draw is
# withheld, not corrupted, so nothing else about the jump changes.
#
# Off costs nothing when on: one comparison per particle draw. Live.
# ui: Hyperspace tunnel starfield | choices on, off
witchspace_stars = on

# --------------------------------------------------------------------------
# The helmet and the loading screen
# --------------------------------------------------------------------------

# Put the RemLok emergency helmet's edge lines at your temples instead of
# along your nose (Frontier issue 69074; docs\remlok-lines.md).
#
#   outer   each eye keeps only the line on its own outward side -- what a
#           real helmet looks like (the default)
#   hide    no lines at all
#   stock   leave the game alone
#
# Live.
# ui: RemLok helmet lines | choices outer, hide, stock
remlok_lines = outer

# Where each eye's helmet line sits, in degrees from straight ahead, correct
# on any headset. 20..60; the default was tuned by eye on two very different
# headsets and both agreed. 0 turns the placement off. Live.
# ui: RemLok line angle | range 0..60
remlok_line_angle = 46

# Hold the loading screen's ship hologram still. In a headset its scan
# pattern rides your head -- a nauseating shimmer inside the hull
# (docs\loading-hologram.md). "steady" (the default) calms it; "stock"
# leaves the game alone. Live.
# ui: Loading screen hologram | choices steady, stock
holo_pattern = steady

# --------------------------------------------------------------------------
# The terrain fix
# --------------------------------------------------------------------------

# Fill in the black squares of missing planet terrain at the edges of view
# (Frontier issue 72609; docs\terrain-culling.md). Costs GPU time in
# proportion to the margin below.
#
#   off        nothing (the default)
#   symmetric  the measured shape of the problem, trimmed by the fraction
#              keys below
#   percent    a blunt margin on every edge, for diagnosis (commented)
#
# Needs openvr_api.dll installed, and turning it on needs a game restart;
# every other cull_guard key is live.
# ui: Fill terrain gaps at view edges | choices off, symmetric
cull_guard = off

# How much of the shortfall to cover, 0..1 per axis. Commented, both are
# 1.0: full coverage, most expensive. The values below tested clean on a
# Quest 3 at about 6% extra pixels; if black squares persist on your
# headset, raise _h in steps (live).
#cull_guard_fraction_h = 0.25
#cull_guard_fraction_v = 0

# Run the guard only for these headsets: comma-separated FOV signatures,
# exactly as the log prints yours ("this headset's signature is 94x99").
# Empty runs everywhere. Useful on a rig that swaps headsets.
#cull_guard_headsets =

# Percent mode's margin, in percent of every edge. Diagnostic.
#cull_guard_percent = 8.0

# --------------------------------------------------------------------------
# Explorer Cam
# --------------------------------------------------------------------------

# --- Explorer Cam: stereoscopic depth on foot, via Elite's own external
# --- camera. On foot the game renders one flat image for both eyes; the
# --- external camera renders real stereo. This moves your viewpoint to
# --- your commander's head while you are in that camera. It is a
# --- client-side view change using your own camera binding -- you still
# --- cannot shoot, scan or interact from it, and nothing the server or
# --- another player sees changes. Setup: enter the camera on foot, cycle
# --- to COMMANDER RIGHT SHOULDER, tune the offsets under [openvr] with
# --- the headset on (they reload about once a second).

# The master switch for Explorer Cam. 1 on, 0 off. Live.
# ui: Explorer Cam
head_offset_gate = 1

# Keep the viewpoint on when the game briefly cannot report which view is
# showing (near planets it rebuilds its camera records every so often).
# 1 holds the last confirmed view; 0 drops the offset immediately. Live.
# ui: Explorer Cam: hold through camera gaps
head_offset_view_bridge = 1

# How many views the camera cycles through, how long a keypress gets to
# take effect (ms), and how recently the on-foot screen must have closed
# for a press to count as entering the camera (ms).
# How many camera presets the cycle walks before it comes back round: 6 on
# foot, which is the number that matters. The game carries one index and
# folds it into whatever cycle you are standing in -- pick 7 in a ship, step
# out, and it shows you 1 -- so every press counts against this six wherever
# it was made. Longer cycles elsewhere (8 in an SRV, more in a ship, varying
# with its seat count) are deliberately not modelled: they would only change
# the answer if you cycled right round a vehicle's own cycle without
# stopping, and the next wake corrects even that. 0 = do not wrap.
#head_offset_view_count = 6
#head_offset_intent_grace_ms = 2000
#head_offset_enter_window_ms = 670


# Hold off the marker that flashes under the speed readout when a high wake
# is selected. stock is the game's own; off removes it.
#
# It pulses in time with the target indicator's blue flash because both are
# drawn into the same cockpit holo panel. Inside that panel it is one draw of
# the GUI's textureless vector shader, and it is present only on the frames
# the flash is ON -- measured 0 of 3 frames with no wake, 1 of 3 and 2 of 3
# with one. Dropping that draw removes the flash and leaves the rest of the
# panel untouched. Live.
# moved-from: experimental.wake_pulse
# ui: High-wake marker flashing | choices off, stock
wake_pulse = off

# ============================================================================
# [hotkey] -- keys EDVR listens for. Any single character your keyboard
# types, written as itself (';' and '#' as SEMICOLON and HASH); names like
# F1-F24, SPACE, NUMPAD0-9, SCROLLLOCK; combinations with the key last,
# CTRL+ALT+SPACE. An unknown name is refused with a log line.
# ============================================================================
[hotkey]

# Toggle the brightness fix while playing, to see the difference. Elite uses
# most of the F row; Scroll Lock, Pause and Num Lock are usually free.
toggle_exposure = SCROLLLOCK

# Write the last ten seconds of viewpoint history to the log. Press it right
# after seeing a flash that got through -- it is what makes a report
# actionable. Writes nothing until pressed; changes nothing about rendering.
dump_camera = PAUSE

# Developer instrument: log a census of every draw landing in the eye
# textures for a few frames. Costs nothing until pressed. Empty is off; use
# a bare key (NUMLOCK is usually free) -- chords on the Pause cluster can
# reach Windows as a different key.
#
# Besides draws (DC), copies (DCC/DCS) and dispatches (DCX), a census
# records clears and query brackets (DCL lines, 2026-09-01): every
# ClearRenderTargetView with the colour the game asked for, every
# ClearDepthStencilView with its flags and values, and every query
# Begin/End with the query's type -- the calls that reset a target
# without a draw, and the brackets whose measurements decide draw
# issuance a frame later. The clear's view token is the same token the
# draws print as r= and d=, so the listing reads as one sequence.
#dump_draws =

# Read your external-camera and next-view keys from Elite's own key
# configuration, so Explorer Cam needs no bindings here. EDVR only watches
# these keys, never presses them. If your camera is bound only to a
# controller, bind a keyboard key too for now. 1 on, 0 off.
read_game_bindings = 1


# ============================================================================
# [log]
# ============================================================================
[log]

# EDVR writes a short plain-text log to edvr_logs\ next to the game. If you
# report a problem, paste the whole file -- it is small and contains nothing
# personal. 0 stops it.
enabled = 1

# Where the log goes. Empty means edvr_logs\ next to the game.
#dir =

# Stop writing once the log reaches this many megabytes.
#max_mb = 4

# How often EDVR adds an "alive" line to edvr_breadcrumbs.txt, in seconds.
#
# The breadcrumb file is the one thing that survives a hard crash: the log can
# lose its last buffer, this cannot. Without a heartbeat it only ever recorded
# startup, so a game that died after two hours left a trail identical to one
# that died after thirteen seconds -- which is why a crash report can arrive
# with nothing in it. Each line carries a frame number, so two of them together
# say whether frames were still arriving at rate when it stopped.
#
# The cost is one small file write at this interval, on the render thread. At
# 30 seconds that is inaudible; set it to 0 if you would rather EDVR never
# touched the disk mid-frame, at the price of a crash landing nowhere.
#
# Needs a game restart: it is read once, on the first frame.
#breadcrumb_heartbeat_seconds = 30


# ============================================================================
# [openvr] -- read by the openvr_api.dll half (Explorer Cam's viewpoint).
# ============================================================================
[openvr]

# Where your viewpoint goes, in metres, relative to where the camera view
# starts. Positive right / up / forward in your commander's frame. These
# defaults are tuned for COMMANDER RIGHT SHOULDER. Change a little at a
# time -- these move a headset you are wearing. Reload about once a second.
head_offset_right = -0.25
head_offset_up = 0.25
head_offset_forward = 1.25

# Turn the viewpoint, in degrees, about the up axis. 0 is almost always
# right.
head_yaw_degrees = 0.0

# Apply the offset only in the on-foot external camera (0 = everywhere,
# disorienting); also offset the game's simulation poses, not just the
# rendered ones; and how many frames the mode signal stays trusted after it
# stops arriving.
#head_offset_external_only = 1
#head_offset_game_poses = 1
#head_offset_max_stale_frames = 90


# ============================================================================
# [d3d11] -- what EDVR reads from the game to know where you are. Read-only
# and narrow; nothing here can see your position, cargo, credits or
# missions.
# ============================================================================
[d3d11]

# Read which camera view is showing, from the game's memory -- one small
# integer, nothing else. 1 on, 0 off.
#
# OFF by default since game build 332753 moved the marker below. Finding
# the records means walking every committed private page the game holds,
# which is eleven to seventeen gigabytes, and a failed search retries four
# times: measured at fifty to seventy gigabytes of pages read per session,
# all of it pulled into the working set, none of it finding anything.
#
# Explorer Cam does NOT need this. It counts your camera-key presses, and
# that count is anchored -- to zero at launch, and to zero again at every
# new on-foot session, which the game's own journal announces. The read is
# a correction on top of that count: strictly better where it works, since
# it needs no key bound and cannot drift, and simply absent where it does
# not. With it off, a preset change EDVR does not see leaves the count
# wrong until you leave the camera and come back.
#
# To turn it back on you need a marker that points at the right thing on
# your build. docs/build-332753.md records one measured for 332753 and how
# it was arrived at.
#
# 1 was the shipped default up to 0.12.4, so every install from before this
# carries it written out as a literal line. It is retired rather than merged:
# an upgrade should stop the scan for the people who never chose it, which is
# all of them.
# retired-default: 1
camera_index_track = 0

# Read the game's own journal (the documented file Elite writes for
# third-party tools) for gameplay boundaries: session start, disembarking,
# jumps. Event names only -- no other content is read or kept. 0 turns it
# off; EDVR then falls back to heuristics.
journal_watch = 1

# Where the journal lives, if your Saved Games folder was moved. Empty
# means the standard place.
journal_dir =

# Where the camera-records marker sits in the game's executable. Moves when
# the game updates: EDVR then finds nothing, says so, and does not guess.
# This value was measured on build 330683 and is WRONG from 332753 on; it
# is kept because it is what the search would use if camera_index_track
# were switched back on. See docs/build-332753.md for a 332753 candidate.
#camera_index_type_offset = 0x4D71C50

# The camera-record layout: which record holds the view, where in the
# record, the largest believable view value, and how much memory the
# one-time search reads per frame (MB).
#camera_index_ordinal = 11
#camera_index_value_offset = 16
#camera_index_plausible_max = 7
#camera_index_mb_per_frame = 64


# ============================================================================
# [advanced] -- safety valves, measured tuning and developer instruments.
# The log will name one of these if it ever wants you to change it; nothing
# here needs touching on a normal install.
# ============================================================================
[advanced]

# Which camera view Explorer Cam gives up to the stereo viewpoint. 2 is
# COMMANDER RIGHT SHOULDER: close to the head, facing forward. Cycle onto it
# for the 3D view, off it for normal framing. -1 = any view; not recommended.
# Here with the viewpoint offsets rather than under [fix], because it is
# tuning rather than a fix: which preset you can spare is your business, and
# the default suits almost everyone. Live.
# moved-from: fix.head_offset_view
#head_offset_view = 2


# Run alongside another mod that also installs as d3d11.dll (EDHM, ReShade):
# rename the other mod's d3d11.dll (e.g. d3d11_edhm.dll), put EDVR's in its
# place, and put the name you chose here. Both then work. Needs a restart.
real_dll =

# The same idea for openvr_api.dll: the name you gave the game's own copy.
# Empty means openvr_api_orig.dll, which is what the README tells you to
# use.
real_openvr_dll =

# OpenVR interface name prefixes to refuse without asking the runtime
# behind EDVR ("IVROverlay" covers every version of it). Empty refuses
# nothing, and empty is right for real SteamVR. Exists for chaining
# OpenComposite, which raises a fatal dialog for interfaces it does not
# implement.
#suppress_interfaces =

# Pin the brightness fix to one specific shader. Empty means EDVR finds the
# right one itself each launch; only fill this if the log says it picked
# wrong.
