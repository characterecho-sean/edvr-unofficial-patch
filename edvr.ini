# --------------------------------------------------------------------------
# Anti-aliasing
# --------------------------------------------------------------------------

# Calm the shimmer with a temporal filter, which Elite lacks. Each frame is
# blended with the frames before it, each one moved to where its content
# sits now, so anything that flickers on and off the pixel grid as you move
# -- station girders, hull seams, the HUD's fine lines, distant ships --
# settles to a steady value, and the projection is nudged by a sub-pixel
# amount every frame so the average converges to a real supersample even
# with your head held still (docs\anti-aliasing.md, Feature B).
#
# TAA runs EDVR's own history. DLSS hands the same inputs to NVIDIA's
# trained one, which holds text steadier under motion and is the one to
# use on an RTX card.
#
# DLSS IS DLAA WHEN YOU ARE NOT RENDERING SMALL. With Elite's HMD Quality
# at 1.0 or above there is nothing to upscale, so NVIDIA's pass runs at
# your full render size and what you get is DLAA: the same trained
# history, no resolution given up, no frame time bought back. Below 1.0
# the game renders smaller and NVIDIA brings it back to size, which is
# where the frame time comes from -- and that, not the anti-aliasing, is
# the difference between the two names.
#
# DLSS needs NVIDIA's runtime (nvngx_dlss.dll) beside the game, which the
# installer places on a machine with an NVIDIA card. Without an RTX card
# or the runtime it says so in the log and runs TAA instead.
#
# The trade every temporal filter makes: calmer, and a little softer, than
# the hard aliased edges of text without it, and sub-pixel detail such as
# stars shows at its true fraction of a pixel. Set Elite's own
# anti-aliasing to Off or SMAA with this on. Live: switching between the
# modes, or turning it on, takes effect at the next frame, and the tuning
# keys under [experimental] are live too.
#
# "dlaa" is still accepted in this file, for pinning NVIDIA's pass to 1:1
# so that an HMD Quality below 1.0 stays small rather than being upscaled.
# It is not offered as a choice because it is the same picture as DLSS
# whenever HMD Quality is 1.0 or more, and worse below it.
#
# fsr is AMD's upscaler -- a community Direct3D 11 port of FidelityFX Super
# Resolution 3.1 -- at the same sizes dlss would use. It runs on any GPU,
# NVIDIA's included, and needs no extra runtime file beside the game (dlss
# needs nvngx_dlss.dll; fsr does not).
#
# xess selects Intel XeSS-SR in both profiles. It needs libxess.dll beside
# the game, placed by the installer when the pinned SDK is built; VR runs it
# once per eye.
# EDVR uses a D3D11-to-D3D12 bridge; availability and supported render sizes
# are checked by the runtime. A refusal is logged and spatial recovery runs.
#
# Moving ships, vehicles and settlement parts take their exact motion from
# Elite's own records -- where the game had each one last frame and where
# it has it now -- on exactly the pixels the game drew it on, in every mode.
# An object EDVR cannot follow gets no history rather than a guess, and
# everything else keeps the camera's motion. Settlements and the ships
# landing at them are covered; stations and ships in space are not yet
# verified. If Elite's records cannot be read, that part stands down and
# the log says so; the log's "engine motion:" lines say what it covered.
#
# On the flat profile the sub-pixel jitter every mode needs is applied through
# the game's own camera, so every draw takes it without EDVR listing shaders.
# Where that cannot be done -- a camera it cannot certify, a game update that
# moved the code it hooks, repeated failed writes -- EDVR falls back to
# patching projection rows at draw time, and the log's "flat camera inject"
# lines say which route each frame took. There is no setting for it; with
# Anti-aliasing off none of this runs and none of those lines are written.
# moved-from: experimental.temporal_aa
# ui: Anti-aliasing | choices off, on=TAA, dlss=DLSS, fsr=FSR 3.1, xess=XeSS-SR | live | menu performance
temporal_aa = off

# NVIDIA reconstruction model, used by DLSS and DLAA. K is the default.
# L and M are available for comparison (not under DLAA). A change rebuilds
# NVIDIA history. Live.
# moved-from: advanced.temporal_aa_model
# ui: DLSS preset | choices k=K, l=L, m=M | live | menu performance
temporal_aa_model = k

# Every temporal mode includes UI and smoke depth, adaptive UI history,
# and the exact motion of what moves from Elite's own records. These are
# required inputs, enabled and disabled with temporal_aa. Separate
# ui_depth, temporal_aa_objects and temporal_aa_smoke switches are retired.
# Developer overrides remain under [advanced]; depth-disagreement rejection
# is experimental and stays off.

# --------------------------------------------------------------------------
# Cockpit
# --------------------------------------------------------------------------

# Hold off the marker that flashes under the speed readout when a high wake
# is selected. stock is the game's own; off removes it.
#
# It pulses in time with the target indicator's blue flash because both are
# drawn into the same cockpit holo panel. Inside that panel it is one draw of
# the GUI's textureless vector shader, and it is present only on the frames
# the flash is ON -- measured 0 of 3 frames with no wake, 1 of 3 and 2 of 3
# with one. Dropping that draw removes the flash and leaves the rest of the
# panel untouched. Live.
# moved-from: experimental.wake_pulse
# ui: High-wake marker flashing | choices off, stock | menu
wake_pulse = off

# The game's interface drawn as sharp as it would be at HMD Quality 1.0
# (100), 1.25 (125), 1.5 (150) or 2.0 (200), whatever HMD Quality the scene
# runs at. Today the
# game draws its interface at the scene's size: at HMD Quality 0.65 the
# cockpit's panels are drawn at 0.65 of their size, and a main menu the
# resolution fix renders at 3840x2160 is squeezed into a 0.65-size eye and
# stretched back up by the upscaler, which is told not to accumulate it.
# One setting, two parts:
#   - the cockpit's panels (the vector lines, text and icons of the side
#     panels, the target panel and the rest) are made at the size they would
#     have at the chosen HMD Quality -- the scene itself is left alone;
#   - the menus (the main menu included), modals, station services'
#     panels, the loading screen and the 2D screen are drawn into a separate
#     layer at the size the upscaler hands out (100) or larger (125, 150 or
#     200, smoothed down), with no jitter, and laid over the finished
#     picture after the upscale and after render_sharpness -- so their text
#     is never upscaled, sharpened, smeared or ghosted. On foot, and in a 3D
#     map, the 2D screen shows the world and stays in the picture, the
#     helmet HUD with it: the screen's own busy depth says so within two
#     frames, the game's Status.json says on foot a second or so later, and
#     either one keeps it. This part needs fix.temporal_aa on.
# Also layered: the cockpit's holo panels, the flight HUD, the target
#     sprites, eight admitted radar icon/contact hologram families and the
#     target hologram's sphere (its two known pixel shaders only, with the
#     game's read of the scene depth remapped to the layer's size; a draw
#     whose depth cannot be remapped stays in the scene) -- the game draws
#     them into the
#     lit scene before its tonemap, at the scene's size, so at HMD Quality
#     0.65 they are upscaled with the world. Here each is drawn into a
#     per-eye HDR layer at the layer's size, unjittered and tested against
#     the scene's own depth as before, and at the game's own tonemap draw --
#     its exposure, colour LUT and constants untouched -- the layer is
#     tonemapped over the finished eye: as sharp as at HMD Quality 1.0
#     whatever the scene runs at, out of the upscaler's history so they
#     cannot smear or ghost. They lose the bloom halo the upscaled
#     frame gave them (measured: a few dozen pixels a frame where
#     translucent glass crosses a bright background).
# Not layered: the sun/radar corona (one shader pair paints both the radar
# icon's glow and the real sun) and the world reticle keep their existing
# depth treatment, as does any target-sphere shader other than the two known
# ones; their shader/resource safety at the layer's size is not proven. The
# glass canopy also stays in the scene -- it sits
# in front of the whole sky, and covering it would smear the stars behind it.
# These stay in the picture the upscaler
# reconstructs, steadied by the interface depth and the
# reactive mask.
#   off -- the interface is drawn as the game always drew it.
#   100 -- the default: as at HMD Quality 1.0 (100%).
#   125 -- as at HMD Quality 1.25 (125%): finer edges, more memory.
#   150 -- as at HMD Quality 1.5 (150%): each pixel of the picture is the
#          average of about 2.3 samples, against 1.6 at 125.
#   200 -- as at HMD Quality 2.0 (200%): an exact 2 x 2 average, four samples a
#          pixel, the smoothest edges. The layer is four times the pixels of 100:
#          on a 3440x1440 display 396 MB with its depth target, against 99 at 100
#          and 155 at 125; at a headset's size it is over a gigabyte an eye, so
#          this is for a display, or for a headset with the memory to spare.
# (1.0 and 1.25, the first spellings, are read as 100 and 125 for this
# release, with a note in the log.) At or above your HMD Quality the panels
# are already that size and are left as they are. The price: the panels
# cost what they would at that HMD Quality; per eye, the layer (37 MB at
# 3070x3032 and 100, 58 MB at 125),
# one copy of the finished eye to lay it over, one more of the layer's size
# once the loading screen has shown, and one full-eye pass after the
# sharpening (the log times every step and names what is allocated, every
# 30 s); and once a menu draw tests the game's depth
# or stencil, a depth-stencil target of the layer's size (75 MB at 100, 116
# MB at 125 on 3070x3032; 232 MB at 125 on a 4340-wide eye) plus a copy
# of the game's own (31 MB at 1995x1970). For the cockpit HUD (the holo
# panels, the flight HUD, the target markers and the holograms) add, per eye,
# the HDR layer (R16G16B16A16_FLOAT: 128 MB at a 4074x3938 door, 50 MB at a
# Quest 3's 2564x2460), its depth-stencil target once a HUD draw tests depth
# or stencil
# (the same again), and one tonemap re-issue plus one alpha pass an eye a
# frame; the HUD shades about four times the pixels at twice the size per
# axis. What the game draws into the
# same eye after the layered interface (the mouse cursor, overlay effects)
# is taken into the layer too, after the UI, so it stays over it. Two kinds
# still land under the UI: a post pass (it samples an image the eye's own
# size, such as the frame) and a draw the layer declines or refuses. A draw
# that only reads the eye no longer sees the UI in what it reads. The log
# names each such draw. The log's "ui quality" lines say
# what size the panels are made at, what was taken into the layer, what was
# left and why, every 30 s. The panels are sized inside the game's own panel
# code, checked against this game build: after a game update that changes
# that code they stay at the game's own size until EDVR is updated for it,
# and the log says so.
# The orbit lines the game draws in supercruise are scene geometry, but drawn
# a fixed number of pixels wide at the render size they look heavy beside
# panels made at this size. While the panels are scaled they are drawn at the
# same fraction of the game's width (half as wide at 100 with HMD Quality 0.50,
# 0.4 of it at 125), by the game's own line shader with its half-width
# scaled; at or above your HMD Quality they are as the game draws them. The
# log's "orbit lines" lines say which. Where the layer is wider than the game's
# render, the orbit lines, the faint vertical bars of the supercruise display
# and the space dust are drawn into the layer as well, at its own size, so DLSS
# no longer upscales them; the log's "orbit lines", "supercruise bars" and
# "space dust" lines say how many.
# Live: off takes effect at the next frame; a cockpit panel follows the
# next time the game lays it out -- at once in a session's first cockpit, a
# trip through the main menu for one already open.
# The flat edition (edvr-flat.ini; 100 by default there too): the panels
# are made at the display's size (100) or larger by a quarter (125), a half
# (150) or twice (200), whatever Supersampling the scene renders at, while
# anti-aliasing is on; at or above that size, or with anti-aliasing off, they
# are left as the game makes them. The cockpit HUD is composited after the
# anti-aliasing, so the game's own never reaches it, and its slanted lines
# and the corners of its panels can show steps below 4K. Raise this if the
# HUD still looks stepped, or turn on HUD Anti-Aliasing below, which smooths
# those edges at any size (off by default).
# A change reaches a panel the next time the game lays it out, as above.
# ui: UI quality | choices off, 100=100%, 125=125%, 150=150%, 200=200% | live | menu performance
ui_quality = 100

# Smooth the stair steps on the cockpit HUD in the flat edition. The HUD is
# drawn into its own layer (UI quality above) and laid over the finished
# picture after the game's anti-aliasing, which never touches it: its slanted
# lines and the edges of its panel shapes can show hard steps, most below 4K
# and at a low UI quality. on smooths those edges before the layer is laid
# over the picture; off lays it over as the game draws it. It costs some
# GPU time and about 10 bytes of video memory for every pixel of the HUD layer
# (37 MB at 2560x1440 with UI quality 100). It works on the HUD layer, so it
# acts only while UI quality is not off (and, as for UI quality, while
# anti-aliasing is on); the menu shows the row dimmed otherwise. In VR it
# changes nothing. The log's "flat ui layer" lines say how many frames read
# the smoothed layer. Live.
# ui: HUD Anti-Aliasing | choices on, off | live | menu flat_performance
hud_antialiasing = off

# --------------------------------------------------------------------------
# Optimized stations
# --------------------------------------------------------------------------

# Inside a station, skip rendering what cannot be seen. Today: while your ship sits
# in a sealed hangar (docked, the pad lowered and still, the hatch closed),
# everything outside the hangar is skipped, including the sun's light leaking into
# the hangar. Releases on launch, when the pad moves, when the camera leaves the
# hangar, when you undock or when the setting is turned off. More station
# optimizations will be added under this setting. On in VR and in the flat
# profile. Live.
# ui: Optimized stations | choices on, off | live | menu performance
optimized_stations = on

# --------------------------------------------------------------------------
# Camera pick A/B (TEMPORARY; docs\sky-flicker-2026-10-13.md)
# --------------------------------------------------------------------------

# Temporary comparison arm (src\common\camera_nearest.h; branch claude/hangar-test-4, commits d3ed2787 and e40d6674). On: the pick stands unless it is
# more than 5 cm (plus three times the last step) from the last pick, counting 5 cm a degree of rotation; then the continuous write nearest the last
# pick is used instead. A pick that holds two frames beyond that is a cut and is taken. Wins over camera_jump_guard when both are on. VR only. The
# "temporal camera nearest:" line every 30 s says what it did and what it would have done.
# ui: hidden -- a temporary flight A/B, set by editing this file; it goes when the arc closes
camera_nearest = off

# Temporary comparison arm (src\common\camera_jump_guard.h; branch claude/hangar-test-4, commit 998921da, present in builds -53 and -58). On: a pick that
# jumps more than 3 cm from the last pick without continuing the previous step is replaced by the next-best continuous write that does; a jump that
# lasts three frames is taken. Ignored (the guard only counts) while camera_nearest is on. VR only. The "temporal camera jump guard:" line every 30 s
# says what it did and what it would have done.
# ui: hidden -- a temporary flight A/B, set by editing this file; it goes when the arc closes
camera_jump_guard = off

# Per-headset OpenXR render width in pixels per eye, as runtime/system:width
# entries such as oculus/meta-quest-3:3283. Set it from the F8 menu with the
# headset on; the key for the headset you are wearing is printed in the log
# ("openxr resolution: this headset is oculus/meta-quest-3") and is the
# runtime name and headset name lowercased with everything but letters and
# digits turned into "-" -- copy it from the log rather than typing the
# names, which contain slashes. Width is the per-eye width EDVR hands
# Elite; the height follows the headset's recommended shape, and the menu
# shows the resulting size, megapixels and percent of the runtime's
# recommendation. Entries are separated by commas, up to 8:
#
#   oculus/meta-quest-3:3283, steamvr-openxr/pimax-crystal-super:4980
#
# A headset with no entry runs at 100% of what its runtime recommends, and
# a bare number on its own (180, 3283, or the older 1.8) names no headset
# and is ignored, with the log saying what to write instead. An entry with
# only the runtime half (steamvr-openxr:4000) applies to any headset on
# that runtime that has no entry of its own. The width is fixed in pixels:
# changing the headset software's quality preset or streaming app changes
# what 100% would have been, not this, within limits -- it is held between
# a quarter and twice whatever the runtime now recommends, so a very low
# streaming preset caps it at 200% and a very high one floors it at 25%,
# and the runtime's own maximum still caps it. Elite's HMD Quality and
# DLSS still compose with this value. Swapchains are fixed when VR starts,
# so a change applies after a game restart. The Status page's "Eye
# texture" line is what Elite then submits. Megapixels of a size you
# already like: width x height / 1000000. Emptying this value clears every
# headset's entry; the F8 menu's R key clears only the headset you are
# wearing.
# ui: OpenXR resolution | headset | restart | menu performance
openxr_resolution =

# Sharpen the picture with AMD's RCAS, 0 (off) to 1 (strongest). In VR it
# runs as the last thing before the frame leaves for the headset. In the flat
# profile it runs on the temporal pass's output (TAA, DLSS or FSR), just
# before the game's own copy of it: Elite's interface is drawn after that
# copy, so text and HUD are never sharpened. With anti-aliasing off there is
# nothing to sharpen, and the rare frame the temporal pass could not resolve
# (it falls back to a plain spatial one) is left as it is for now.
# The temporal pass trades a little edge contrast for calm; this hands some
# of it back, and 0.3 is a fair start with the temporal pass on. It cannot
# add detail, only contrast at edges, and too much of it rings. It is a taste
# control for the softness of TAA, DLSS and FSR, not a fix for anything: it
# makes fine-line shimmer worse, not better. The setting means the same in
# both profiles, so a flat install seeded from a VR edvr.ini starts with the
# VR value. Live.
# moved-from: experimental.render_sharpness
# ui: Sharpening | range 0..1 | percent | menu performance
render_sharpness = 0.0

# ============================================================================
# [visual] -- how the picture looks, apart from the fixes: options that change
# what you see rather than repair something. Everything here is safe to change
# and takes effect within a second of saving, bar the launch movie's skip,
# which is decided at launch. The flat edition's F8 menu and the in-headset
# menu list them on their Visual pages, each only the ones that apply to it.
# ============================================================================
[visual]

# --------------------------------------------------------------------------
# World scale
# --------------------------------------------------------------------------

# How big the world looks, in percent. Above 100 it looks bigger, below 100
# smaller; 100 is the game's own scale and changes nothing. Same units and
# direction as OpenXR Toolkit's and SteamVR's world scale, so a number from
# either carries over. It changes only the distance between the two eyes the
# game renders with, about their midpoint (closer together for a bigger
# world, further apart for a smaller one). Your head movement, the field of
# view and EDVR's own menu and panels are not touched. VR only. Live.
# ui: World scale | range 50..200 | step 1 | unit % | recommended 100 | live | menu visual
world_scale = 100

# --------------------------------------------------------------------------
# The mirror window
# --------------------------------------------------------------------------

# What Elite's own window on your desktop shows while you play in VR with 3D
# on (the Mirror window page of the menu). "left_eye" (the default), "right_eye"
# and "both_eyes" fill it with the finished image your headset is shown (after
# DLSS, sharpening and EDVR's menu); "both_eyes" puts the left eye on the left.
# The game's own drawing into the window is skipped meanwhile. "game" leaves the
# window exactly as the game draws it. When 3D goes off the window goes back to
# how the game had it.
# The next four settings say what shape the picture has, how it is cut out and
# moved up or down, and whether the window is an ordinary one or fills the
# screen.
# VR only. Live.
# ui: Image | choices game=Game, left_eye=Left eye, right_eye=Right eye, both_eyes=Both eyes | live | menu desktop_window
desktop_window = left_eye

# The shape of the picture in that window. "full" (the default) is the whole
# picture your headset is shown, in its own shape. The others cut the picture to
# that shape (the cut moves only as far as it has to to stay inside the image):
# 1:1, 4:3, 16:10, 16:9 and 21:9. With both eyes each gets half the width, so
# 16:9 is two 8:9 halves. The next two settings say where the cut sits.
# VR only. Live.
# ui: Shape | choices full=Full picture, 1:1=1:1, 4:3=4:3, 16:10=16:10, 16:9=16:9, 21:9=21:9 | live | menu desktop_window
desktop_window_aspect = full

# Where the cut-out sits in each eye's picture, when the shape above is not
# "full" ("full" is never cropped or zoomed). "native" (the default) does what
# Elite's own mirror in the headset does: it cuts the shape out of the middle of
# the picture, and if your headset's screen has a hidden area (a mask round the
# edge, which Elite is told about) it also zooms in 1.32 times and sits a little
# toward the nose, 0.515 of the way across for the left eye. Elite only ever
# shows the left eye, so for the right eye EDVR mirrors that: 0.485. "center"
# always cuts it from the exact middle of the picture, with no zoom.
# VR only. Live.
# ui: Crop | choices native=Same as the game's mirror, center=Centre | live | menu desktop_window
desktop_window_crop = native

# Moves the cut-out up or down within the picture, in steps of 5. 0 is the
# default centre, the place the crop setting above puts it; 100 puts the cut-out
# as high in the picture as it can go and -100 as low. It does nothing with the
# shape "full", or where the chosen shape leaves no room up or down.
# VR only. Live.
# ui: Vertical shift | range -100..100 | step 5 | unit % | signed | zero default | recommended 0 | live | menu desktop_window
desktop_window_vertical_shift = 0

# How the window looks. "window" (the default) is an ordinary window with a
# title bar: it starts as large as fits on its monitor, you can move and resize
# it as you like (switch away from the game first while it holds the mouse in
# the window), and EDVR keeps the picture's shape. "borderless" fills the whole
# monitor the window is on, with no frame and no title bar, and the picture sits
# inside it with black bars where it does not fill the screen. VR only. Live.
# ui: Style | choices window=Window, borderless=Borderless full screen | live | menu desktop_window
desktop_window_style = window

# --------------------------------------------------------------------------
# The launch movie
# --------------------------------------------------------------------------

# The launch movie, played properly. Elite draws it on a small head-locked
# rectangle -- 1024x576 pixels, about 27 degrees wide, pinned to your face
# (docs\intro-video.md). "screen" (the default) plays it on the splash's
# own virtual screen instead: world-anchored on the game's forward, sized
# to what the splash after it covers, so the cut between them just works
# -- and resampled first with AMD's FSR so the magnification does not read
# as pixelation. HOW SHARP it can get is your on-foot screen resolution:
# the movie is upscaled to vscreen_res_width above, the same question
# about the same GPU, asked once. "stock" leaves the game alone. The
# world anchor needs openvr_api.dll installed; without it the movie stays
# head-locked and the log says so. "skip" does not play the movie at all:
# when the game goes to open the ident file (Movies\Ident_*.webm), EDVR
# answers that it is not there -- the same answer renaming the file gives,
# which is how people have always skipped it -- and nothing on disk is
# touched, so nothing has to be put back. The game then goes straight to
# the splash. The log says whether it took; if the movie plays anyway,
# it plays as "screen", and the log says why (docs\intro-video.md). skip is
# decided at launch, the only time the movie exists; screen and stock are
# live, though the movie is only there for the first half-minute of a
# session. The flat profile (3D mode off) reads this key too, and there skip
# is the only value that does anything: screen and stock both play the movie
# as the game makes it (the default), skip refuses it the same way and the log
# says "intro skip: WORKED (flat)".
# moved-from: fix.intro_video (default screen)
# moved-from: fix.intro_video_size (default stock)
# moved-from: fix.intro_video_lock (default head)
# moved-from: fix.intro_video_upscale (default stock)
# ui: Intro movie | choices screen, stock, skip | live | menu visual
intro_video = screen

# --------------------------------------------------------------------------
# Stars
# --------------------------------------------------------------------------

# A stronger glow around stars. Elite's own bloom draws a halo around every
# star; this is how strong that halo is, as a percentage of the one the game
# draws. 100 is the game as it ships and runs nothing; 150 is a halo half
# again as strong, 200 twice as strong, 400 four times as strong. Every star
# gets the same strength in this version. It strengthens the game's own
# bloom, so it needs Bloom on in Elite's graphics options; the menu says so
# when Bloom is off. In the headset each eye gets the stronger halo.
# Live.
# ui: Star glow | choices 100=100%, 125=125%, 150=150%, 175=175%, 200=200%, 250=250%, 300=300%, 350=350%, 400=400% | live | menu visual
star_glow = 100

# ============================================================================
# [hotkey] -- keys EDVR listens for. Each one is a keyboard key, a gamepad
# button or a HOTAS/joystick button, and the F8 menu's Hotkeys page sets,
# changes and clears all of them for you: select a row, press Enter, press
# the key or button. By hand:
#   keyboard   any single character your keyboard types, written as itself
#              (';' and '#' as SEMICOLON and HASH); names like F1-F24, SPACE,
#              NUMPAD0-9, SCROLLLOCK; combinations with the key last,
#              CTRL+ALT+SPACE (Ctrl, Alt and Shift only). The F8 menu will not
#              capture a key it navigates with, with any modifier: the arrows,
#              Enter, Space, Tab, PageUp/PageDown, Home, End, R and Esc.
#   gamepad    Elite's own name for the button, as in its bindings files:
#              GamePad_Back, GamePad_FaceDown, GamePad_LBumper, GamePad_DPadUp,
#              GamePad_LTrigger ... (an XInput pad).
#   HOTAS      the device and the button, as Elite writes them in its bindings
#              files: the device is eight hex digits, vendor then product, and
#              the button is Joy_N (counted from 1) or a hat direction,
#              231D0200:Joy_12 or 231D0200:Joy_POV1Up (Right, Down, Left).
# An unknown name is refused with a log line. Every key here is WATCHED, never
# captured: the game sees the press as well, so a key or button that Elite also
# uses does both. The Hotkeys page warns when a choice clashes with your own
# bindings; EDVR reads a HOTAS button from the same DirectInput reads the game
# makes and creates no device of its own.
# ============================================================================
[hotkey]

# Summon and dismiss the in-headset settings menu (docs\settings-menu.md):
# a panel anchored where you were looking, driven by the arrow keys or by
# where your head points, that writes this file. The key is PRIVATE to
# EDVR: the game never sees the press that opens the menu, and while the
# menu is up it sees no keyboard at all (menu.keyboard below). F8 is bound
# in none of Elite's thirty stock control schemes; F10 and Alt+F10 are the
# game's screenshot keys and F12 is Steam's, so avoid those. Checked
# against your own bindings at launch and on every rebind: a clash is named
# in the log, and an Elite panel key that is your menu key is not adopted
# by the menu. The menu's own page can change this key but never clear it
# (nothing could open the menu again); empty turns the menu off, from this
# file only. Live.
# ui: Menu key | hotkey | live
menu = F8

# RETIRED in F98 (Explorer Cam was removed; native on foot is the on-foot VR mode): this key is ignored and its key is no
# longer watched. It stays here at its last shipping value, so a stock file reads clean; a value that differs is named once
# in the log.
# ui: hidden -- retired (F98): ignored.
explorer_cam = F5

# Look at the same scene with EDVR's anti-aliasing off, then back. One press
# turns fix.temporal_aa off, a short notice says so ("AA off (comparison),
# press F7 to restore"), and the next press puts back whatever fix.temporal_aa
# says ("AA restored: DLSS"). It is for side-by-side comparison and never
# writes this file: it is gone when the game closes, and the next launch has
# your anti-aliasing as configured. Works in both profiles. If anti-aliasing
# is already off in your settings the press says there is nothing to compare.
# Changing the anti-aliasing mode (the F8 menu, this file) while it is off ends
# the comparison and your choice applies; so does a switch between the VR and
# flat profiles. fix.ui_quality follows, as it does for any anti-aliasing
# change (it is live only with anti-aliasing on). F7 is bound in none of
# Elite's thirty stock control schemes; it is checked against your own
# bindings at launch and on every rebind, and a clash is a WARNING line in the
# log. Empty turns the key off. Live.
# ui: AA comparison key (empty = off) | hotkey | live
compare_aa = F7

# Write the temporal pass's recent camera history to the log (the camera rows
# it was handed, frame by frame; empty while fix.temporal_aa is off). Press it
# right after seeing a flash that got through: the first line says whether the
# jump-flash hold was armed, and a "transition flash: frame N held" line near
# the moment means it held one -- no such line means it did not. Writes
# nothing until pressed; changes nothing about rendering. Live.
# ui: Camera history key | hotkey | live
dump_camera = PAUSE

# Developer instrument: log a census of every draw landing in the eye
# textures for a few frames. Costs nothing until pressed. Empty is off; use
# a bare key (NUMLOCK is usually free) -- chords on the Pause cluster can
# reach Windows as a different key. Live.
#
# Flat profile: NumLock (or the configured key) writes a bounded general
# shader/state/routing/refusal report. Shift + the same key requests full
# GPU/pixel/packet capture: slow and large; use only when specifically needed.
#
# Besides draws (DC), copies (DCC/DCS) and dispatches (DCX), a census
# records clears and query brackets (DCL lines, 2026-09-01): every
# ClearRenderTargetView with the colour the game asked for, every
# ClearDepthStencilView with its flags and values, and every query
# Begin/End with the query's type -- the calls that reset a target
# without a draw, and the brackets whose measurements decide draw
# issuance a frame later. The clear's view token is the same token the
# draws print as r= and d=, so the listing reads as one sequence.
# dev: label Draw census key | hotkey
#dump_draws =

# TEMPORARY (2026-10-12), remove with the GPU pass profile arc: press this key to measure the next whole frames' GPU time by
# pass (Elite's own passes, and EDVR's sections labelled apart). The value is KEY, or KEY then a frame count 1 to 120 (default
