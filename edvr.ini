# omitting them: fractions of the target, 0 to 1, and both must be set.
# For a dark rectangle that is not unwanted but the wrong SIZE -- it spans
# the view when it only needs to sit behind a dialog. Empty or 0 keeps the
# omit behaviour. Live: change and look.
#census_clip_width =
#census_clip_height =

# Developer instrument: read the RECTANGLES a draw paints.
# WIDTHxHEIGHT:KIND:COUNT[:SKIPFRAMES] names a draw signature into one
# target -- any target, the eye textures included. COUNT is INDICES for
# kinds I and X (six to a quad) and VERTICES for D and N, where the only
# shape read is a four-vertex strip quad. After letting SKIPFRAMES matching
# frames pass (the first is usually mid fade-in -- 120 waits out about two
# seconds for steady state), the next frame containing a match has EVERY
# draw of that signature copied, each from ITS OWN vertex buffer, and each
# occurrence's quads are logged -- extents, viewport and scissor, plus the
# vertex bytes past the position, where a colour or uv would live. Two
# same-signature draws with different extents are different rectangles
# sharing one widget, which is what a census, matching by signature, can
# never show. One capture per session; re-set the value to ask for
# another. Empty is off.
#quad_probe =

# Developer instrument: hold the quad probe until this many milliseconds
# into the session, then let its SKIPFRAMES count start. 0 is off.
#
# The skip counts MATCHING FRAMES, which is right for "let the fade-in
# finish" and wrong for "wait until the intro movie is over": the movie
# plays at about 178 frames a second on the measured rig and the menu
# behind it runs at 13, so a skip big enough to clear the movie leaves you
# sitting at the menu for minutes while the rest trickles past. This says
# the same thing in the unit that survives a frame rate changing under it.
# Both have to be satisfied, so "thirty seconds in, then two seconds of
# steady frames" is expressible; neither alone can say it. Live.
#quad_probe_at_ms = 0

# Developer instrument: arm a census at named moments after the session's
# first frame, in milliseconds -- up to eight, comma separated, e.g.
# "1000,4000,9000". Everything else that arms a census needs something
# known in advance (a hand on the census key, a journal event, or the size
# of a target somebody already censused), and the startup has none of
# those: it is over before a human reacts, and for its first phase the
# size of one eye has not been published to the d3d11 half yet. These
# censuses record offscreen draws whatever census_offscreen says, since
# that is the only thing worth aiming them at. Read once, at the first
# frame -- editing it mid-session does nothing. Empty is off.
#census_at_ms =

#census_skip_range =

# Developer instrument: arm a census at a scanner zoom's FIRST frame. A
# world-camera jump landing while the scanner's chrome is up starts the
# standard auto census, so the capture covers the ARRIVAL -- the frames
# where the left eye's reveal-gated blacks live, which every census
# triggered by the body layer starts too late to see. Uses the census
# frame/line settings; one census per jump, capped by the auto machinery.
# 1 on, 0 off and the only shipped state.
#census_fss_jump = 0

# Developer instrument: skip compute DISPATCHES by shader hash -- the hash
# the census logs as "ch" on DCX lines -- up to four comma-separated. The
# draw skips' completing half: the FSS black-square stack is built by
# compute (a per-eye 16x16-tile mask with no draw to skip), and a system
# only compute touches needs its dispatches skippable to be localised live.
# The scene may look very wrong while set; that is the probe working. Live;
# empty is off, and off is the only shipped state. The log counts drops.
#census_skip_dispatch =

# Developer instrument: make the draw census (the dump_draws key) also record
# draws that land OUTSIDE the eye textures, logged as DCO lines. Off by
# default, because a full scene is thousands of draws a frame and three frames
# of that spends the census line cap on the way past.
#
# Turn it on when the question is "where is this actually drawn". An FSS
# census in 2026-08 showed 220 eye draws a frame, and skipping both of its
# largest families removed nothing visible -- the bodies on screen were being
# built in an offscreen target and composited in, where the eye-sized gate
# could not see them. The r= column on a DCO line names that target, and the
# interned table at the end of the census gives its size.
#census_offscreen = 0

# Developer instruments: how many whole frames one census records, and how
# many lines it may write. The defaults (3 and 4096) are right for the
# steady-state diffs the census was built for; a capture that has to span a
# progressive build -- the FSS body tiling in after a zoom -- wants the
# window long (30) and the cap high (16384, about 2.3 MB of log), or the tail
# of the build falls off the end. Read when a census starts.
# Name a render target by size and the colour every clear gives it is
# logged, up to eight times. For finding a wash that no draw paints --
# a buffer's clear colour is invisible to any draw census, however the
# spec is written. Nothing is changed; empty is off.
#clear_probe =

#census_frames = 3
#census_lines = 4096

# Developer instrument: arm a census AUTOMATICALLY the first time a draw
# lands in an offscreen target of exactly this size after two quiet seconds,
# as if the dump_draws key were pressed at that moment. One WIDTHxHEIGHT;
# empty is off. At most 8 firings a session; re-saving the ini resets the
# allowance. The census it arms records offscreen draws even if
# census_offscreen is 0, since an offscreen build is the only thing worth
# aiming this at.
#
# It exists because a keypress census records what the scanner looks like
# AFTER it settles -- human reaction lands twenty frames late -- and the FSS
# ring bug lives only in the build frames. Set this to the body target's size
# (2170x2142 on the measured headset; check your own census's interned
# table), open the FSS, and zoom onto a ringed body: the census arms itself
# on the first build draw and catches what no keypress can.
#census_auto =

# Developer instrument: while a census runs, every recorded draw whose vertex
# shader matches this hash (the census's vh= column) also dumps the CONTENTS
# of its b0 constant buffers -- vertex and pixel stage -- as DCW lines: the
# bytes the GPU reads for exactly that draw, captured from the game's own
# writes. Same-frame dumps pair by q; diffing eye A's against eye B's is how
# a per-eye value hiding in shared buffer objects gets caught. Empty is off.
#
# For the FSS ring split: 953C8123AD8DC13B is the composite that pastes the
# scanner body into each eye. Its textures are measured identical between
# the eyes (2026-08-25); its constants are the channel the census cannot
# otherwise see.
#
# Also matches COMPUTE shaders (2026-08-26): a dispatch of a watched hash
# dumps its CS b0 and b1 the same way (slots x and y in the DCW lines), and
# a second comma-separated hash watches two shaders in one census -- built
# for the reconstruction pair E861F611375E7ECC,B74273EC13F7CD59, whose
# shared 80-byte block is the per-eye-rewrite idiom this key exists for.
#census_cb_watch =

# Developer instrument: which constant-buffer SLOT census_cb_watch reads,
# 0 to 13. 0 is b0 and the old behaviour.
#
# It was b0 and only b0, and twice that has been the wrong buffer: the
# loading wash's pixel shader reads b2, and the intro movie's panel is
# placed by a scale and a transform in its VERTEX shader's b2. Both times
# the census reported "no constant buffer" for a draw whose whole
# behaviour was in one, because the column only looked at slot zero. Set
# this to 2 with census_cb_watch naming the shader to dump it.
#census_cb_slot = 0

# Developer instrument: write every shader the game creates to
# edvr_logs\shaders, for reading a draw's own code when a fix needs it.
# Costs file writes during loading; needs a restart.
#
# Vertex, pixel AND compute (vs_, ps_, cs_ by content hash). Compute was
# added 2026-09-07: their hashes had been recorded on census dispatch lines
# since the hook was written, so a capture could name one and nothing could
# read it. Two of them turned out to be reading the scene depth's stencil
# plane, which is a thing a fix needs to know before it writes there.
#glare_shader_dump = 0

# Curved-screen tuning. The sign is 1 for "toward you", correct on the game
# build this was measured against; -1 is the escape hatch if an update
# flips the panel transform's handedness. Segments is how many columns the
# screen is cut into -- 64 is far past what the eye can see, and below
# about 8 the screen visibly facets. The gain is the bend's depth scale in
# the panel's own units: EDVR reads it from the game automatically, and
# this overrides that reading if a game update moves it (0 = use what was
# read).
#panel_curvature_sign = 1
# dev: range 1..256
#panel_curvature_segments = 64
#panel_curvature_z_gain = 0.0

# Texture filtering, for the shimmer a repeating pattern makes on a
# distant surface -- a station's ribbed panels, a hull's hatching. That
# is a mip chosen sharper than the pixel covers, and nothing at the
# submit door can undo it: the detail was never sampled. anisotropy
# forces the game's plainly linear and anisotropic samplers to that
# many taps (1 to 16); lod_bias adds to their mip choice, positive for
# blurrier and quieter, negative for sharper. Point, comparison,
# minimum and maximum filters are never touched. 0 leaves the game's
# own choice alone; the log's texture filtering
# census says what it asked for. Read at device creation, so a change
# needs a restart.
#
# lod_bias also takes "auto", which is the right answer whenever the game
# renders smaller than the headset asks for and something brings it back
# up. Mips are chosen for the size being RENDERED, so an upscaled frame is
# reconstructed from textures blurrier than its output deserves, and the
# correction is log2 of the render fraction: -0.42 at three quarters,
# -1.00 at a half. auto reads that fraction from Elite's own graphics
# preset (its HMDRenderTargetMultiplier) instead of asking you to keep a
# number in step with it by hand, so changing HMD Quality moves the bias
# on the next launch. The log line names the fraction it read and the bias
# it derived, and says so plainly if the preset gave it nothing.
#texture_anisotropy = 0
# Auto is the default with temporal AA enabled; AA off leaves the mip bias
# unchanged unless explicitly overridden. Read at device creation: restart
# after changing AA mode to pick up its default texture bias.
#texture_lod_bias = auto

# --------------------------------------------------------------------------
# Freezes: where the render thread stopped
# --------------------------------------------------------------------------

# on (the default) or off. When the game's render thread goes about 150 ms
# without a Present -- the one-to-two-second freezes some setups see -- the
# log says which module and address it was stuck in, in lines that start
# "stall:". A watchdog thread notices the stall, and at 150, 500 and 1000 ms
# of it stops the render thread for a few tens of microseconds, copies its
# stack, lets it go, and then names the modules on the copy: the game, the
# graphics driver (nvwgf2umx), a chained mod such as EDHM, or an ntdll wait.
# That is the question a freeze report cannot otherwise answer.
#
# It works in this process only, on this one thread, and writes nothing to
# it. While the game is not stalling it costs one store a frame and a thread
# that wakes about seven times a second. At most six stalls back to back, one
# more every two seconds, and two hundred a session, so a bad session cannot
# fill the log with them.
#
# off starts no thread and takes no sample. The LONG FRAME and FREEZE lines
# are written either way: they do not depend on it.
#
# Needs a game restart: it is read once, on the first frame.
#freeze_location = on

# TEST ONLY. 0 (the default) does nothing. A value from 1 to 5000 makes the
# render thread sleep that many milliseconds, once, sixty seconds into the
# session, so the freeze lines and the stall sampler above can be checked in
# one flight without waiting for a real freeze: the log shows a freeze of
# about that length and a "stall:" line naming an ntdll sleep called from
# EDVR's own d3d11.dll. It stops the game on purpose; leave it at 0.
#
# Needs a game restart: it is read once, on the first frame.
#freeze_test_ms = 0

# TEST ONLY. 0 (the default) does nothing. A value from 1 to 500 makes the
# OpenXR runtime hold every xrEndFrame it makes that many milliseconds longer,
# for 40 seconds, starting 90 seconds into the session, so the runtime's
# long-xrEndFrame lines and its slow-frame-rate lines can be checked in one
# flight without a headset runtime that misbehaves: the runtime's log shows a
# native_end_frame_episode line for the first held call and its end line, and
# native_slow_regime lines (SLOW, still_slow, end) naming the vendor's
# xrEndFrame; the graphics log shows "slow test:" lines at the start and the
# end. 80 is about the length of the Quest 3 report this was written for (six
# display periods at 72 Hz, 10 fps). It slows the game on purpose; leave it
# at 0.
#
# Needs a game restart: it is read once, on the first frame.
#slow_test_ms = 0

# TEMPORARY, for the scanner-body A/B flight (docs/scanner-body.md); it goes
# when that arc closes. on (the default) | off, live. The game keeps two
# copies of each vertex buffer's binding -- the one it wants and the one it
# last applied -- and compares only the first when it is told to bind a
# buffer, so after a pair of zero-slot full-screen draws a buffer it binds
# again is skipped and the draw runs with the slot empty. That is what leaves
# the scanned body black in one eye (fix.scanner_body works around it one
# level up). A CodeHook at the entry of the game's input-assembler flush,
# installed at startup in the VR and the flat profile alike, makes the
# applied copy agree with the wanted one before the flush binds it, for the
# slots the draw's layout uses. off counts the stale bindings and writes
# nothing. The log says "vertex resync: ..." (first sightings, then a count
# every 60 s while it is not zero); with this on, fix.scanner_body's
# "lent the other eye's buffer" count should stay 0.
#vertex_resync = on

# ============================================================================
# [experimental] -- present but not finished; off by default and safe to
# ignore. Here so the curious can try them and the log can name them.
# ============================================================================
[experimental]

# --------------------------------------------------------------------------
# Night vision
# --------------------------------------------------------------------------

# Experimental alternative appearance: outline geometry instead of fine
# surface textures, without a green fill. Brighten exterior terrain while
# retaining its colour and texture, and exclude cockpit/body surfaces and
# their outlines on the background. Off by default. The normal Night vision
# pulse stability fix remains independent and on by default. Live.
# ui: Realistic nightvision | live
night_vision_realistic = 0

# How bright the exterior terrain and its outlines are with Realistic
# nightvision on, 1.0 to 16.0. It multiplies the light already there,
# keeping the terrain's colour and texture; 1.0 removes the extra lift
# altogether, and 8.0 is the default. Lower it if the ground reads washed
# out, raise it for a darker world. The cockpit and your body stay excluded
# at every value. Has no effect when Realistic nightvision is off. Live.
# moved-from: fix.night_vision_brightness
# moved-from: advanced.night_vision_brightness (default 2.0)
# ui: Night vision brightness | range 1..16 | live
night_vision_brightness = 8.0

# Calm the brightness swing when you tilt your head between a bright console
# and dark space near a star. 0 is the game's own behaviour; 0.7 keeps 30% of
# the swing; 1 holds brightness steady. Only acts around stars -- menus,
# stations and on-foot always run stock. Experimental: it has been flown and
# it works, but how much damping is right is still a matter of taste rather
# than a measurement, and holding brightness still is not always what an eye
# expects. Live.
# moved-from: fix.exposure_damping
#exposure_damping = 0

# How slowly the damped brightness above follows a genuinely new scene, in
# seconds. Larger is steadier but adapts slower. 1..600. Live.
# moved-from: fix.exposure_damping_tau
#exposure_damping_tau = 45

# Render the Full System Scanner's zoomed body -- planet and rings -- at
# full eye resolution instead of the half resolution the game picks. The
# body is a mono image pasted into both eyes; at half size it reads as a
# pixelated sprite, and a thin ring resampled per eye from too few pixels
# can alias differently in each -- segments visible in one eye and not the
# other while a scan resolves (docs/fss-scanner.md). Costs 4x the pixels
# for that one offscreen layer, only while the scanner is zoomed. Live:
# flipping it changes the next FSS zoom, no restart. 1 on, 0 off.
# moved-from: fix.fss_res
#fss_res = 0

# Reconstruct the selected target's direction indicator instead of smearing
# it. stock is the game's own; sharp is the fix.
#
# Selecting a target adds exactly one draw per eye: a quad that composites a
# sub-region of an interface surface into the view, through a pixel shader
# that is -- in full -- one bilinear sample, an alpha discard and a colour
# matrix. The indicator's content occupies a fixed number of surface texels
# however large that surface is (measured: the surface grew 1.635x between
# two headsets and the indicator did not sharpen, and creating it larger
# changed nothing), so the quad always magnifies it by the same factor and
# that one bilinear tap is where the blockiness comes from.
#
# sharp replaces that shader with the same colour maths -- transcribed from
# the game's own disassembly and diffed against it instruction for
# instruction -- over AMD's EASU, an edge-adaptive kernel that is meaningfully
# better than a cubic on thin line art. A rig where EASU will not compile
# falls back to Catmull-Rom and says so.
#
# It CANNOT add detail: no resampler can. Cleaner edges and no bilinear
# diamonds is the whole prize. Live; any compile failure draws the game's own
# shader and says so.
#target_indicator = stock

# How far away the Full System Scanner's screen sits. 1.0 (the default)
# is the game's own distance; 0 inherits panel_distance, so one setting
# places both screens -- opt-in, because with a customised on-foot
# distance it moves the WHOLE scanner UI (field-attributed 2026-08-27:
# inherit at 0.7 shifted everything on zoom). The screen moves along
# your line of sight without changing its angular size -- closer means
# nearer stereo depth, not a bigger picture. Drawn through a replacement
# of the game's own composite shader pair (docs/fss-panel.md); if a game
# update rebuilds those shaders this does nothing and the log says the
# fix never engaged. Live.
# moved-from: fix.fss_panel_distance
#fss_panel_distance = 1.0

# --------------------------------------------------------------------------
# Anti-aliasing: the tuning keys
# --------------------------------------------------------------------------
#
# The switches are under [fix] (temporal_aa and render_sharpness, which
# the installer's settings window shows); what sits here is their tuning
# -- the temporal pass's jitter, weight and clamp -- all live, and worth
# touching only when the log names one. A line left under [fix] or
# [experimental] from an earlier layout still works and is read as the
# new name for that session, with a note in the log saying so.

# --------------------------------------------------------------------------
# Temporal anti-aliasing
# --------------------------------------------------------------------------

# --------------------------------------------------------------------------
# Field of view trim
# --------------------------------------------------------------------------

# Take degrees off the top AND the bottom edge of each eye. The game is told
# a narrower view and given a smaller render target, so DLSS and every
# full-screen pass shrink with it. You lose visible field at the trimmed
# edges; beyond them is black. Costs nothing but what you choose to give up.
# Applies within a second or two, because the game rebuilds its render targets
# when the recommended size changes. Needs openvr_api.dll installed.
#
# All three trims are PER HEADSET: how many degrees you can give up is a
# fact about the lenses in front of you, so the value is a list of
# runtime/system:degrees entries, one per headset, separated by commas, up
# to 8, each 0 to 30:
#
#   pimax-openxr/pimax-crystal-super:10, virtualdesktopxr/meta-quest-3:5
#
# The key for the headset you are wearing is the log's "headset_key," line:
# the runtime name and the headset name lowercased, with everything but
# letters and digits turned into "-". Copy it from there rather than typing
# the names, which contain slashes. These three are set in this file only:
# there is no menu row for them. A headset with no entry gets no trim; a
# bare number on its own (the 5 this key used to take) names no headset and
# is ignored, with the log saying so; and emptying the value clears every
# headset's entry. Live.
# moved-from: fix.fov_trim_vertical
# dev: hidden
fov_trim_vertical =

# The same, on each eye's outer (temple-side) edge. You lose visible field at
# the outer edges; beyond them is black. Per headset, in the same entries as
# the key above (pimax-openxr/pimax-crystal-super:5). Live.
# moved-from: fix.fov_trim_outer
# dev: hidden
fov_trim_outer =

# The same, on each eye's inner (nose-side) edge. This one shrinks only the
# stereo overlap -- the part both eyes see -- not the total field of view, so
# it is the cheapest degrees to give up. Per headset, in the same entries as
# the keys above (pimax-openxr/pimax-crystal-super:5). Live.
# moved-from: fix.fov_trim_nasal
# dev: hidden
fov_trim_nasal =
