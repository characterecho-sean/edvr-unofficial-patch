# EDVR settings.
#
# This file lives next to EliteDangerous64.exe. Everything here is optional --
# with the file missing entirely you get the defaults below, which are what
# most people want.


[fix]
# Stop one eye going darker than the other near bright lights.
#
# Elite works out how bright the scene is separately for each eye. Near a star
# or a station floodlight, one eye can see the light and the other cannot, so
# one eye dims and the other does not. It is uncomfortable and hard to unsee.
#
# This makes both eyes use the same brightness. 1 on, 0 off.
share_exposure = 1

# Make the space around the on-foot screen pure black.
#
# On foot, Elite shows the world on a flat screen floating in front of you,
# surrounded by dark grey. On an OLED headset that grey is lit pixels, so it
# reads as a glowing rectangle. This makes it properly black.
#
# 1 on, 0 off. No effect in the ship.
black_void = 1

# Make the on-foot screen sharper.
#
# Elite renders that screen at 1920x1080 no matter what your headset or your
# display can do, which is why text on foot looks soft. This raises it. It also
# applies to HMD (Cinema Mode), which puts the whole game on that same screen.
#
# 0 for both = off, which is the default. 16:9 sizes only -- the screen's shape
# is set by the game, so another aspect stretches the picture instead of
# widening it.
#
#   2880 x 1620   just over twice the detail
#   3840 x 2160   four times, and a clear improvement
#   3200 x 1800   in between, if 4K costs you frames
#
# It is not free. At 3840x2160 the game makes over a hundred render targets of
# about 32 MB each, plus others that grow with it. If your frame rate drops
# below your headset's refresh, step down -- juddering is worse than soft text.
#
# READ THIS ONE BEFORE TURNING IT ON. Unlike everything else here, this changes
# the game's code in memory while it runs. It does not touch any file on disk,
# and it puts the original values back when the game closes. It also refuses to
# do anything unless it recognises your exact game version and finds exactly
# what it expects -- so after a Elite update it will switch itself off and say
# so in the log, until this patch is checked against the new version.
#
# Needs a game restart to take effect, unlike the settings above.
vscreen_res_width = 0
vscreen_res_height = 0

# How far away the on-foot screen sits.
#
# 1.0 is Elite's own distance. Lower brings it closer, higher pushes it away --
# 0.5 is noticeably close, 2.0 is far. Change it while the game is running and
# the next second shows the result.
panel_distance = 1.0


[hotkey]
# Turn the brightness fix on and off while playing, to see the difference.
#
# Not a function key: Elite uses most of the F row, and F11 is the external
# camera. Scroll Lock, Pause and Num Lock are usually free.
# Takes effect when the game starts.
toggle_exposure = SCROLLLOCK


[log]
# EDVR writes a short plain text log to edvr_logs\ next to the game, saying
# which fixes started and whether they found what they needed. If you report a
# problem, open it in Notepad and paste the whole thing -- it is a few
# kilobytes and contains nothing personal.
#
# 0 writes nothing at all.
enabled = 1


# ---------------------------------------------------------------------------
# Advanced, and you should not need these.

[advanced]
# Which number in the screen's position data is its distance. Only change this
# if panel_distance stops moving the screen after a game update, which would
# mean Elite has rearranged that data.
panel_distance_index = 47

# Pin the brightness fix to one specific shader. Leave empty.
#
# Empty means EDVR finds the right one itself, every launch, by what it does
# rather than by which version of Elite compiled it -- so a game update does
# not break it. Only fill this in if the log says it picked the wrong one.
exposure_shader =

# Run alongside another mod that is also installed as d3d11.dll, such as EDHM
# or ReShade.
#
# Only one file can be called d3d11.dll, so:
#
#   1. Rename the other mod's d3d11.dll to something else, for example
#      d3d11_edhm.dll. Leave it in the same folder.
#   2. Put EDVR's d3d11.dll in its place.
#   3. Put the name you chose here.
#
# EDVR then loads that file and passes everything through it, so both mods work.
# Anything the other mod does not handle goes to Windows' own d3d11.dll.
#
# If the name here is wrong or the file will not load, EDVR says so in the log
# and carries on without it -- the game still starts, you just do not get the
# other mod. Needs a restart to take effect.
real_dll =
