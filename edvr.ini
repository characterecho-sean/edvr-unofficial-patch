# EDVR settings.
#
# This file lives next to EliteDangerous64.exe. Everything here is optional --
# with the file missing entirely you get the defaults below, which are what
# most people want.


[fix]
# Stop one eye going darker than the other near bright lights.
#
# Elite works out how bright the scene is separately for each eye. Near a star
# or a station floodlight, one eye can see the light and the other cannot, so
# one eye dims and the other does not. It is uncomfortable and hard to unsee.
#
# This makes both eyes use the same brightness. 1 on, 0 off.
share_exposure = 1

# Make the space around the on-foot screen pure black.
#
# On foot, Elite shows the world on a flat screen floating in front of you,
# surrounded by dark grey. On an OLED headset that grey is lit pixels, so it
# reads as a glowing rectangle. This makes it properly black.
#
# 1 on, 0 off. No effect in the ship.
black_void = 1

# Make the on-foot screen sharper.
#
# Elite renders that screen at 1920x1080 no matter what your headset or your
# display can do, which is why text on foot looks soft. This raises it. It also
# applies to HMD (Cinema Mode), which puts the whole game on that same screen.
#
# 1920x1080 below is Elite's own resolution, so as shipped this does nothing at
# all -- it is set to the stock value rather than to 0 so you can see what the
# game does and what you are changing it from. Raise it to turn the fix on.
#
# 16:9 sizes only. The screen's shape is set by the game, so another aspect
# stretches the picture instead of widening it.
#
#   2880 x 1620   just over twice the detail
#   3200 x 1800   in between, if 4K costs you frames
#   3840 x 2160   four times, and a clear improvement
#   5120 x 2880   seven times, if you have the headroom for it
#
# Anything 16:9 between 640 wide and 8192 works; those are just the useful ones.
#
# It is not free, and the cost grows with the area. At 3840x2160 the game makes
# over a hundred render targets of about 32 MB each, plus others that grow with
# it; 5120x2880 is roughly another 1.8x on top of that. If your frame rate drops
# below your headset's refresh, step down -- juddering is worse than soft text.
#
# READ THIS ONE BEFORE TURNING IT ON. Unlike everything else here, this changes
# the game's code in memory while it runs. It does not touch any file on disk,
# and it puts the original values back when the game closes.
#
# It finds what to change by recognising its shape rather than by trusting a
# version number, so an Elite update does not automatically break it. If it does
# not find exactly what it expects, it does nothing and says so in the log. And
# it cannot corrupt anything: it swaps one number for another of the same size,
# so the game runs the same instructions either way.
#
# Needs a game restart to take effect -- and it is not covered by the Scroll
# Lock toggle either. (Of the settings above, black_void and panel_distance are
# the ones re-read while the game runs; share_exposure needs a restart too, or
# the toggle key.) It changes the SIZE the game
# makes its images at, and images it has already made keep the size they were
# made at, so switching it while playing would leave a mix of both and look
# worse than either. To compare it, change the numbers and restart.
vscreen_res_width = 1920
vscreen_res_height = 1080

# How far away the on-foot screen sits.
#
# 1.0 is Elite's own distance. Lower brings it closer, higher pushes it away --
# 0.5 is noticeably close, 2.0 is far. Change it while the game is running and
# the next second shows the result.
panel_distance = 1.0

# Stop the one-frame flash when you jump, drop out of supercruise, or close the
# galaxy map.
#
# Occasionally the game draws a single frame from the wrong viewpoint -- a hard
# cut to somewhere else and straight back. On a monitor it is a blink. In a
# headset it reads as the world lurching, which is the part that hurts.
#
# This spots that frame and does not send it to your headset. SteamVR shows the
# previous frame for a moment longer instead, exactly as it does whenever a game
# misses a frame, so you see nothing rather than something wrong.
#
# NEEDS openvr_api.dll INSTALLED TOO. The detection happens in d3d11.dll but the
# decision has to be made where frames go to SteamVR. With only d3d11.dll
# installed this still writes to the log but cannot stop anything. See the
# README for the extra install step.
#
# 1 on, 0 off. NEEDS A RESTART -- this one is read when EDVR starts and not
# again, unlike most settings here. Changing it while the game runs does
# nothing, and there is no way to tell from inside a headset, so it is worth
# knowing before you spend a session wondering.
transition_flash = 1


[hotkey]
# Turn the brightness fix on and off while playing, to see the difference.
#
# Not a function key: Elite uses most of the F row, and F11 is the external
# camera. Scroll Lock, Pause and Num Lock are usually free.
# Takes effect when the game starts.
toggle_exposure = SCROLLLOCK

# Write the last ten seconds of viewpoint history to the log.
#
# Press this straight after seeing a flash that got through. It writes about 900
# lines describing where the game was drawing from on each of the last few
# hundred frames, which is what makes a report about a flash actionable rather
# than anecdotal -- it shows whether the frame was detected and let through, or
# never detected at all.
#
# Nothing is written until you press it, and it changes nothing about how the
# game renders.
dump_camera = PAUSE


[log]
# EDVR writes a short plain text log to edvr_logs\ next to the game, saying
# which fixes started and whether they found what they needed. If you report a
# problem, open it in Notepad and paste the whole thing -- it is a few
# kilobytes and contains nothing personal.
#
# 0 stops the log. One small file is still written either way: EDVR appends a
# line to edvr_breadcrumbs.txt next to the game as it starts up, before it has
# read this file at all. That is what remains if the game will not start far
# enough to open a log.
enabled = 1

# Where the log goes. Empty, the default, means edvr_logs\ next to the game.
#dir =

# Stop writing once the log reaches this many megabytes, so a long session
# cannot quietly fill a disk. The log says so when it stops.
#max_mb = 4


# ---------------------------------------------------------------------------
# Advanced, and you should not need these.

[advanced]
# Which number in the screen's position data is its distance. Only change this
# if panel_distance stops moving the screen after a game update, which would
# mean Elite has rearranged that data.
panel_distance_index = 47

# Pin the brightness fix to one specific shader. Leave empty.
#
# Empty means EDVR finds the right one itself, every launch, by what it does
# rather than by which version of Elite compiled it -- so a game update does
# not break it. Only fill this in if the log says it picked the wrong one.
exposure_shader =

# Run alongside another mod that is also installed as d3d11.dll, such as EDHM
# or ReShade.
#
# Only one file can be called d3d11.dll, so:
#
#   1. Rename the other mod's d3d11.dll to something else, for example
#      d3d11_edhm.dll. Leave it in the same folder.
#   2. Put EDVR's d3d11.dll in its place.
#   3. Put the name you chose here.
#
# EDVR then loads that file and passes everything through it, so both mods work.
# Anything the other mod does not handle goes to Windows' own d3d11.dll.
#
# If the name here is wrong or the file will not load, EDVR says so in the log
# and carries on without it -- the game still starts, you just do not get the
# other mod. Needs a restart to take effect.
real_dll =

# The same idea for openvr_api.dll: the name you renamed the game's own copy to.
# Empty means openvr_api_orig.dll, which is what the README tells you to use.
real_openvr_dll =

# How sensitive the transition flash fix is.
#
# A frame is treated as bad when the viewpoint it was drawn from is further than
# this from where the two frames before it were heading. Ordinary flight moves
# about 30 units a frame; the bad frames measured here were 9,900 to 24,000 out.
# 2000 sits well clear of both.
#
# The speed factor covers acceleration: during a jump the viewpoint legitimately
# gains thousands of units a frame, so the threshold becomes whichever is larger
# of the number above and this multiple of the current speed.
#
# Lower means more frames withheld. Withholding a frame that was fine costs one
# repeated frame, which is invisible on its own -- but a run of them is judder,
# which is worse than the flash. If the log shows far more frames withheld than
# you made jumps, raise these rather than lowering them.
transition_flash_units = 2000
transition_flash_speed_factor = 8.0

# Never withhold more than this many frames in a row, whatever the detector
# thinks. The bad frame is a single frame by definition, so a run of them means
# the detector is wrong about the scene rather than that the game glitched
# repeatedly.
transition_flash_max_consecutive = 2

# Where the viewpoint lives: the size of the constant buffer holding it, and the
# position of the first of its three coordinates within that buffer.
#
# This is the one part of EDVR that is specific to a build of Elite rather than
# to the shape of what it does, because there is no instruction pattern to
# recognise here -- only a block of numbers. If a game update moves it, EDVR
# notices that what it is watching does not behave like a viewpoint, disables
# the fix, and says so in the log. It does not guess.
camera_buffer_bytes = 5376
camera_buffer_offset = 1100

# Escape hatches. Listed because a setting nothing documents is a setting
# nobody can be told to try, and these are the ones a support conversation
# would reach for. Leave them alone otherwise.

# Install the render hooks even when both panel fixes are off. On, because the
# transition flash fix reads the camera through those same hooks and has no
# other source for it.
#panel_hooks_always = 1

# Which vtable slots the SteamVR compositor's Submit and WaitGetPoses occupy.
# EDVR knows these for the interface the game uses; they exist so a future
# SteamVR could be worked around without a new build. They must differ from
# each other, and EDVR refuses them if they do not.
#submit_index = 5
#waitgetposes_index = 2

# Ignore the crash sentinel for one launch. If EDVR disabled the compositor
# hook because a previous session ended before it could confirm itself, this
# starts it anyway.
#ignore_sentinel = 0

# ============================================================================
# EXPLORER CAM -- stereoscopic depth on foot, via the external camera
# ============================================================================
#
# IT GIVES YOU NO CAPABILITY YOU DO NOT ALREADY HAVE. The external camera is
# Elite's own, opened with your own binding. You can move and look around in it,
# but you cannot interact with the world: no shooting, scanning, opening a
# panel, using a terminal or picking anything up. To do any of that you switch
# back to first person exactly as you do now. This changes where the camera is
# while you are already in that mode, and nothing else.
#
# WHAT IT DOES. On foot, Elite renders first person to a flat panel -- one
# image, shown to both eyes, which is why walking around does not feel like VR.
# The external camera does not: it renders the world properly in stereo. This
# moves your viewpoint to where your commander's head is while you are in that
# camera, so you get real stereoscopic depth on foot.
#
# WHAT IT CANNOT DO. It cannot make first person stereo. The flat panel is flat;
# moving your head moves your view OF the panel, and the panel is still one
# image. Only the external camera renders in stereo, so that is the only place
# this applies.
#
# HOW IT WORKS. It offsets the pose EDVR reports for your headset, so the game
# moves its OWN camera -- as far as Elite knows, you leaned. Culling and object
# placement follow, which is what makes this work at all.
#
# THIS IS A CLIENT-SIDE VIEW CHANGE. It moves where the camera is. It does not
# touch your ship, your commander, the server, or anything another player can
# see.
#
# It reads ONE thing from the game: which external camera view is showing. That
# is camera state, and it is read-only -- see the camera_index_* settings in the
# [d3d11] section below for exactly what is read and what happens when it
# cannot be. Nothing here reads or writes gameplay state of any kind.
#
# SETTING IT UP
#
#   1. Set hotkey.external_camera to YOUR Elite external-camera key.
#   2. Enter the camera on foot and cycle to the COMMANDER REAR PROFILE
#      preset. That is the one this replaces, and it is not the preset the
#      camera opens on -- you have to cycle to it each time.
#   3. Tune the three offsets below with the headset on. They reload about once
#      a second, so you do not need to restart.
#
# COMFORT WARNING. These values move the viewpoint of a headset you are wearing.
# Change them a little at a time. Large jumps are unpleasant. The limit is
# +/-10 m per axis, and values beyond it are clamped rather than refused, so the
# view stops at the boundary instead of snapping back several metres in one
# frame.

[fix]
# Is the gate on at all? With this off, nothing below does anything.
head_offset_gate = 1

# Which external camera view the offset applies to. -1 = any view.
#
# The default camera view is a portrait one that looks BACK at your commander,
# and putting your viewpoint there means facing the wrong way. The view behind
# your commander is the one worth being in, so this exists to apply the offset
# only there.
#
# 1 is COMMANDER REAR PROFILE.
#
# THIS PRESET IS OVERRIDDEN. While you are on it, the camera is at your
# commander's head instead of where the preset normally puts it. That is the
# whole feature, and it means the preset no longer does its usual job -- so
# cycle to it when you want the 3D view, and cycle off it when you want the
# normal framing back.
#
# EVERY OTHER PRESET IS UNTOUCHED and keeps its usual position, so nothing you
# already use for screenshots changes. If you would rather give up a different
# one, set this to its number instead: the camera opens on 0 and counts up
# through the presets in the order the game cycles them.
#
# EDVR reads which preset you are on from the game itself, so there is nothing
# else to bind. If that read ever stops working -- after a game update, see
# camera_index_type_offset below -- the offset simply does not engage, and the
# log says so rather than guessing.
head_offset_view = 1

# How many presets the camera cycles through. 6 on foot, 0 means do not wrap.
#
# Only used when the preset is being counted rather than read from the game,
# which on this build does not happen -- it is here because the setting exists,
# not because you need it.
head_offset_view_count = 6

# Frames a camera keypress gets to take effect before it is treated as stale.
#
# Pressing the key does not stop the flat panel immediately -- the game takes
# tens of frames to change mode, measured between 25 and 86 -- so a press needs
# a grace period or it is discarded before it can do anything.
head_offset_intent_grace = 180

# Frames after the flat panel stops in which entering the camera is believed.
#
# Only used when hotkey.external_camera is NOT set. With the key bound, your
# press says what you did and this is not consulted -- it cannot tell entering
# the camera from boarding your ship, because both look the same on screen.
head_offset_enter_window = 60

# A ceiling on how long the offset stays applied without the panel returning.
#
# Also only for the no-key case. Leaving the camera normally brings the flat
# panel back; boarding a ship never does, so without a bound key there has to be
# some limit or the offset follows you into the cockpit. 3600 is 30 seconds at
# 120fps. With a key bound this is ignored, because the key says when you left.
head_offset_max_frames = 3600

[hotkey]
# YOUR external camera key, as bound in Elite. EDVR only watches for it; it
# never presses it, sends it, or interferes with the game receiving it.
#
# COMBINATIONS ARE SUPPORTED, and Elite's own default for this is a combination:
#
#   external_camera = CTRL+ALT+SPACE
#
# Modifiers are CTRL, ALT and SHIFT, joined with '+', key last. Case and spaces
# do not matter. A single key works too -- many people rebind this to F11 or
# similar, which is easier to reach in a headset.
#
# The modifiers must match exactly: a binding of CTRL+ALT+SPACE does not fire on
# bare SPACE, and a binding of SPACE does not fire on CTRL+ALT+SPACE. In Elite
# those can be different commands, so they are kept different here.
#
# Strongly recommended. Without it the gate has to guess from what is on screen,
# and entering the external camera, boarding a ship and leaving HMD Cinema Mode
# all look alike.
external_camera =


[openvr]
# WHERE YOUR VIEWPOINT GOES, in metres, relative to where the camera starts.
#
# All three are positive in the direction they are named:
#
#   head_offset_right     + is to your commander's right
#   head_offset_up        + is up
#   head_offset_forward   + is the way your commander faces
#
# forward is the big one, because the external camera starts several metres
# BEHIND your commander -- reaching their head means travelling most of that
# distance. The values below put the viewpoint above and behind the head in the
# behind-the-commander view. That is a good place to start rather than a
# universal answer: tune them to your own liking.
#
# It turns with your commander. Tracking space is parented to their facing, so
# one setting is right at every heading and does not need redoing per direction.
head_offset_right = 0.0
head_offset_up = 0.8
head_offset_forward = 2.75

# Turn the viewpoint, in degrees, about the up axis. 0 is almost always right.
#
# 180 sounds useful for the portrait view that looks back at you, and it is not:
# the game goes on culling from the direction it thinks you face, so the scene
# turns but large parts of it disappear. Use head_offset_view to pick a camera
# view that already faces the right way instead.
head_yaw_degrees = 0.0

# Only move the viewpoint in the on-foot external camera.
#
# Leave this at 1. Setting it to 0 applies the offset in EVERY mode, including
# your cockpit, which is disorienting rather than useful.
head_offset_external_only = 1

# Also offset the poses the game uses for its own simulation, not only the ones
# it renders from. Leave at 1 unless you are investigating a difference.
head_offset_game_poses = 1

# How long to keep trusting the mode signal from d3d11.dll after it stops
# arriving, in frames.
#
# The two halves of EDVR run once per rendered frame each, so in normal use this
# is never reached. It matters when the d3d11 half stops running: the last thing
# it said would otherwise stand forever, and if that was "you are in the
# external camera" the offset would stay applied in your cockpit for the rest of
# the session. This makes it expire instead.
head_offset_max_stale_frames = 90

[d3d11]
# READING THE CAMERA VIEW FROM THE GAME
#
# EDVR finds where the game stores which external-camera view is showing, and
# reads it. That is what makes head_offset_view work without you having to
# bind a key and keep a count in step.
#
# It is READ ONLY and it is narrow: what it keeps is one small integer, the
# index of the camera view on screen. It writes nothing to the game, keeps no
# other contents, and skips mapped images so the game's code is never read.
# It is camera state, not gameplay state -- nothing here can see or become
# your position, cargo, credits, missions or anything else.
#
# Turn it off and the offset never engages, because nothing else can say which
# camera preset you are on.
camera_index_track = 1

# Where in the game's executable the marker sits that identifies the camera
# settings records.
#
# THIS WILL MOVE WHEN THE GAME UPDATES. When it does, EDVR finds nothing,
# says so in the log, and falls back to counting keypresses -- it does not
# guess. If you know the new offset you can set it here without waiting for a
# new build.
camera_index_type_offset = 0x4D71C50

# Which record in that array holds the view index, and where in the record.
# Measured, and stable across launches with completely different heap layouts.
camera_index_ordinal = 11
camera_index_value_offset = 16

# The largest view index treated as believable. A value above this means the
# record has been reused for something else, so the answer would be a guess --
# EDVR reports "do not know" and counts keypresses instead.
camera_index_plausible_max = 7

# How much memory to search per frame while looking for the records, in MB.
# Spread over frames so the search never stalls the headset; it runs once.
camera_index_mb_per_frame = 64
