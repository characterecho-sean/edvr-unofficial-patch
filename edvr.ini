# EDVR settings.
#
# This file lives next to EliteDangerous64.exe. Everything here is optional --
# with the file missing entirely you get the defaults below, which are what
# most people want.
#
# Commented-out lines (like "#max_mb = 4") show expert settings at their
# defaults. They are tuned from measurement and a normal install never needs
# them; they are listed so that when the log or a support thread names one,
# you can find it. Uncomment to change.


[fix]
# Stop one eye going darker than the other near bright lights.
#
# Elite meters scene brightness per eye, so near a star one eye can dim while
# the other does not. This makes both eyes share one brightness. 1 on, 0 off.
share_exposure = 1

# Make the space around the on-foot screen pure black instead of glowing grey.
# On an OLED headset the difference is stark. 1 on, 0 off. No effect in ships.
black_void = 1

# Make the on-foot screen (and HMD Cinema Mode) sharper.
#
# Elite renders that screen at 1920x1080 regardless of your headset, which is
# why text on foot looks soft. Raise these to fix it. 16:9 sizes only:
#
#   2880 x 1620   just over twice the detail
#   3840 x 2160   four times, a clear improvement
#   5120 x 2880   seven times, if you have the headroom
#
# The cost grows with the area -- at 4K the game makes over a hundred render
# targets of ~32 MB each. If your frame rate drops below your headset's
# refresh, step down; judder is worse than soft text.
#
# READ BEFORE TURNING ON: unlike everything else here, this changes the game's
# code in memory while it runs (never any file on disk; original values return
# when the game closes). It finds what to change by shape, not version, so an
# Elite update either works or does nothing and says so in the log. Needs a
# game restart, and the stock 1920x1080 below means "off".
vscreen_res_width = 1920
vscreen_res_height = 1080

# How far away the on-foot screen sits. 1.0 is Elite's own distance; 0.5 is
# noticeably close, 2.0 far. Takes effect within a second, no restart.
panel_distance = 1.0

# Stop the one-frame flash when you jump, drop out of supercruise, or close
# the galaxy map.
#
# The game occasionally draws a single frame from the wrong viewpoint. In a
# headset that reads as the world lurching. This catches that frame and hands
# SteamVR a copy of the previous one instead, on time, so you see nothing
# rather than something wrong.
#
# NEEDS openvr_api.dll INSTALLED TOO (see the README): detection happens in
# d3d11.dll, but the decision is made where frames go to SteamVR. 1 on, 0 off.
# Read at startup only -- changing it mid-game does nothing.
transition_flash = 1


[hotkey]
# Toggle the brightness fix while playing, to see the difference. Elite uses
# most of the F row; Scroll Lock, Pause and Num Lock are usually free.
toggle_exposure = SCROLLLOCK

# Write the last ten seconds of viewpoint history to the log. Press it right
# after seeing a flash that got through -- it is what makes a report
# actionable. Writes nothing until pressed; changes nothing about rendering.
dump_camera = PAUSE


[log]
# EDVR writes a short plain text log to edvr_logs\ next to the game. If you
# report a problem, paste the whole file -- it is small and contains nothing
# personal. 0 stops it. (One line still goes to edvr_breadcrumbs.txt at
# startup either way; that is what remains if the game cannot start.)
enabled = 1

# Where the log goes. Empty means edvr_logs\ next to the game.
#dir =

# Stop writing once the log reaches this many megabytes.
#max_mb = 4


# ---------------------------------------------------------------------------
# Advanced. Safety valves and measured tuning -- the log will name one of
# these if it ever wants you to change it.

[advanced]
# Run alongside another mod that also installs as d3d11.dll (EDHM, ReShade):
# rename the other mod's d3d11.dll (e.g. d3d11_edhm.dll), put EDVR's in its
# place, and put the name you chose here. EDVR loads it and passes everything
# through, so both work. Wrong name or unloadable file: EDVR says so in the
# log and carries on without it. Needs a restart.
real_dll =

# The same idea for openvr_api.dll: the name you gave the game's own copy.
# Empty means openvr_api_orig.dll, which is what the README tells you to use.
real_openvr_dll =

# Pin the brightness fix to one specific shader. Empty means EDVR finds the
# right one itself each launch; only fill this if the log says it picked wrong.
exposure_shader =

# How sensitive the transition flash fix is: world units a frame must land
# off the viewpoint's path to count as bad, and the speed multiple that
# covers legitimate acceleration. Ordinary flight moves ~30 units a frame;
# measured bad frames were 9,900+. If the log shows far more frames withheld
# than you made jumps, raise the first number rather than lowering it.
transition_flash_units = 2000
transition_flash_speed_factor = 8.0

# --- The remaining flash tuning is set from measured field sessions; each
# --- rule's escape hatch is its zero. The log reports what every rule did,
# --- so change these only against a log, not a hunch.

# Never withhold more than this many frames in a row.
#transition_flash_max_consecutive = 2

# Jumps repeating within this percentage are a fixed gap between two of the
# game's render passes, not a transition, and are left alone. 0 = off.
#transition_flash_repeat_percent = 2.0

# Landing distances recurring within this FRACTION (0.005 = half a percent)
# are an orbiting render pass; landings within this many WORLD UNITS of a
# known fixed point are a parked one. 0 = off, each.
#transition_flash_radius_tolerance = 0.005
#transition_flash_park_units = 64

# A camera sitting at one distance this many consecutive frames proves the
# distance is YOURS, and it is never excused as an orbit (range 8..120).
#transition_flash_dwell_frames = 20

# More than this many withholds inside the window stands the fix down for two
# seconds -- it may never cost more than the flash it hides.
#transition_flash_burst_limit = 3
#transition_flash_burst_window = 60

# The repeating-jump-size rule: act, log (report without excusing), or off.
#transition_flash_separation = act

# A jump within this percentage above the last withheld one, landing nearby,
# is the same camera drifting away and is left alone. 0 = off.
#transition_flash_drift_pct = 10

# When a frame is withheld, hand SteamVR a copy of the previous frame instead
# of a missed deadline (~36 MB video memory, one GPU copy per eye per frame).
# The copy is always the game's own picture. 0 restores classic withholding.
#transition_flash_resubmit = 1

# --- Diagnostics. Note-only; nothing behaves differently because of them.

# Also write the camera history on every external-camera keypress (about 900
# log lines per press) -- for investigating a flash AT that transition.
#dump_camera_on_external_cam = 0

# Millimetres the headset must move in ONE frame before the pose history
# flags it. The history exists to tell a tracking glitch from a game glitch;
# EDVR cannot fix tracking and does not try.
#pose_step_note_mm = 50

# Hold the last good frame this many frames on the external-camera key.
# LEAVE AT 0: tried thoroughly, cannot work -- withholding stalls the game,
# and Elite postpones the transition until frames flow again, so the flash
# arrives after any hold ends. Kept so the next person with the idea finds
# the measurement instead of spending the same day.
#hold_frames_on_external_cam = 0

# --- Where the viewpoint lives in the game's memory: buffer size and the
# --- position of the first coordinate. Build-specific; if an update moves
# --- it, EDVR notices the data stops behaving like a viewpoint and says so.
#camera_buffer_bytes = 5376
#camera_buffer_offset = 1100

# Which number in the screen's position data is its distance. Only change if
# panel_distance stops working after a game update.
#panel_distance_index = 47

# --- Escape hatches a support conversation would reach for.

# Install the render hooks even with both panel fixes off (the flash fix
# reads the camera through them).
#panel_hooks_always = 1

# Vtable slots of the SteamVR compositor's Submit and WaitGetPoses, should a
# future SteamVR move them. Must differ; refused if they do not.
#submit_index = 5
#waitgetposes_index = 2

# Ignore the crash sentinel for one launch.
#ignore_sentinel = 0

# ============================================================================
# EXPLORER CAM -- stereoscopic depth on foot, via the external camera
# ============================================================================
#
# On foot, Elite renders first person to a flat panel: one image for both
# eyes, which is why walking around does not feel like VR. The external
# camera renders in real stereo. This moves your viewpoint to your
# commander's head while you are in that camera, giving you stereoscopic
# depth on foot.
#
# It gives you no capability you do not already have: the camera is Elite's
# own, opened with your own binding, and you still cannot shoot, scan or
# interact from it. It is a client-side view change -- nothing your ship,
# your commander, the server or another player can see. It reads ONE thing
# from the game: which camera view is showing (see [d3d11] below).
#
# SETTING IT UP
#   1. Set hotkey.external_camera below to YOUR Elite external-camera key.
#   2. Enter the camera on foot and cycle to COMMANDER RIGHT SHOULDER --
#      it is not the view the camera opens on.
#   3. Tune the three [openvr] offsets with the headset on; they reload
#      about once a second.
#
# COMFORT: these values move a headset you are wearing. Change them a little
# at a time. Limit +/-10 m per axis, clamped.

[fix]
# The master switch for everything in this block.
head_offset_gate = 1

# Which camera view the offset applies to. 2 is COMMANDER RIGHT SHOULDER:
# close to the head, already facing forward, so the offsets below stay small.
# That view is replaced while you are on it -- cycle to it for the 3D view,
# off it for the normal framing. Every other view is untouched. -1 = any
# view, including the portrait one that faces backwards; not recommended.
head_offset_view = 2

# Keep the offset on when the view briefly cannot be read from the game
# (near a planet it rebuilds its camera records every ten to thirty
# seconds). The last confirmed view is held until a read confirms or
# corrects it. The hold lives WITHIN an on-foot session: boarding a ship or
# SRV starts a new one, where the game resets its camera view to 0 and EDVR
# restarts its count from 0 with it -- cycle to your view as usual and the
# count follows each press (bind external_camera_next below). 0 = strict:
# the offset drops the moment the view cannot be confirmed.
head_offset_view_bridge = 1

# How many views the camera cycles through (used only when counting), the
# grace frames a keypress gets to take effect, and how recently the on-foot
# screen must have stopped for a press to count as entering the camera.
#head_offset_view_count = 6
#head_offset_intent_grace = 180
#head_offset_enter_window = 60

[hotkey]
# YOUR external camera key, as bound in Elite. EDVR only watches for it --
# it never presses or interferes with it. Combinations work, key last, extra
# held modifiers allowed:
#
#   external_camera = CTRL+ALT+SPACE
#
# The key can be any single character your keyboard types (letters, digits,
# punctuation: \ [ ] ; ' , . / ` - =), a name (F1-F24, SPACE, ENTER, TAB,
# LEFT/RIGHT/UP/DOWN, NUMPAD0-9, HOME, END, INSERT, DELETE, PAGEUP, PAGEDOWN,
# CAPSLOCK, PRINTSCREEN, BACKSLASH, LEFTBRACKET, SEMICOLON and friends), or
# 0x## for a raw virtual-key code. A name EDVR does not know is refused with
# a log line, never silently ignored.
#
# Strongly recommended: without it EDVR has to guess from what is on screen,
# and entering the camera, boarding a ship and leaving HMD Cinema Mode all
# look alike.
external_camera =

# YOUR next-camera-view key, as bound in Elite (same rules as above). Also
# recommended: EDVR usually reads which view you are on from the game, but
# near a planet that read drops out for stretches while the game rebuilds
# its records, and the held view cannot see you cycling. With this bound,
# every press moves the count, so the offset follows your cycling -- on the
# wanted view it engages, off it it does not -- read or no read.
external_camera_next =


[openvr]
# Where your viewpoint goes, in metres, relative to where the camera view
# starts. Positive right / up / forward in your commander's frame; it turns
# with them, so one setting is right at every heading. These defaults are
# tuned for COMMANDER RIGHT SHOULDER: forward to the head, up a little,
# and LEFT (negative right) off the shoulder onto the centre line. A view
# further back needs a larger forward value.
head_offset_right = -0.25
head_offset_up = 0.25
head_offset_forward = 1.25

# Turn the viewpoint, in degrees, about the up axis. 0 is almost always
# right: 180 makes the backwards portrait view face forward but the game
# still culls for the original direction, so the scene falls apart. Pick a
# forward-facing view with head_offset_view instead.
head_yaw_degrees = 0.0

# Apply the offset only in the on-foot external camera (0 = everywhere,
# including your cockpit -- disorienting); also offset the game's simulation
# poses, not just the rendered ones; and how many frames the mode signal
# from d3d11.dll stays trusted after it stops arriving.
#head_offset_external_only = 1
#head_offset_game_poses = 1
#head_offset_max_stale_frames = 90

[d3d11]
# Read which camera view is showing from the game's own memory -- what makes
# head_offset_view work without binding and counting keys. READ ONLY and
# narrow: one small integer, no game code touched, nothing else kept.
# Nothing here can see your position, cargo, credits or missions. Off, the
# offset never engages, because nothing else can say which view you are on.
camera_index_track = 1

# Where in the game's executable the camera-records marker sits. Moves when
# the game updates: EDVR then finds nothing, says so, and does not guess.
# Set the new value here without waiting for a new build if you know it.
#camera_index_type_offset = 0x4D71C50

# The record layout: which record holds the view, where in the record, the
# largest believable view value, and how much memory the one-time search
# reads per frame (MB).
#camera_index_ordinal = 11
#camera_index_value_offset = 16
#camera_index_plausible_max = 7
#camera_index_mb_per_frame = 64
