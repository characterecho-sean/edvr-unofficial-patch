#panel_distance_index = 47

# Install the render hooks even with both panel fixes off (the flash fix
# reads the camera through them).
#panel_hooks_always = 1

# Ignore the crash sentinel for one launch.
#ignore_sentinel = 0

# Turn every fix in d3d11.dll off, permanently, without uninstalling
# anything. The crash sentinel already does this for ONE launch after a
# crash; this is the setting for a machine where they crash EVERY launch,
# so the game stops alternating crash and play. The openvr half keeps
# running: the launch recentre and the compositor's own
# fixes never touched this half. 1 is normal.
#d3d11_fixes = 1

# Intercept DirectInput keyboard creation and gate keyboard input while the
# in-headset or flat settings menu is open, so keystrokes do not leak into
# ship controls. 1 (the default) hooks keyboard devices created by the game.
# 0 turns off DirectInput keyboard hooking and leaves input untouched.
#input_gate = 1

# How EDVR hooks the game's render context.
#   auto     let EDVR decide, by asking whose code implements the context.
#            It picks live when the methods are Windows' own and shared when
#            another mod wraps them. The shipped default; the log names which
#            one it chose. This is what makes the launch crash (issues #20 and
#            #21) fix itself with no setting here at all -- auto used to pick
#            private, and private is the mode that hung.
#   shared   patch the table the game shares with every other tool. Composes
#            with wrappers; anything else that writes those slots can bypass
#            EDVR's fixes, and EDVR says so in the log when it happens.
#   private  give the context a FROZEN copy of the table to itself. A tool
#            that writes the shared table cannot bypass EDVR's fixes, but the
#            copy is a snapshot: it does not follow the runtime if the runtime
#            re-points its own entries, and on a rig where Windows' d3d11.dll
#            re-lays the table mid-frame that snapshot desyncs and hangs the
#            GPU a second or two after launch (issues #20/#21). The older
#            mechanism, kept only as an escape hatch -- live supersedes it.
#   live     give the context a table to itself in which every entry reads
#            the game's own entry at the moment of each call. Keeps what
#            private buys -- nothing else can write the table the context
#            dispatches through -- and gives up the snapshot, so the runtime
#            may change its own entries as often as it likes and the next
#            call follows. Costs two extra jumps per call, which is nothing
#            anybody has been able to measure. This is what auto chooses when
#            the methods are Windows' own.
# Only change this against a log. auto already avoids the launch crash; if the
# game still dies a second or two after "arming d3d11 hooks", try shared. If
# shared keeps the game alive but the log then says EDVR's hooks are being
# pushed out of the table, live is the one to set by hand: it is both
# unbypassable and never out of date. Please report whether it helps, with
# both logs. Needs a game restart.
#context_hook_mode = auto

# Developer instrument: name whoever writes to one of the render context's
# function-table slots. 0 is off; any other number is the slot to watch.
#
# Every other line in the log that names a module for a slot is naming the
# POINTER FOUND THERE, not the code that stored it. This makes the slot's
# page read-only, catches the next write, and reports the instruction that
# did it -- the author, with no guessing. Needs context_hook_mode = shared.
#
# ARMED, EVERY WRITE ANYWHERE ON THAT PAGE TAKES AN EXCEPTION, and a page
# holds far more than one table. For one short session with a purpose; set
# it back to 0 afterwards. It stops on its own once it has seen enough.
# Needs a game restart.
#vtable_writer_probe = 0

# Developer instrument: log every change to the render context's function
# table -- what changed, from what to what, when, and who did it.
#
# The probe above names whoever writes to one slot. This answers the
# question a crash report needs instead: the game's own function table is
# rewritten constantly, almost always with the values it already held, and
# the interesting event is the rare write that puts something DIFFERENT
# there. Writes that change nothing are counted and dropped. Writes that
# change something get a line with the frame number, the time to a tenth of
# a millisecond, the slot, both values, the instruction that did it, which
# thread it was on and how it was reached -- and the first few are also
# written to edvr_breadcrumbs.txt, which survives the game being killed by
# a hung graphics card. A long frame and the once-a-second table check each
# print the last few as well, so a log that ends in a crash says whether
# the table changed before it or after.
#
# In the shared hook mode the table churns constantly -- the game's own
# graphics runtime writes its entry back over EDVR's hook, every frame -- so
# the per-change lines stop early there, after 4000 of them. (EDVR's own
# writes are not in the list at all: it opens the memory before writing, so
# those never reach this.) The running tally of who changed what carries on
# to the end of the session either way, and the closing summary says where
# the lines stopped.
#
# ARMED, EVERY WRITE ANYWHERE ON THAT MEMORY TAKES TWO EXCEPTIONS, which on a
# healthy machine is hundreds a frame; the closing summary says what that
# cost, in milliseconds per frame. It switches itself off, loudly, if that
# ever passes 4 ms a frame -- but never in the first ten seconds, because the
# crash it exists for happens in the first two. It also stops after two
# million caught writes, whichever comes first. One short session with a
# purpose, then back to 0. Only one of this and vtable_writer_probe can be
# armed at a time -- the log says which one is holding it if both are asked
# for. Needs a game restart.
#vtable_flip_timeline = 0

# Developer instrument: install the private table with NOTHING in it.
#   off    normal
#   swap   the render context gets a byte-identical private copy of its
#          function table and no fix is installed on it at all -- every
#          call runs exactly the code it always ran, from a new address.
#   live   the same, except every entry reads the game's own entry at the
#          moment of the call, so nothing can ever be out of date. The only
#          thing that is not stock is where the table lives.
# For a machine that dies seconds after the private-copy mode goes in:
# if it still dies with swap, the copy itself is fatal and no fix was ever
# the cause; if it lives, a fix is. If swap dies and live lives, what was
# fatal was the copy being a SNAPSHOT rather than the copy existing, which
# is a different thing to fix. Every d3d11 fix is off while either is set.
# One session each, then back to off. Needs a game restart.
#context_hook_probe = off

# Developer instrument: name the frame scheduler that drives the engine's
# kinematic/bucket worker entries (docs/engine-render-pipeline.md stage 0).
# Every worker entry is invoked only through a vtable-table callback stub, so
# no static read of the binary can say who calls them. This watches the four
# scheduler-fed entries (the two worker entries, the per-record drain and the
# reset+repopulate) and captures, read-only, the return addresses on the live
# stack at each entry -- one bounded scan, hashed into a signature, counted
# per target. 0 is off (the shipped state). One session with a purpose, then
# back to 0. What a flight tells you: ONE VA recurring at a consistent frame
# position across signatures is the dispatcher; VAs in 0x1462b0000..0x1462c0000
# or 0x145dd0000..0x145dde000 are the table stubs (the caller above the stub
# is the scheduler); anything else named in .text is a scheduler candidate
# directly. Totals and the top three signatures per target print every 20 s.
# Needs a game restart.
#scheduler_probe = 0

# Flat camera producer probe (docs/design-flat-camera-integration.md, the C1
# step): who computes the scene CB's camera rows. on hooks the game's
# Ghidra-validated single-site constant-upload helper (executable patch, the
# same mechanism as the write watches), learns the 5376-byte staging block,
# and arms a bounded hardware write breakpoint on its camera-row span -- the
# writer's RIP is named with a bounded stack. Budgets: 8 blocks, 8 re-arms, 8
# writers, 30 s armed; every budget says its name when reached. Diagnostic
# only; off is the shipped state. Live (hot-reload), no game restart needed.
#flat_camera_producer_probe = off

# VR camera census (design doc section 82, "Pre-build findings"): which camera
# is which at the game's view-constant refresh, so the on-foot world route's
# jitter can reach the world's camera and never an eye's. on installs the hook
# the flat camera path uses (EliteDangerous64.exe+0x592200) in an OBSERVE-ONLY
# mode: it never writes a bound pair, a dirty flag or a row, and the flat
# runtime is never asked anything. It logs "vr camera census" lines, about four
# hundred a session at most: a 5 s line (calls, calls on other threads, kinds,
# callers, distinct cameras, where in the frame the calls fall against the tone
# draw), one line per distinct camera with its field signature and the view it
# belongs to, the whole call sequence of the first three on-foot frames, and,
# at the eye composite draw of the first four on-foot frames, the eye's own
# constant-buffer rows read back from the GPU (a stall of a few milliseconds
# each, eight times a session). An on-foot frame is one in which the tone is
# drawn while Elite's own journal says on foot; with no journal the tone alone
# decides, and with no tone (the world route reports no draw progress) the
# journal alone does. Read it with python tools\edvr_log.py --camera-census.
# While it is on, the world route also counts the pixels its resolver refuses
# (stage 2 experiment build): one frame in four, a small compute pass over a
# class byte per pixel, summed by cause on a "vr world route refusal 5s:" line,
# which splits the stale-slot pixels into stale-refused and stale-kept (what
# the steady-detail depth check, always on, kept). The line is printed while the
# census is off as well, carrying only the depth check's frame counts.
# VR profile only: the flat profile reads it as off. Diagnostic. Zero mutation.
# Off is the shipped state. Live: on installs the hook at the next frame; off
# stops the census and leaves the hook in place, inert, until the game exits.
# dev: choices off, on
vr_camera_census = off

# Developer instruments for isolating which draw makes an effect: skip
# eye-texture draws matching a census spec ("X:15360", ranges and @ filters
# supported, or "vs:4435F2E50020E7F3" to skip everything drawn by one
# vertex shader -- the census logs each draw's shader as vh=, and two
# effects sharing a pipeline can still be told apart that way), skip draws
# into an offscreen buffer named by size, or skip by position in the frame
# and bisect. Live; empty is off, and off is the only shipped state. The
# log counts what it drops.
#
# census_skip_offscreen also takes an optional draw spec after the size:
# "4259x2395" skips everything drawn into that buffer, "4259x2395:X:2508"
# skips only the indexed-instanced draws with 2508 indices. A size alone
# answers "is the thing built in here"; the spec answers "which draw".
#
# The particle billboard family, mapped 2026-08-29 by disassembling every
# vertex shader in a shader dump (advanced.glare_shader_dump) and looking
# for the construction docs/particle-billboards.md describes: a quad basis
# built once from the camera, cross(cb1[278], cb1[279]) -- cameraUp with
# cameraForward. That pair, crossed, is the fingerprint of this bug in any
# dump. SEVEN shaders carry it, and fix.particle_billboard now replaces
# two of them:
#
#   vs:EB787F983BC1F5A3   the geyser and smoke plume -- REPLACED
#   vs:6041FD2D3D0164E1   the solar flare -- REPLACED (found this way)
#   vs:9AEC596A2B036EA6   the witchspace starfield -- NOT replaced, and
#                         must not be: 0.12.3 gave it the flare's
#                         replacement on a likeness and the starfield
#                         vanished. It writes the same values to different
#                         output registers under different TEXCOORD
#                         indices, so it needs its own transcription or
#                         nothing at all.
#   vs:9F4BBCFCD3B68BC9
#   vs:78F5F08D02EE38CC
#   vs:BBAD1CA808E1E292
#   vs:1B285CBC9F185D4D
#
# The last four are the same bug on effects nobody has named yet. To find
# which of them draws an effect, park where it is visible and set
# census_skip to one at a time -- the key is live, so no restart is needed,
# and the effect disappearing names its shader.
#
# Two things the flare hunt cost, worth not paying twice. A dump holds only
# shaders CREATED in sessions that ran with the dump on, so it records
# scenes visited rather than the game: the flare's shader was in no dump,
# and a sweep over the dump could not have found it. And these shaders do
# NOT share a signature -- the plume is 13-in/12-out, the flare 10-in/5-out
# -- so a replacement cannot simply be pointed at another hash; each
# signature group needs its own transcription.
#
# DB113566B6A59C5B shares the family's inputs but selects a supplied axis
# or world up instead of the camera, and guards its length BEFORE dividing.
# It is what a correct one looks like inside the game; read it first.
#census_skip =
#census_skip_offscreen =

# Developer instrument: re-issue ONE batched draw without some of its
# rectangles. WIDTHxHEIGHT:KIND:COUNT:LO[-HI] -- the draw of that shape
# into that offscreen target is drawn as the indices before quad LO plus
# the indices after quad HI, six indices to a quad. Elite batches its solid
# UI rectangles, so skipping the whole draw takes a dialog and the wash
# behind it together; this is how one of them gets named. Live; empty is
# off, and off is the only shipped state.
#census_skip_quad =

