# TEMPORARY (F180): Standing ADS spine straighten: the game's aiming animation hunches your upper spine and neck forward when you stand and aim down sights, so the neck sits low and forward of the
# headset. This takes that hunch back out by this share (0 to 1): the spine's three upper levels and the neck turn back toward the pose the same weapon had at the hip just before you pressed
# aim (the last standing frames at the hip; the first frame of the press when there were none). 0 leaves the game's pose, 1 puts them at the hip's. It grows with the sights and is 0 crouched
# and at the hip; your eye and the gun do not move, the body and its arms do, and the shoulders, arms and the raise of your body follow the straightened spine. 0 to 1. In native on foot VR
# only, with the full third-person body. Live. It is a test dial: once the right value is found it becomes the behaviour and this key goes. The default, 0.9, is the value the pilot flew with.
# ui: Standing ADS spine straighten | range 0..1 | step 0.05 | live
native_on_foot_stand_ads_spine_straighten = 0.9

# TEMPORARY (F180): Neck guard distance: how far ahead of your chest the guard keeps your eye, in cm, so you do not look straight down the open neck. Armed, when the body would stand closer than this
# (the pose, the forward and left dials, the reach to the foregrip), the body is moved back along the way you face until it holds this distance. Unarmed at the hip it only measures and moves
# nothing. 0 turns the guard off. 0 to 20. In native on foot VR only, with the full third-person body. Live. It is a test dial: once the right value is found it becomes the behaviour and this key
# goes. The default, 2, is the value the pilot flew with.
# ui: Neck guard distance | range 0..20 | step 0.5 | unit cm | live
native_on_foot_neck_guard_cm = 2.0

# TEMPORARY (F181): Hip elbow swivel max: with a two-handed gun at the hip the game's pose can swing your left elbow far up and out of the plane of the arm it animated (the rifle's forearm then climbs
# steeply to the foregrip). This limits that swing to at most this many degrees off the arm's own plane (the plane the in-game log measures it from, the one a hanging elbow gives 0 in); the elbow
# is turned back toward the plane on the side it was on. 90 leaves the game's pose as it is. The cap is whole at the hip and fades out as you aim down sights, where the hanging elbow rules;
# pistols, tools and an empty hand are untouched. 0 to 90. In native on foot VR only, with the full third-person body. Live. It is a test dial: once the right value is found it becomes the
# behaviour and this key goes. The default, 25, is the first value tried: a swing under it (the shotgun's 18 degrees) is not touched.
# ui: Hip elbow swivel max | range 0..90 | step 1 | unit deg | live
native_on_foot_hip_elbow_swivel_max_deg = 25.0

# TEMPORARY (F185): ADS left arm reach: when you aim down sights with a two-handed gun your left arm is stretched down the side, locked straight. This keeps your left shoulder within this share
# of the left arm's full length (upper arm plus forearm) of the left-hand grip, so the elbow keeps a bend, about 45 degrees at 0.92. The shoulder reaches forward first (the collar bone turns
# forward, at most 15 degrees); what that cannot cover comes from moving the body toward the grip, as the reach rule does now. 1 is the old behaviour: the grip just reachable. The share grows
# with the sights (the detach), in both stances, and is 1 at the hip; pistols and tools are untouched. Your eye and the gun do not move, the body and its arms do. 0.8 to 1. In native on
# foot VR only, with the full third-person body. Live. It is a test dial: once the right value is found it becomes the behaviour and this key goes. The default, 0.92, is the first value tried.
# ui: ADS left arm reach | range 0.8..1 | step 0.01 | live
native_on_foot_ads_left_reach = 0.92

# TEMPORARY (F170): Crouched ADS torso square: while you are crouched and aiming down sights the game's animation blades your upper body about 29 degrees with the left shoulder forward, so the gun lies
# in the left shoulder. This turns the body about the vertical toward square to the aim, by this share of the shoulder line's measured blade: 1 squares it, 0.5 takes out half, 0 leaves the game's pose.
# The turn grows with the crouch and with the sights, so it is 0 standing and at the hip, and it holds while you walk crouched in the sights. The left hand stays on the foregrip. 0 to 1.
# In native on foot VR only, with the full third-person body. Live. It is a test dial: once the right value is found it becomes the behaviour and this key goes.
# The default, 0, is the value the pilot flew with: the game's pose is left as it is.
# ui: Crouched ADS torso square | range 0..1 | step 0.05 | live
native_on_foot_crouch_ads_square = 0.0

# TEMPORARY (F169): Pistol sprint arm swing phase: while you sprint with a pistol drawn, the left hand lets go of the pistol and the left arm swings as the game animates it, almost in step
# with the right arm. This reads the left arm's animation from earlier in the stride, as a fraction of one stride (0 to 1, measured while you run), so the two arms can be brought to swing
# against each other; about 0.5 is the opposite phase. It is blended in as the hand lets go, and 0 changes nothing. In native on foot VR only, with the full third-person body. Live. It is a
# test dial: once the right value is found it becomes the behaviour and this key goes. The default, 0.5, is the value the pilot flew with.
# ui: Pistol sprint arm swing phase | range 0..1 | step 0.05 | live
native_on_foot_pistol_sprint_swing_phase = 0.5

# TEMPORARY (F193, A/B): ADS: body follows the camera: when you crouch or jump while aiming down sights, the arms lag the body, because in the sights the body's height came from the game's animation of the
# neck (plus a raise the legs allow), which follows a crouch or a jump late; at the hip the body follows your camera's height at once and the arms stay in place. on: in the sights too, standing and crouched, the
# body's neck is held one eye height (the Eye height setting) below the game's camera, the way it is at the hip: it lowers with a crouch and with the camera in a jump, and a raise is still held to what the legs
# give so no foot lifts. off: as before. The camera it follows is the game's own, never the eye as you see it, and a stability check falls back to the old way for the rest of a press if the body ever moves on its own
# while the camera is steady. In native on foot VR only. Live. It is an A/B test: once the flights have their answer it becomes the behaviour and this key goes.
# ui: ADS: body follows the camera (test) | choices on, off | recommended on | live
native_on_foot_ads_body_follows_camera = on

# ADS: scope zoom FOV: the reference field of view, in degrees, that the scope zoom (fix.native_on_foot_ads_scope_zoom) measures the game's zoom against: M = tan(h / 2) / tan(a / 2),
# with a the weapon's own aiming FOV (the Executioner 15 with its scope and 35 without, the assault rifles 48, the sub-machine guns 50, the pistols, the shotgun and the launcher 52).
# The game keeps an absolute aiming FOV for each weapon and the headset has no FOV of its own to compare it with, so h stands in for the FOV the game plays at on foot: 56.3 is this
# rig's on-foot FOV option, and a larger h magnifies more. 30 to 90. TEMPORARY: it goes, with the value that settles as the behaviour, when the lens has flown. Live.
# ui: ADS: scope zoom FOV (experimental) | range 30..90 | step 0.5 | unit deg | recommended 56.3 | live
native_on_foot_ads_scope_zoom_fov = 56.3

# ADS: scope zoom full detail: your choice of how the scope zoom (fix.native_on_foot_ads_scope_zoom) shows the scoped Executioner's optic. off: the digital zoom of your right eye's picture inside the scope's
# frame, which keeps 1 / M of its detail (a 4 times zoom shows a quarter of it), with no edge. on: the game draws your LEFT eye as the zoomed view instead -- its field narrowed by the same factor about
# the sight line, the eye itself not moved -- and the scope's lens shows that picture, each point of it where that eye sees the same spot, so the optic is as sharp as the game draws it. The price is an
# edge: your right eye's view covers the left eye, so the zoomed picture is never shown, but the outer part of the left eye (about the outer 10 degrees) is the one part the cover cannot reach, so while
# the zoom stands that part goes black, and an equal black edge takes the outer part of your right eye's view, so both eyes' outer view are alike. It needs the scope zoom on, ADS: sight eye at both and a
# temporal anti-aliasing mode (the lens takes the left eye's picture after the upscaler). Every other sight is unchanged. In native on foot VR only. Live. It is on the Experimental page.
# ui: ADS: scope zoom full detail (experimental) | choices on, off | recommended off | live
native_on_foot_ads_scope_zoom_full_detail = off

