# EDVR settings.
#
# This file lives next to EliteDangerous64.exe. Everything here is optional --
# with the file missing entirely you get the defaults below, which are what
# most people want.
#
# Commented-out lines (like "#max_mb = 4") show expert settings at their
# defaults. They are tuned from measurement and a normal install never needs
# them; they are listed so that when the log or a support thread names one,
# you can find it. Uncomment to change.


[fix]
# Stop one eye going darker than the other near bright lights.
#
# Elite meters scene brightness per eye, so near a star one eye can dim while
# the other does not. This makes both eyes share one brightness. 1 on, 0 off.
share_exposure = 1

# Make the space around the on-foot screen pure black instead of glowing grey.
# On an OLED headset the difference is stark. 1 on, 0 off. No effect in ships.
black_void = 1

# Make the on-foot screen (and HMD Cinema Mode) sharper.
#
# Elite renders that screen at 1920x1080 regardless of your headset, which is
# why text on foot looks soft. Raise these to fix it. 16:9 sizes only:
#
#   2880 x 1620   just over twice the detail
#   3840 x 2160   four times, a clear improvement
#   5120 x 2880   seven times, if you have the headroom
#
# The cost grows with the area -- at 4K the game makes over a hundred render
# targets of ~32 MB each. If your frame rate drops below your headset's
# refresh, step down; judder is worse than soft text.
#
# READ BEFORE TURNING ON: unlike everything else here, this changes the game's
# code in memory while it runs (never any file on disk; original values return
# when the game closes). It finds what to change by shape, not version, so an
# Elite update either works or does nothing and says so in the log. Needs a
# game restart, and the stock 1920x1080 below means "off".
vscreen_res_width = 1920
vscreen_res_height = 1080

# How far away the on-foot screen sits. 1.0 is Elite's own distance; 0.5 is
# noticeably close, 2.0 far. Takes effect within a second, no restart.
panel_distance = 1.0

# Stop the one-frame flash when you jump, drop out of supercruise, or close
# the galaxy map.
#
# The game occasionally draws a single frame from the wrong viewpoint. In a
# headset that reads as the world lurching. This catches that frame and hands
# SteamVR a copy of the previous one instead, on time, so you see nothing
# rather than something wrong.
#
# NEEDS openvr_api.dll INSTALLED TOO (see the README): detection happens in
# d3d11.dll, but the decision is made where frames go to SteamVR. 1 on, 0 off.
# Read at startup only -- changing it mid-game does nothing.
transition_flash = 1

# Put the RemLok emergency helmet's edge lines at your temples instead of
# along your nose (frontier issue 69074). The game stamps the same
# both-edges overlay into each eye; through a headset's lenses the inner
# copies land in the middle of your view, like a hair across your face.
#
#   outer   each eye keeps only the line on its own outward side -- what a
#           real helmet looks like, since your nose hides the inner edge
#           (the default)
#   hide    no lines at all
#   stock   leave the game alone
#
# Takes effect within a second of saving, no restart. The overlay is
# recognised by its shape, not a game version; if an update changes it,
# this does nothing rather than guessing.
remlok_lines = outer

# Where each eye's helmet line sits, in DEGREES from straight ahead. The
# game draws it at the image border, which is the lens rim -- on a wide
# headset that is a line nobody sees. EDVR reads your headset's true
# projection from the vr half and derives the overlay size that puts the
# line here, so one number is right on every headset: 46 was tuned by eye
# on a Quest 3 and a Pimax, and both landed within a degree of it. Live.
# Range 20..60; 0 turns the derivation off (remlok_scale under [advanced]
# then applies, as it also does without the second file installed).
remlok_line_angle = 46

# Hold the loading screen's ship hologram still. The hologram is built in
# screen space from the model's depth, and its scan pattern is sampled in
# SCREEN coordinates -- fine on a monitor, but in a headset the pattern
# rides your head while the ship stays put: a low-res shimmer inside the
# hull that is genuinely nauseating to look at (docs/loading-hologram.md).
# "steady" (the default) replaces the pattern with a uniform for exactly
# that one draw per eye, so the ship renders calm; "stock" leaves the
# game alone. Live.
holo_pattern = steady

# Pin the witchspace destination star. During a hyperspace jump the star
# ahead is a 2D sprite at a fixed image position -- it rides your head in
# VR instead of holding the tunnel's axis. "pinned" counter-moves its
# draw against your head's rotation, from the pose and projection the vr
# half publishes, so it behaves like a thing at infinity: fixed direction,
# no parallax. Scoped to actual jumps by the journal (the same sprite
# family draws a sun's flare in ordinary space, where the game places it
# correctly) -- so it needs the second file AND journal_watch on; without
# either it does nothing. "stock" leaves the game alone. Live.
witchstar = stock


[hotkey]
# Key names for the two keys below: any single character your keyboard
# types, written as itself (\ [ ] ' , . / ` - = all literal; write ';' and
# '#' as SEMICOLON and HASH since they start comments here); names like
# F1-F24, SPACE, NUMPAD0-9, SCROLLLOCK; combinations with the key last,
# CTRL+ALT+SPACE. An unknown name is refused with a log line. The CAMERA
# keys are not settable here -- EDVR reads those from your Elite bindings
# (see read_game_bindings further down).

# Toggle the brightness fix while playing, to see the difference. Elite uses
# most of the F row; Scroll Lock, Pause and Num Lock are usually free.
toggle_exposure = SCROLLLOCK

# Write the last ten seconds of viewpoint history to the log. Press it right
# after seeing a flash that got through -- it is what makes a report
# actionable. Writes nothing until pressed; changes nothing about rendering.
dump_camera = PAUSE

# Diagnostic: log a census of every draw that lands in the eye textures for
# the next few frames, to isolate the draws behind one visual effect. Press
# once with the effect absent and once with it present, then
# tools/diff_draw_census.py names the draws only one census contains.
# Wanted for frontier issue 69074, the RemLok helmet edges drawn in the
# wrong eyes. Changes nothing about rendering; costs nothing until pressed.
# Empty is off. Use a BARE key (NUMLOCK is usually free): chords on the
# Pause/ScrollLock cluster can reach Windows as a different key entirely
# (Ctrl+Pause and Ctrl+ScrollLock are both Break), and the binding then
# never fires. The log says what this key bound, so check there first.
#dump_draws =


[log]
# EDVR writes a short plain text log to edvr_logs\ next to the game. If you
# report a problem, paste the whole file -- it is small and contains nothing
# personal. 0 stops it. (One line still goes to edvr_breadcrumbs.txt at
# startup either way; that is what remains if the game cannot start.)
enabled = 1

# Where the log goes. Empty means edvr_logs\ next to the game.
#dir =

# Stop writing once the log reaches this many megabytes.
#max_mb = 4


# ---------------------------------------------------------------------------
# Advanced. Safety valves and measured tuning -- the log will name one of
# these if it ever wants you to change it.

[advanced]
# Run alongside another mod that also installs as d3d11.dll (EDHM, ReShade):
# rename the other mod's d3d11.dll (e.g. d3d11_edhm.dll), put EDVR's in its
# place, and put the name you chose here. EDVR loads it and passes everything
# through, so both work. Wrong name or unloadable file: EDVR says so in the
# log and carries on without it. Needs a restart.
real_dll =

# EXPERIMENTAL, off: enter the external camera with no key at all, from the
# game's own on-foot status. Entry detection works, but with no key the
# camera VIEW cannot be followed reliably near settlements yet, so the
# offset can fail to engage on a second landing. Parked until controller
# support lands. 1 turns it on if you want to try it anyway.
#keyless_camera = 0

# The same idea for openvr_api.dll: the name you gave the game's own copy.
# Empty means openvr_api_orig.dll, which is what the README tells you to use.
real_openvr_dll =

# Interfaces to refuse without asking the runtime behind EDVR: a comma-
# separated list of name prefixes, so "IVROverlay" covers IVROverlay_028 and
# every other version of it. Empty refuses nothing, and empty is right for
# real SteamVR. This exists for chaining OpenComposite (real_openvr_dll
# above): OpenComposite raises a FATAL dialog for any interface it does not
# implement, and the request that trips it can come from injected software --
# an overlay, a headset vendor's client -- rather than from the game, which
# never asks. A refused request is answered "interface not found", the same
# answer real SteamVR gives for versions it predates, and the vr log names
# each refused interface once.
#suppress_interfaces =

# Pin the brightness fix to one specific shader. Empty means EDVR finds the
# right one itself each launch; only fill this if the log says it picked wrong.
exposure_shader =

# How much of each eye's width the RemLok overlay keeps in "outer" mode,
# from the eye's own temple inward. The clipped remainder is where the
# wrong-side line sat. Live; clamped to 0.50..0.95 -- below half the two
# kept regions no longer cover the middle, near 1.0 nothing is clipped.
#remlok_keep_fraction = 0.55

# If "outer" mode puts the lines on your NOSE instead of your temples, the
# game drew the eyes in the other order on this rig: set 1. The log's
# "first applied to the X eye" line is the evidence to check.
#remlok_swap_eyes = 0

# Render the RemLok overlay this fraction of full size, centred -- the
# MANUAL form of remlok_line_angle, consulted only when the angle is 0 or
# the vr half has not published your headset's projection (second file not
# installed). 1.0 is the game's own placement; smaller pulls the lines
# inward. Live; clamped to 0.50..1.00.
#remlok_scale = 1.0

# The uniform the steady hologram pattern is replaced with, 0 (black) to
# 255 (white). The right value depends on how the shader combines the
# term: 255 is identity if it multiplies, 0 if it adds. Live -- change it
# during a loading screen and look. Only read while holo_pattern = steady.
#holo_pattern_level = 255

# Sign corrections for the pinned witchspace star, should a rig's pose
# convention run the other way: if the star moves WITH your head, doubled,
# instead of holding still, flip the axis that misbehaves. Live.
#witchstar_flip_x = 0
#witchstar_flip_y = 0

# Compensation strength for the pinned star. 1.0 is the geometric answer;
# tune live in witchspace until the star holds still -- the log prints
# each shift beside the tangents it came from, so the value that pins by
# eye is also a measurement. 0..3.
#witchstar_gain = 1.0

# How sensitive the transition flash fix is: world units a frame must land
# off the viewpoint's path to count as bad, and the speed multiple that
# covers legitimate acceleration. Ordinary flight moves ~30 units a frame;
# measured bad frames were 9,900+. If the log shows far more frames withheld
# than you made jumps, raise the first number rather than lowering it.
transition_flash_units = 2000
transition_flash_speed_factor = 8.0

# --- The remaining flash tuning is set from measured field sessions; each
# --- rule's escape hatch is its zero. The log reports what every rule did,
# --- so change these only against a log, not a hunch.

# Never withhold more than this many frames in a row.
#transition_flash_max_consecutive = 2

# Jumps repeating within this percentage are a fixed gap between two of the
# game's render passes, not a transition, and are left alone. 0 = off.
#transition_flash_repeat_percent = 2.0

# Landing distances recurring within this FRACTION (0.005 = half a percent)
# are an orbiting render pass; landings within this many WORLD UNITS of a
# known fixed point are a parked one. 0 = off, each.
#transition_flash_radius_tolerance = 0.005
#transition_flash_park_units = 64

# A camera sitting at one distance this many consecutive frames proves the
# distance is YOURS, and it is never excused as an orbit (range 8..120).
#transition_flash_dwell_frames = 20

# More than this many withholds inside the window stands the fix down for two
# seconds -- it may never cost more than the flash it hides.
#transition_flash_burst_limit = 3
#transition_flash_burst_window = 60

# The repeating-jump-size rule: act, log (report without excusing), or off.
#transition_flash_separation = act

# A jump within this percentage above the last withheld one, landing nearby,
# is the same camera drifting away and is left alone. 0 = off.
#transition_flash_drift_pct = 10

# When a frame is withheld, hand SteamVR a copy of the previous frame instead
# of a missed deadline (~36 MB video memory, one GPU copy per eye per frame).
# The copy is always the game's own picture. 0 restores classic withholding.
#transition_flash_resubmit = 1

# --- Diagnostics. Note-only; nothing behaves differently because of them.

# Also write the camera history on every external-camera keypress (about 900
# log lines per press) -- for investigating a flash AT that transition.
#dump_camera_on_external_cam = 0

# The census probe (NOT note-only): while set, draws into the eye textures
# matching KIND:INDEXCOUNT from a census line are not drawn at all --
# "X:15360", or several with commas, and an optional @WIDTHxHEIGHT narrows
# a spec to draws sampling a texture of exactly that size in PS slot 0
# ("N:3@1024x512" -- kind and count alone cannot single out one fullscreen
# triangle from the tonemap chain's identical ones). It answers "which
# candidate draw IS the effect": set one, look, clear it. Live within a
# second of saving; empty is off, and off is the only shipped state. The
# log counts what it drops. Used with dump_draws (under [hotkey]) for
# issue 69074.
#census_skip =

# The bisection form of the same probe: skip eye-texture draws by POSITION
# in the frame -- the census line's # number, both eyes counted through one
# frame -- "350-500", inclusive, up to four ranges with commas
# ("1-350,500-9999"). For the draw the census diff cannot see: one that
# runs in both states and only changes its content. Halve a range against
# what you see and converge in about eight saves; several ranges corner an
# effect drawn more than once a frame, where any single range leaves the
# other copy showing. Some steps blank an eye or the HUD while set; that
# is the probe working, and it reverts the second the file is saved empty.
#census_skip_range =

# Millimetres the headset must move in ONE frame before the pose history
# flags it. The history exists to tell a tracking glitch from a game glitch;
# EDVR cannot fix tracking and does not try.
#pose_step_note_mm = 50

# Hold the last good frame this many frames on the external-camera key.
# Ships at 0. Under the old mechanism this could not work -- withholding
# stalled the game and Elite postponed the transition past any hold. 0.7.0's
# replacement submits copies instead of stalling, which changes that premise;
# whether a hold now covers the transition is unmeasured. History in
# docs/transition-flash.md.
#hold_frames_on_external_cam = 0

# Record what the game asks about your headset's projection -- per-eye
# tangents, target sizes, call rates. A handful of log lines per session,
# nothing changed; the cull guard below needs it on, and its lines are what
# a terrain report wants attached. 0 turns it off.
#observe_projection = 1

[fix]
# The cull guard, for frontier issue 72609: black squares of missing planet
# terrain at the edges of view. Elite culls terrain against a narrower
# frustum than it renders; the guard tells the game your headset shows a
# little more than it does, renders that margin in new pixels (nothing gets
# softer), and hands the runtime only the region your lenses really show --
# so the missing tiles are drawn. Costs GPU time in proportion to the
# margin. Details and measurements: docs/terrain-culling.md.
#
#   off        nothing (the default)
#   symmetric  widen each axis to +/- its larger tangent, trimmed by the
#              fraction keys below. The shape the measurements support.
#   percent    widen every tangent by cull_guard_percent. Diagnostic.
#
# Turning it ON needs a restart; every other cull_guard key is live (save
# the file mid-flight). If the log says "cull guard INERT", this runtime
# shapes its projections in a way the guard refuses to edit -- the game
# runs normally, and the log is worth reporting.
#cull_guard = off

# How much of each axis's shortfall symmetric mode covers, 0 to 1. Left
# commented, both are 1.0: full coverage, guaranteed wherever the fix works
# at all, and the most expensive (~48% more rendered pixels on a Quest 3).
# The values below are what tested clean on a Quest 3 -- edges intact at
# about 6% more pixels. Uncomment to start there; if black squares persist
# on your headset, raise _h in steps (it is live), and the log's "cull
# guard margins" line names what each step leaves uncovered.
#cull_guard_fraction_h = 0.25
#cull_guard_fraction_v = 0

# Run the guard only for these headsets: comma-separated FOV signatures,
# exactly as the log prints yours ("this headset's signature is 94x99").
# Left empty it runs on every headset. On a rig that swaps headsets, list
# only the one that shows the missing terrain -- the other pays nothing,
# with no ini edits at swap time.
#cull_guard_headsets =

# Percent mode's margin, in percent of every tangent. A diagnostic knob:
# raise it to prove a shortfall exists, then run symmetric day to day.
#cull_guard_percent = 8.0

[advanced]
# How the guard hands the image back: "copy" (one GPU region-copy per eye;
# works on every runtime measured) or "bounds" (free and correct by the
# OpenVR contract, but ignored by OpenComposite in the field). Only worth
# trying on real SteamVR, to measure whether the free path works there.
#cull_guard_submit = copy

# --- Where the viewpoint lives in the game's memory: buffer size and the
# --- position of the first coordinate. Build-specific; if an update moves
# --- it, EDVR notices the data stops behaving like a viewpoint and says so.
#camera_buffer_bytes = 5376
#camera_buffer_offset = 1100

# Which number in the screen's position data is its distance. Only change if
# panel_distance stops working after a game update.
#panel_distance_index = 47

# --- Escape hatches a support conversation would reach for.

# Install the render hooks even with both panel fixes off (the flash fix
# reads the camera through them).
#panel_hooks_always = 1

# Vtable slots of the SteamVR compositor's Submit and WaitGetPoses, should a
# future SteamVR move them. Must differ; refused if they do not.
#submit_index = 5
#waitgetposes_index = 2

# Ignore the crash sentinel for one launch.
#ignore_sentinel = 0

# ============================================================================
# EXPLORER CAM -- stereoscopic depth on foot, via the external camera
# ============================================================================
#
# On foot, Elite renders first person to a flat panel: one image for both
# eyes, which is why walking around does not feel like VR. The external
# camera renders in real stereo. This moves your viewpoint to your
# commander's head while you are in that camera, giving you stereoscopic
# depth on foot.
#
# It gives you no capability you do not already have: the camera is Elite's
# own, opened with your own binding, and you still cannot shoot, scan or
# interact from it. It is a client-side view change -- nothing your ship,
# your commander, the server or another player can see. It reads ONE thing
# from the game: which camera view is showing (see [d3d11] below).
#
# SETTING IT UP
#   1. Nothing to bind: EDVR reads your camera keys from your Elite key
#      configuration (see read_game_bindings under [hotkey]).
#   2. Enter the camera on foot and cycle to COMMANDER RIGHT SHOULDER --
#      it is not the view the camera opens on.
#   3. Tune the three [openvr] offsets with the headset on; they reload
#      about once a second.
#
# COMFORT: these values move a headset you are wearing. Change them a little
# at a time. Limit +/-10 m per axis, clamped.

[fix]
# The master switch for everything in this block.
head_offset_gate = 1

# Which camera view the offset applies to. 2 is COMMANDER RIGHT SHOULDER:
# close to the head, already facing forward, so the offsets below stay small.
# That view is replaced while you are on it -- cycle to it for the 3D view,
# off it for the normal framing. Every other view is untouched. -1 = any
# view, including the portrait one that faces backwards; not recommended.
head_offset_view = 2

# Keep the offset on when the view briefly cannot be read from the game
# (near a planet it rebuilds its camera records every ten to thirty
# seconds). The last confirmed view is held until a read confirms or
# corrects it. The hold lives WITHIN an on-foot session: boarding a ship or
# SRV starts a new one, where the game resets its camera view to 0 and EDVR
# restarts its count from 0 with it -- cycle to your view as usual and the
# count follows each press of your next-view key. 0 = strict: the offset
# drops the moment the view cannot be confirmed.
head_offset_view_bridge = 1

# How many views the camera cycles through (used only when counting), how
# long a keypress gets to take effect, and how recently the on-foot screen
# must have stopped for a press to count as entering the camera.
#
# The last two are MILLISECONDS and were frames until 0.7.3. They were
# renamed rather than reinterpreted: Elite in VR runs at 72, 90 or 120Hz,
# so a frame count meant a different length of time on every headset, and
# silently reading an old value of 60 as 60 ms would have given a twentieth
# of the window that was asked for. If you had either of the old keys set,
# multiply by about 11 to get the same behaviour at 90Hz.
#head_offset_view_count = 6
#head_offset_intent_grace_ms = 2000
#head_offset_enter_window_ms = 670

[hotkey]
# THE CAMERA KEYS ARE NOT HERE, on purpose. EDVR reads your external-camera
# and next-view keys straight from your Elite key configuration
# (Options\Bindings) -- the ON-FOOT camera binding, which is the one
# Explorer Cam lives in, from the file the game actually maintains. Rebind
# or switch preset in Elite, even mid-session, and EDVR follows within
# about ten seconds; the log names each key it adopts and the file it came
# from. EDVR only WATCHES these keys -- it never presses or interferes
# with them. If your camera is bound only to a controller, bind a keyboard
# key for it in Elite (Options > Controls) for now: EDVR watches the
# keyboard, and controller support is planned. 0 turns the reading off,
# which leaves Explorer Cam with no keys at all.
read_game_bindings = 1


[openvr]
# Where your viewpoint goes, in metres, relative to where the camera view
# starts. Positive right / up / forward in your commander's frame; it turns
# with them, so one setting is right at every heading. These defaults are
# tuned for COMMANDER RIGHT SHOULDER: forward to the head, up a little,
# and LEFT (negative right) off the shoulder onto the centre line. A view
# further back needs a larger forward value.
head_offset_right = -0.25
head_offset_up = 0.25
head_offset_forward = 1.25

# Turn the viewpoint, in degrees, about the up axis. 0 is almost always
# right: 180 makes the backwards portrait view face forward but the game
# still culls for the original direction, so the scene falls apart. Pick a
# forward-facing view with head_offset_view instead.
head_yaw_degrees = 0.0

# Apply the offset only in the on-foot external camera (0 = everywhere,
# including your cockpit -- disorienting); also offset the game's simulation
# poses, not just the rendered ones; and how many frames the mode signal
# from d3d11.dll stays trusted after it stops arriving.
#head_offset_external_only = 1
#head_offset_game_poses = 1
#head_offset_max_stale_frames = 90

[d3d11]
# Read which camera view is showing from the game's own memory -- what makes
# head_offset_view work without binding and counting keys. READ ONLY and
# narrow: one small integer, no game code touched, nothing else kept.
# Nothing here can see your position, cargo, credits or missions. Off, the
# offset never engages, because nothing else can say which view you are on.
camera_index_track = 1

# Read the game's own journal (the documented file Elite writes for
# third-party tools, in Saved Games) for the boundaries it states outright:
# gameplay starting, you disembarking onto your feet, and jumps beginning
# and resolving (StartJump / FSDJump / SupercruiseEntry -- what scopes the
# witchspace star fix to actual jump tunnels). EDVR uses them to ignore
# camera keys pressed in menus, to restart its view count where the game
# resets its camera view, and to keep the star fix out of ordinary space.
# Event NAMES only -- no other content is read or kept. 0 turns it off;
# everything then falls back to heuristics, and the witchspace star fix
# stays off entirely.
journal_watch = 1

# Where the journal lives, if your Saved Games folder was moved. Empty means
# the standard place.
journal_dir =

# Where in the game's executable the camera-records marker sits. Moves when
# the game updates: EDVR then finds nothing, says so, and does not guess.
# Set the new value here without waiting for a new build if you know it.
#camera_index_type_offset = 0x4D71C50

# The record layout: which record holds the view, where in the record, the
# largest believable view value, and how much memory the one-time search
# reads per frame (MB).
#camera_index_ordinal = 11
#camera_index_value_offset = 16
#camera_index_plausible_max = 7
#camera_index_mb_per_frame = 64
