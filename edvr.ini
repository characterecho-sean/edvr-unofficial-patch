# EDVR settings.
#
# This file lives next to EliteDangerous64.exe. Everything here is optional --
# with the file missing entirely you get the defaults below, which are what
# most people want.
#
# Commented-out lines (like "#max_mb = 16") show expert settings at their
# defaults. A normal install never needs them; they are listed so that when
# the log or a support thread names one, you can find it. Uncomment to change.
#
# How each fix works, with measurements, lives in the docs folder
# (docs\*.md) -- this file only tells you what a setting does for you.


# ============================================================================
# [fix] -- the fixes themselves. Everything here is safe to change and most
# take effect within a second of saving.
# ============================================================================
[fix]

# --------------------------------------------------------------------------
# When the eyes disagree
# --------------------------------------------------------------------------

# Stop one eye going darker than the other near bright lights. Elite meters
# brightness per eye, so near a star one eye can dim while the other does
# not. This makes both eyes share one brightness. 1 on, 0 off. Read at
# startup, so a change here needs a game restart; the Scroll Lock hotkey
# toggles it during a session.
# ui: Both eyes share one brightness | menu
share_exposure = 1

# Make both eyes show the same Full System Scanner image. Stock, the
# scanner's zoomed body can disagree between the eyes -- hard-black
# not-yet-resolved tiles in one eye that the other has already filled
# (a stock game bug, reproduced clean; docs/fss-scanner.md and the
# vendor report in docs/frontier-fss-bug-report.md). One key, two
# mechanisms underneath: for a few seconds after each zoom press
# (journal-gated) the left eye's hard-black pixels are filled from the
# right eye's image at your headset's own optical-infinity disparity,
# only inside the scanner screen's measured rectangle, never touching
# the neon wireframe; and the body composite's second eye draws from
# byte-identical copies of the first eye's inputs, so the resolve
# animation cannot split by construction. The squares you still see are
# the game's own scan art, now in both eyes, fused. Needs the
# openvr_api.dll half installed; every stand-down says so in the log.
#
# on | off. Developer values, one mechanism each: heal (the arrival
# fill), mirror (stamp the left's blacks into the right instead), sync
# (the composite input freeze), steady (the constants snapshot). Live.
# moved-from: fix.fss_reveal_sync
# moved-from: experimental.fss_eye_heal
# moved-from: fix.fss_eye_heal
# ui: FSS eye sync | choices on, off | menu
fss_eye_sync = on

# Make the scanned body render in both eyes. Stock, on some machines, the
# planet in the surface scanner (DSS) and the system scanner (FSS) turns
# into a featureless black disc in one eye -- a stock game bug that
# predates EDVR (field-traced and field-VERIFIED 2026-09-01; the write-up
# is docs/scanner-body.md). The game issues the second eye's lighting draw
# with one of its inputs missing, so that eye's lighting lands nowhere
# and the body keeps only its silhouette. This lends the draw the input
# the first eye's just used -- the game uses one and the same for both
# eyes when healthy -- for that single draw, put back exactly as found.
# On a machine without the bug it never engages and costs one state read
# on a handful of draws.
#
# on | off. Live.
# ui: Scanned body in both eyes | choices on, off | menu
scanner_body = on

# --------------------------------------------------------------------------
# Night vision
# --------------------------------------------------------------------------

# Keep the night-vision pulse line at a stable distance when turning your
# head. Preserves the game's terrain shading, texture outlines and brightness.
# Works with AA Off, TAA or DLSS, independently of the experimental Realistic
# nightvision appearance. Turn off to compare the original pulse. Live.
# ui: Night vision pulse stability | menu
night_vision_stability = 1

# --------------------------------------------------------------------------
# The on-foot screen
# --------------------------------------------------------------------------

# Keep weapons, tools and their attached parts steady while moving and
# turning on foot. While the game says you are on foot, EDVR moves the
# game's wait for the next frame from its pose fetch to its eye submit, so
# the arms are drawn for the pose they are shown at; in a ship nothing
# changes. Also tracks the weapon's animated geometry for temporal AA,
# including aiming and sway, so walking/crouching does not drag scenery
# history through it. Costs about a frame of latency on foot and keeps
# SteamVR motion smoothing / Oculus ASW from engaging there. Works with AA
# Off, TAA or DLSS. Needs the journal watcher (d3d11.journal_watch, on by
# default). Turn off to compare with the game's original movement. Live.
# ui: Weapon stability | menu
weapon_stability = 1

# Make the space around the on-foot screen pure black instead of glowing
# grey. On an OLED headset the difference is stark. 1 on, 0 off. No effect
# in ships. Live.
# ui: Black surround for the on-foot screen | menu
black_void = 1

# Make the on-foot screen (and HMD Cinema Mode) sharper. Elite renders that
# screen at 1920x1080 regardless of your headset, which is why text on foot
# looks soft. "auto" (the default) sizes it itself, from the width your
# headset actually rendered per eye last session, by one of two rules (the
# log's "vScreen resolution:" line says which one ran, and why):
#
#   fitted   when the VR on-foot world route will run (it needs
#            experimental.temporal_aa_on_foot_world set to auto, the UI
#            layer on, and EDVR's own OpenXR runtime; a curved screen,
#            fix.panel_curvature, does not stop it): about 70% of the
#            width the screen has in your eyes head-on at your
#            fix.panel_distance, which is about 1.4 eye pixels per texel
#            of the screen. EDVR measures that width at the middle of the
#            screen while you are on foot and remembers its head-on floor
#            (the lowest tenth of the readings, so a turned head does not
#            inflate it) for the next launch. The route anti-aliases the
#            world at that size, so more pixels than the eye can show only
#            cost frame time. Never under 2880, never over the legacy
#            width. A bent screen's edges come nearer than its middle, so
#            on a near screen they are enlarged more than the middle is;
#            if they look softer than the middle, type a width.
#   legacy   otherwise: 125% of the width your headset rendered per eye,
#            rounded to a clean 16:9 pair. With nothing anti-aliasing the
#            on-foot world before it reaches the screen, the extra width
#            does that job.
#
# A sharper VR render resolution or a changed panel_distance brings either
# one along, one restart later, with nothing to set. Type a width in pixels
# instead to pick your own, used exactly; the height always follows it at
# 16:9 and is not a separate setting any more. 16:9 widths that were the
# useful ones under the old pair:
#
#   2880 wide   just over twice the stock detail
#   3840 wide   four times, a clear improvement
#   5120 wide   seven times, if you have the headroom
#
# Costs GPU memory and time in proportion; if your frame rate drops below
# your headset's refresh, step down -- judder is worse than soft text.
# Unlike everything else here, this changes values in the game's memory
# while it runs (never any file on disk). Needs a game restart; typing the
# stock 1920 turns it off, same as before, and "auto" has nothing to go on
# until one session with VR running has completed. The first fitted launch
# starts from a calibration (3504 wide at panel_distance 0.7 on a 4032 wide
# eye, where the screen spans about 5000 px head-on); the measurement
# replaces it after one session on foot.
# ui: On-foot screen resolution: width | range 640..8192 | menu
vscreen_res_width = auto

# How far away the on-foot screen sits. 1.0 is Elite's own distance; 0.5 is
# noticeably close, 2.0 far. Pairs well with panel_curvature: 0.7 with a
# 0.3 curve is a comfortable on-foot starting point. Live.
# ui: On-foot screen distance | recommended 0.7 | range 0.5..2.0 | menu
panel_distance = 1.0

# Bend the on-foot screen (and HMD Cinema Mode) toward you, the way Virtual
# Desktop curves its virtual screen (docs\screen-curvature.md). The number
# is the fraction of a full circle the screen wraps around you: 0 is flat
# and off, 0.1 a gentle theatre curve, 0.3 a comfortable wrap. The screen
# keeps its width, so the edges come nearer rather than the middle moving
# away. Try 0.3 here with panel_distance 0.7 on foot. The VR on-foot world
# route (experimental.temporal_aa_on_foot_world, auto by default) draws the
# curved screen through this same curve, so it runs with the bend on. The
# intro movie (fix.intro_video = screen) and the splash screen follow the same
# curve. Live, and composes with panel_distance.
# ui: Screen curve (on foot, intro, splash) | recommended 0.3 | range 0..1 | percent | menu
panel_curvature = 0.0

# --------------------------------------------------------------------------
# The intro
# --------------------------------------------------------------------------

# The launch movie, played properly. Elite draws it on a small head-locked
# rectangle -- 1024x576 pixels, about 27 degrees wide, pinned to your face
# (docs\intro-video.md). "screen" (the default) plays it on the splash's
# own virtual screen instead: world-anchored on the game's forward, sized
# to what the splash after it covers, so the cut between them just works
# -- and resampled first with AMD's FSR so the magnification does not read
# as pixelation. HOW SHARP it can get is your on-foot screen resolution:
# the movie is upscaled to vscreen_res_width above, the same question
# about the same GPU, asked once. "stock" leaves the game alone. The
# world anchor needs openvr_api.dll installed; without it the movie stays
# head-locked and the log says so. "skip" does not play the movie at all:
# when the game goes to open the ident file (Movies\Ident_*.webm), EDVR
# answers that it is not there -- the same answer renaming the file gives,
# which is how people have always skipped it -- and nothing on disk is
# touched, so nothing has to be put back. The game then goes straight to
# the splash. The log says whether it took; if the movie plays anyway,
# it plays as "screen", and the log says why (docs\intro-video.md). skip is
# decided at launch, the only time the movie exists; screen and stock are
# live, though the movie is only there for the first half-minute of a
# session.
# moved-from: fix.intro_video_size (default stock)
# moved-from: fix.intro_video_lock (default head)
# moved-from: fix.intro_video_upscale (default stock)
# ui: Intro movie | choices screen, stock, skip | live | menu
intro_video = screen

# The backdrop behind the intro and the menu. That picture is stored in an
# old compressed format and is very dark, so its gradients come out
# stepped -- magnified across a headset's field of view the steps read as
# blocks and patches (docs\menu-backdrop.md). "splash" (the default)
# keeps the NICER of the two pictures the game already loaded -- the big
# splash it shows first and normally throws away seconds later -- and
# smooths the banding out of it once, when it first draws. It is the
# game's own art either way; nothing is added to your install. "stock"
# leaves the game alone. Live.
# moved-from: fix.menu_backdrop (default stock)
# ui: Intro background picture | choices splash, stock | menu
intro_backdrop = splash

# Where the loading dialogs' dimming happens. While a loading dialog is
# up the game dims your ENTIRE view -- a frosted wash plus a full-view
# tint -- which is ordinary on a monitor and oppressive in a headset,
# covering artwork far beyond the dialog's edges
# (docs\loading-panel-handoff.md). "screen" (the default) moves that
# dimming where it belongs: the wash and the full-view tint go, and the
# splash screen itself steps back by the same tint instead, exactly while
# a dialog is up. The dialog's box, border and text are the game's own,
# untouched. The intro only -- this retires for the session the moment a
# rendered scene arrives. "stock" leaves the game alone. Live.
# moved-from: fix.loading_panel (default stock)
# moved-from: fix.loading_splash_dim (default on)
# ui: Loading screen dimming | choices screen, stock | menu
loading_dim = screen

# --------------------------------------------------------------------------
# Jumps, stars and smoke
# --------------------------------------------------------------------------

# Stop the one-frame flash of a wrong viewpoint when you jump, drop out of
# supercruise, or close the galaxy map. The bad frame is caught and the
# previous good one is shown in its place. NEEDS openvr_api.dll INSTALLED
# TOO (see the README). 1 on, 0 off. Needs a game restart.
# ui: Stop the one-frame flash on jumps | menu
transition_flash = 1

# Stop the sun's glare riding your head (docs\sun-glare.md). The game draws
# a star's whole glare -- corona, smudge, beams, rays, lens flare -- flat on
# your view like a camera overlay: it rolls when you roll and the beams stay
# pinned to your face. The star's own disc is separate and never touched.
#
#   realistic  the glow a real eye would see: corona and smudge anchored in
#              the world, steady under every head motion, identical in both
#              eyes. Camera artifacts (beams, rays, lens flare) removed.
#   vivid      everything drawn: corona, smudge and beams locked to the
#              world, the lens flare keeping its slide across your view --
#              the movie-camera look without the head coupling.
#   stock      leave the game alone.
#
# vivid is the default. Live -- swap modes mid-flight and compare.
# ui: Sun glare | choices vivid, realistic, stock | menu
sun_glare = vivid

# Stop smoke and steam plumes swimming as you look around
# (docs\particle-billboards.md). The game builds each particle's quad
# against the camera's own up vector, so tilting your head -- or swinging
# the camera on foot -- rolls every puff of smoke with you. "steady"
# builds them against world up instead: they still turn to face you, but
# a rising plume stays upright in the world. Geysers are where this shows
# most. "steady" is the default; "stock" leaves the game alone. Live.
# ui: Smoke and steam plumes | choices steady, stock | menu
particle_billboard = steady

# Whether the hyperspace tunnel keeps its starfield. "on" is the game's own
# behaviour and the default; "off" leaves the tunnel empty, so a jump is
# the swirling walls and nothing streaking past inside them.
#
# This exists because 0.12.3 emptied that tunnel by accident -- a fix aimed
# at solar flares was pointed at the starfield's shader by mistake -- and a
# player who saw it asked to keep it. It is done properly here: the draw is
# withheld, not corrupted, so nothing else about the jump changes.
#
# Off costs nothing when on: one comparison per particle draw. Live.
# ui: Hyperspace tunnel starfield | choices on, off | menu
witchspace_stars = on

# --------------------------------------------------------------------------
# The helmet and the loading screen
# --------------------------------------------------------------------------

# Put the RemLok emergency helmet's edge lines at your temples instead of
# along your nose (Frontier issue 69074; docs\remlok-lines.md).
#
#   outer   each eye keeps only the line on its own outward side -- what a
#           real helmet looks like (the default)
#   hide    no lines at all
#   stock   leave the game alone
#
# Live.
# ui: RemLok helmet lines | choices outer, hide, stock | menu
remlok_lines = outer

# Where each eye's helmet line sits, in degrees from straight ahead, correct
# on any headset. 20..60; the default was tuned by eye on two very different
# headsets and both agreed. 0 turns the placement off. Live.
# ui: RemLok line angle | range 0..60 | menu
remlok_line_angle = 46

# Hold the loading screen's ship hologram still. In a headset its scan
# pattern rides your head -- a nauseating shimmer inside the hull
# (docs\loading-hologram.md). "steady" (the default) calms it; "stock"
# leaves the game alone. Live.
# ui: Loading screen hologram | choices steady, stock | menu
holo_pattern = steady

# --------------------------------------------------------------------------
# The terrain fix
# --------------------------------------------------------------------------

# Fill in the black squares of missing planet terrain at the edges of view
# (Frontier issue 72609; docs\terrain-culling.md). Costs GPU time in
# proportion to the margin below.
#
#   off        nothing (the default)
#   symmetric  the measured shape of the problem, trimmed by the fraction
#              keys below
#   percent    a blunt margin on every edge, for diagnosis (commented)
#
# Needs openvr_api.dll installed. Live, like every other cull_guard key:
# turning it on takes effect at the next frame boundary.
# ui: Fill terrain gaps at view edges | choices off, symmetric | menu
cull_guard = off

# How much of the shortfall to cover, 0..1 per axis. Commented, both are
# 1.0: full coverage, most expensive. The values below tested clean on a
# Quest 3 at about 6% extra pixels; if black squares persist on your
# headset, raise _h in steps (live).
#cull_guard_fraction_h = 0.25
#cull_guard_fraction_v = 0

# Run the guard only for these headsets: comma-separated FOV signatures,
# exactly as the log prints yours ("this headset's signature is 94x99").
# Empty runs everywhere. Useful on a rig that swaps headsets.
#cull_guard_headsets =

# Percent mode's margin, in percent of every edge. Diagnostic.
#cull_guard_percent = 8.0

# --------------------------------------------------------------------------
# Anti-aliasing
# --------------------------------------------------------------------------

# Calm the shimmer with a temporal filter, which Elite lacks. Each frame is
# blended with the frames before it, each one moved to where its content
# sits now, so anything that flickers on and off the pixel grid as you move
# -- station girders, hull seams, the HUD's fine lines, distant ships --
# settles to a steady value, and the projection is nudged by a sub-pixel
# amount every frame so the average converges to a real supersample even
# with your head held still (docs\anti-aliasing.md, Feature B).
#
# TAA runs EDVR's own history. DLSS hands the same inputs to NVIDIA's
# trained one, which holds text steadier under motion and is the one to
# use on an RTX card.
#
# DLSS IS DLAA WHEN YOU ARE NOT RENDERING SMALL. With Elite's HMD Quality
# at 1.0 or above there is nothing to upscale, so NVIDIA's pass runs at
# your full render size and what you get is DLAA: the same trained
# history, no resolution given up, no frame time bought back. Below 1.0
# the game renders smaller and NVIDIA brings it back to size, which is
# where the frame time comes from -- and that, not the anti-aliasing, is
# the difference between the two names.
#
# DLSS needs NVIDIA's runtime (nvngx_dlss.dll) beside the game, which the
# installer places on a machine with an NVIDIA card. Without an RTX card
# or the runtime it says so in the log and runs TAA instead.
#
# The trade every temporal filter makes: calmer, and a little softer, than
# the hard aliased edges of text without it, and sub-pixel detail such as
# stars shows at its true fraction of a pixel. Set Elite's own
# anti-aliasing to Off or SMAA with this on. Live: switching between the
# modes, or turning it on, takes effect at the next frame, and the tuning
# keys under [experimental] are live too.
#
# "dlaa" is still accepted in this file, for pinning NVIDIA's pass to 1:1
# so that an HMD Quality below 1.0 stays small rather than being upscaled.
# It is not offered as a choice because it is the same picture as DLSS
# whenever HMD Quality is 1.0 or more, and worse below it.
#
# fsr is AMD's upscaler -- a community Direct3D 11 port of FidelityFX Super
# Resolution 3.1 -- at the same sizes dlss would use. It runs on any GPU,
# NVIDIA's included, and needs no extra runtime file beside the game (dlss
# needs nvngx_dlss.dll; fsr does not).
#
# Moving ships, vehicles and settlement parts take their exact motion from
# Elite's own records -- where the game had each one last frame and where
# it has it now -- on exactly the pixels the game drew it on, in every mode.
# An object EDVR cannot follow gets no history rather than a guess, and
# everything else keeps the camera's motion. Settlements and the ships
# landing at them are covered; stations and ships in space are not yet
# verified. If Elite's records cannot be read, that part stands down and
# the log says so; the log's "engine motion:" lines say what it covered.
#
# On the flat profile the sub-pixel jitter every mode needs is applied through
# the game's own camera, so every draw takes it without EDVR listing shaders.
# Where that cannot be done -- a camera it cannot certify, a game update that
# moved the code it hooks, repeated failed writes -- EDVR falls back to
# patching projection rows at draw time, and the log's "flat camera inject"
# lines say which route each frame took. There is no setting for it; with
# Anti-aliasing off none of this runs and none of those lines are written.
# moved-from: experimental.temporal_aa
# ui: Anti-aliasing | choices off, on=TAA, dlss=DLSS, fsr=FSR 3.1 | live | menu performance
temporal_aa = off

# NVIDIA reconstruction model, used by DLSS and DLAA. K is the default.
# J, L and M are available for comparison; Automatic lets the runtime choose.
# A change rebuilds NVIDIA history. Live.
# moved-from: advanced.temporal_aa_model
# ui: DLSS preset | choices k=K, j=J, l=L, m=M, auto=Automatic | live | menu performance
temporal_aa_model = k

# Every temporal mode includes UI and smoke depth, adaptive UI history,
# and the exact motion of what moves from Elite's own records. These are
# required inputs, enabled and disabled with temporal_aa. Separate
# ui_depth, temporal_aa_objects and temporal_aa_smoke switches are retired.
# Developer overrides remain under [advanced]; depth-disagreement rejection
# is experimental and stays off.

# --------------------------------------------------------------------------
# Explorer Cam
# --------------------------------------------------------------------------

# Explorer Cam: put the view in your commander's head, facing their way, and
# lock it to them. On foot the game renders one flat image for both eyes; its
# free camera renders real stereo, so this makes the free camera a first-person
# view you can walk and turn in. It is armed exactly when hotkey.explorer_cam
# (in [hotkey], below) is set, and that key is the only way in: pressed on foot,
# or in the game's camera on any preset or in its free
# camera, it opens the camera for you if it is closed, switches to the free
# camera, places it at your head, presses the camera's own "lock relative to
# the commander" and hides the camera's on-screen controls; pressed again it
# gives them back and closes the camera. The game's own camera key and TAB
# place nothing, and while the view is placed the camera's own keys are
# blocked. Your commander's head is hidden from inside. The view fades to
# black while it opens, closes or re-attaches, and back in once it is placed
# and steady (never longer than 3 s; no setting). It is a client-side view
# change made with the game's own camera, using only the actions you could
# press by hand, and it stops the camera's collision and its push out of the
# commander's body from lifting the view onto your helmet. You still cannot
# shoot, scan or interact from it, and nothing the server or another player
# sees changes. Only Elite build 332841 is supported: on any other build it
# leaves the game untouched and the log says so. Live between sessions: a key
# changed or cleared while a session is on is held back, the old key stays the
# exit, and the new value (empty = off) applies when the session ends.

# The view follows your commander's head joint, so it rises and falls as they
# crouch or raise a weapon. Where the head joint cannot be read (the log says
# why) the view sits at a fixed eye instead, in metres in your commander's
# frame from their feet: up (eye height), forward (the way they face) and
# right. These three are FALLBACK ONLY and change nothing while the head
# joint serves; to move the head-joint eye use the trims below (the F8 menu's
# Explorer Cam page). They are not on the menu: edit this file. They reload
# about once a second. Up is held to 0.5..2.5 and forward and right to
# -0.5..0.5.
# ui: hidden -- fallback only, tuned with the headset on by editing this file | range 0.5..2.5 | recommended 1.68
explorer_cam_eye_up = 1.68
# ui: hidden -- fallback only, tuned with the headset on by editing this file | range -0.5..0.5 | recommended 0.10
explorer_cam_eye_forward = 0.10
# ui: hidden -- fallback only, tuned with the headset on by editing this file | range -0.5..0.5 | recommended 0.0
explorer_cam_eye_right = 0.0

# Where the view sits in your commander's head is YOUR preference, and these
# four settings are how you tune it: the F8 menu's Explorer Cam page changes
# each one live, in the headset, while you look through them (also during a
# session). They ship with the values they were flown with. Each trim is a
# nudge added to the head-joint eye, in metres along your commander's own axes,
# held to -0.5..0.5; 0 on all three is the head joint itself. They do not apply
# to the fixed fallback eye above.

# Eye height: raises (positive) or lowers the view in your commander's head, in
# metres. Ships at 0.15, which puts the eye at the eyes rather than at the
# middle of the head. Live.
# ui: Eye height | range -0.5..0.5 | step 0.01 | unit m | signed | recommended 0.15 | live | menu explorer_cam
explorer_cam_eye_trim_up = 0.15

# Eye forward: moves the view forward (positive) or back (negative) along the
# way your commander faces, in metres. Ships at -0.08. Live.
# ui: Eye forward | range -0.5..0.5 | step 0.01 | unit m | signed | recommended -0.08 | live | menu explorer_cam
explorer_cam_eye_trim_forward = -0.08

# Eye sideways: moves the view to your commander's right (positive) or left
# (negative), in metres. Ships at 0. Live.
# ui: Eye sideways | range -0.5..0.5 | step 0.01 | unit m | signed | recommended 0.0 | live | menu explorer_cam
explorer_cam_eye_trim_right = 0.0

# Head-follow smoothing: milliseconds of smoothing on the head-joint eye, for
# comfort. 0 (the default) follows the head exactly, which is what you want when
# moving: any lag puts the camera behind the head and shows the neck. The F8
# menu offers 0..200 in steps of 10; this file may say up to 1000. Live.
# ui: Head-follow smoothing | range 0..200 | step 10 | unit ms | zero exact | recommended 0 | live | menu explorer_cam
explorer_cam_follow_smoothing_ms = 0

# --------------------------------------------------------------------------
# Cockpit
# --------------------------------------------------------------------------

# Hold off the marker that flashes under the speed readout when a high wake
# is selected. stock is the game's own; off removes it.
#
# It pulses in time with the target indicator's blue flash because both are
# drawn into the same cockpit holo panel. Inside that panel it is one draw of
# the GUI's textureless vector shader, and it is present only on the frames
# the flash is ON -- measured 0 of 3 frames with no wake, 1 of 3 and 2 of 3
# with one. Dropping that draw removes the flash and leaves the rest of the
# panel untouched. Live.
# moved-from: experimental.wake_pulse
# ui: High-wake marker flashing | choices off, stock | menu
wake_pulse = off

# The game's interface drawn as sharp as it would be at HMD Quality 1.0
# (100) or 1.25 (125), whatever HMD Quality the scene runs at. Today the
# game draws its interface at the scene's size: at HMD Quality 0.65 the
# cockpit's panels are drawn at 0.65 of their size, and a main menu the
# resolution fix renders at 3840x2160 is squeezed into a 0.65-size eye and
# stretched back up by the upscaler, which is told not to accumulate it.
# One setting, two parts:
#   - the cockpit's panels (the vector lines, text and icons of the side
#     panels, the target panel and the rest) are made at the size they would
#     have at the chosen HMD Quality -- the scene itself is left alone;
#   - the menus (the main menu included), modals, station services'
#     panels, the loading screen and the 2D screen are drawn into a separate
#     layer at the size the upscaler hands out (100) or a quarter larger
#     (125, smoothed down), with no jitter, and laid over the finished
#     picture after the upscale and after render_sharpness -- so their text
#     is never upscaled, sharpened, smeared or ghosted. On foot, and in a 3D
#     map, the 2D screen shows the world and stays in the picture, the
#     helmet HUD with it: the screen's own busy depth says so within two
#     frames, the game's Status.json says on foot a second or so later, and
#     either one keeps it. This part needs fix.temporal_aa on.
# Also layered: the cockpit's holo panels, the flight HUD, the target
#     sprites, eight admitted radar icon/contact hologram families and the
#     target hologram's sphere (its two known pixel shaders only, with the
#     game's read of the scene depth remapped to the layer's size; a draw
#     whose depth cannot be remapped stays in the scene) -- the game draws
#     them into the
#     lit scene before its tonemap, at the scene's size, so at HMD Quality
#     0.65 they are upscaled with the world. Here each is drawn into a
#     per-eye HDR layer at the layer's size, unjittered and tested against
#     the scene's own depth as before, and at the game's own tonemap draw --
#     its exposure, colour LUT and constants untouched -- the layer is
#     tonemapped over the finished eye: as sharp as at HMD Quality 1.0
#     whatever the scene runs at, out of the upscaler's history so they
#     cannot smear or ghost. They lose the bloom halo the upscaled
#     frame gave them (measured: a few dozen pixels a frame where
#     translucent glass crosses a bright background).
# Not layered: the sun/radar corona (one shader pair paints both the radar
# icon's glow and the real sun) and the world reticle keep their existing
# depth treatment, as does any target-sphere shader other than the two known
# ones; their shader/resource safety at the layer's size is not proven. The
# glass canopy also stays in the scene -- it sits
# in front of the whole sky, and covering it would smear the stars behind it.
# These stay in the picture the upscaler
# reconstructs, steadied by the interface depth and the
# reactive mask.
#   off -- the interface is drawn as the game always drew it.
#   100 -- the default: as at HMD Quality 1.0 (100%).
#   125 -- as at HMD Quality 1.25 (125%): finer edges, more memory.
# (1.0 and 1.25, the first spellings, are read as 100 and 125 for this
# release, with a note in the log.) At or above your HMD Quality the panels
# are already that size and are left as they are. The price: the panels
# cost what they would at that HMD Quality; per eye, the layer (37 MB at
# 3070x3032 and 100, 58 MB at 125),
# one copy of the finished eye to lay it over, one more of the layer's size
# once the loading screen has shown, and one full-eye pass after the
# sharpening (the log times every step and names what is allocated, every
# 30 s); and once a menu draw tests the game's depth
# or stencil, a depth-stencil target of the layer's size (75 MB at 100, 116
# MB at 125 on 3070x3032; 232 MB at 125 on a 4340-wide eye) plus a copy
# of the game's own (31 MB at 1995x1970). For the cockpit HUD (the holo
# panels, the flight HUD, the target markers and the holograms) add, per eye,
# the HDR layer (R16G16B16A16_FLOAT: 128 MB at a 4074x3938 door, 50 MB at a
# Quest 3's 2564x2460), its depth-stencil target once a HUD draw tests depth
# or stencil
# (the same again), and one tonemap re-issue plus one alpha pass an eye a
# frame; the HUD shades about four times the pixels at twice the size per
# axis. What the game draws into the
# same eye after the layered interface (the mouse cursor, overlay effects)
# is taken into the layer too, after the UI, so it stays over it. Two kinds
# still land under the UI: a post pass (it samples an image the eye's own
# size, such as the frame) and a draw the layer declines or refuses. A draw
# that only reads the eye no longer sees the UI in what it reads. The log
# names each such draw. The log's "ui quality" lines say
# what size the panels are made at, what was taken into the layer, what was
# left and why, every 30 s. The panels are sized inside the game's own panel
# code, checked against this game build: after a game update that changes
# that code they stay at the game's own size until EDVR is updated for it,
# and the log says so.
# The orbit lines the game draws in supercruise are scene geometry, but drawn
# a fixed number of pixels wide at the render size they look heavy beside
# panels made at this size. While the panels are scaled they are drawn at the
# same fraction of the game's width (half as wide at 100 with HMD Quality 0.50,
# 0.4 of it at 125), by the game's own line shader with its half-width
# scaled; at or above your HMD Quality they are as the game draws them. The
# log's "orbit lines" lines say which. Where the layer is wider than the game's
# render, the orbit lines, the faint vertical bars of the supercruise display
# and the space dust are drawn into the layer as well, at its own size, so DLSS
# no longer upscales them; the log's "orbit lines", "supercruise bars" and
# "space dust" lines say how many.
# Live: off takes effect at the next frame; a cockpit panel follows the
# next time the game lays it out -- at once in a session's first cockpit, a
# trip through the main menu for one already open.
# ui: UI quality | choices off, 100=100%, 125=125% | live | menu performance
ui_quality = 100

# Per-headset OpenXR render width in pixels per eye, as runtime/system:width
# entries such as oculus/meta-quest-3:3283. Set it from the F8 menu with the
# headset on; the key for the headset you are wearing is printed in the log
# ("openxr resolution: this headset is oculus/meta-quest-3") and is the
# runtime name and headset name lowercased with everything but letters and
# digits turned into "-" -- copy it from the log rather than typing the
# names, which contain slashes. Width is the per-eye width EDVR hands
# Elite; the height follows the headset's recommended shape, and the menu
# shows the resulting size, megapixels and percent of the runtime's
# recommendation. Entries are separated by commas, up to 8:
#
#   oculus/meta-quest-3:3283, steamvr-openxr/pimax-crystal-super:4980
#
# A headset with no entry runs at 100% of what its runtime recommends, and
# a bare number on its own (180, 3283, or the older 1.8) names no headset
# and is ignored, with the log saying what to write instead. An entry with
# only the runtime half (steamvr-openxr:4000) applies to any headset on
# that runtime that has no entry of its own. The width is fixed in pixels:
# changing the headset software's quality preset or streaming app changes
# what 100% would have been, not this, within limits -- it is held between
# a quarter and twice whatever the runtime now recommends, so a very low
# streaming preset caps it at 200% and a very high one floors it at 25%,
# and the runtime's own maximum still caps it. Elite's HMD Quality and
# DLSS still compose with this value. Swapchains are fixed when VR starts,
# so a change applies after a game restart. The Status page's "Eye
# texture" line is what Elite then submits. Megapixels of a size you
# already like: width x height / 1000000. Emptying this value clears every
# headset's entry; the F8 menu's R key clears only the headset you are
# wearing.
# ui: OpenXR resolution | headset | restart | menu performance
openxr_resolution =

# Sharpen the picture with AMD's RCAS, 0 (off) to 1 (strongest). In VR it
# runs as the last thing before the frame leaves for the headset. In the flat
# profile it runs on the temporal pass's output (TAA, DLSS or FSR), just
# before the game's own copy of it: Elite's interface is drawn after that
# copy, so text and HUD are never sharpened. With anti-aliasing off there is
# nothing to sharpen, and the rare frame the temporal pass could not resolve
# (it falls back to a plain spatial one) is left as it is for now.
# The temporal pass trades a little edge contrast for calm; this hands some
# of it back, and 0.3 is a fair start with the temporal pass on. It cannot
# add detail, only contrast at edges, and too much of it rings. It is a taste
# control for the softness of TAA, DLSS and FSR, not a fix for anything: it
# makes fine-line shimmer worse, not better. The setting means the same in
# both profiles, so a flat install seeded from a VR edvr.ini starts with the
# VR value. Live.
# moved-from: experimental.render_sharpness
# ui: Sharpening | range 0..1 | percent | menu performance
render_sharpness = 0.0

# ============================================================================
# [hotkey] -- keys EDVR listens for. Each one is a keyboard key, a gamepad
# button or a HOTAS/joystick button, and the F8 menu's Hotkeys page sets,
# changes and clears all of them for you: select a row, press Enter, press
# the key or button. By hand:
#   keyboard   any single character your keyboard types, written as itself
#              (';' and '#' as SEMICOLON and HASH); names like F1-F24, SPACE,
#              NUMPAD0-9, SCROLLLOCK; combinations with the key last,
#              CTRL+ALT+SPACE (Ctrl, Alt and Shift only). The F8 menu will not
#              capture a key it navigates with, with any modifier: the arrows,
#              Enter, Space, Tab, PageUp/PageDown, Home, End, R and Esc.
#   gamepad    Elite's own name for the button, as in its bindings files:
#              GamePad_Back, GamePad_FaceDown, GamePad_LBumper, GamePad_DPadUp,
#              GamePad_LTrigger ... (an XInput pad).
#   HOTAS      the device and the button, as Elite writes them in its bindings
#              files: the device is eight hex digits, vendor then product, and
#              the button is Joy_N (counted from 1) or a hat direction,
#              231D0200:Joy_12 or 231D0200:Joy_POV1Up (Right, Down, Left).
# An unknown name is refused with a log line. Every key here is WATCHED, never
# captured: the game sees the press as well, so a key or button that Elite also
# uses does both. The Hotkeys page warns when a choice clashes with your own
# bindings; EDVR reads a HOTAS button from the same DirectInput reads the game
# makes and creates no device of its own.
# ============================================================================
[hotkey]

# Summon and dismiss the in-headset settings menu (docs\settings-menu.md):
# a panel anchored where you were looking, driven by the arrow keys or by
# where your head points, that writes this file. The key is PRIVATE to
# EDVR: the game never sees the press that opens the menu, and while the
# menu is up it sees no keyboard at all (menu.keyboard below). F8 is bound
# in none of Elite's thirty stock control schemes; F10 and Alt+F10 are the
# game's screenshot keys and F12 is Steam's, so avoid those. Checked
# against your own bindings at launch and on every rebind: a clash is named
# in the log, and an Elite panel key that is your menu key is not adopted
# by the menu. The menu's own page can change this key but never clear it
# (nothing could open the menu again); empty turns the menu off, from this
# file only. Live.
# ui: Menu key | hotkey | live
menu = F8

# Enter and leave Explorer Cam. This key IS Explorer Cam's switch: empty turns
# Explorer Cam off, because it is the only way in. A change or a clearing made
# while a session is on is held back: the old key stays the exit (the F8 menu
# locks the row too) and the new value applies when the session ends. Watched,
# never captured: the game sees the press as well, and EDVR acts on it only
# while the game has the focus and your journal says you are playing. F5 is
# bound in none of Elite's thirty stock control schemes. It is checked against
# your own bindings at launch and on every rebind: a clash is named in the log,
# and the fix is to rebind one of them. The F8 menu warns about a clash with an
# on-foot binding of yours when you pick a key. Empty turns Explorer Cam off
# altogether: no hooks are installed for it and nothing is written to the game.
# Live between sessions.
# ui: Explorer Cam key (empty = off) | hotkey | live
explorer_cam = F5

# Toggle the brightness fix while playing, to see the difference. Elite uses
# most of the F row; Scroll Lock, Pause and Num Lock are usually free. Live.
# ui: Brightness fix key | hotkey | live
toggle_exposure = SCROLLLOCK

# Write the last ten seconds of viewpoint history to the log. Press it right
# after seeing a flash that got through -- it is what makes a report
# actionable. Writes nothing until pressed; changes nothing about rendering.
# Live.
# ui: Camera history key | hotkey | live
dump_camera = PAUSE

# Developer instrument: log a census of every draw landing in the eye
# textures for a few frames. Costs nothing until pressed. Empty is off; use
# a bare key (NUMLOCK is usually free) -- chords on the Pause cluster can
# reach Windows as a different key. Live.
#
# Flat profile: NumLock (or the configured key) writes a bounded general
# shader/state/routing/refusal report. Shift + the same key requests full
# GPU/pixel/packet capture: slow and large; use only when specifically needed.
#
# Besides draws (DC), copies (DCC/DCS) and dispatches (DCX), a census
# records clears and query brackets (DCL lines, 2026-09-01): every
# ClearRenderTargetView with the colour the game asked for, every
# ClearDepthStencilView with its flags and values, and every query
# Begin/End with the query's type -- the calls that reset a target
# without a draw, and the brackets whose measurements decide draw
# issuance a frame later. The clear's view token is the same token the
# draws print as r= and d=, so the listing reads as one sequence.
# dev: label Draw census key | hotkey
#dump_draws =

# Developer instrument: save an eye run to edvr_logs\eyes\: sixteen
# CONSECUTIVE frames of the left eye's raw render, cropped to 1400 pixels
# about the centre, as eye_HHMMSS_C00.bmp to _C15.bmp (24-bit, 6 MB
# each), and the first frame as the headset receives it -- the temporal
# pass's treated frame, after DLSS -- as eye_HHMMSS_L0.bmp (about 75 MB at
# the DLAA size); one hitch after the sixteenth. What a part does from one
# frame to the next is read off the crops; the same frames' draw LEDGER
# (the pool's records, the instance stream, the bone palette, every eye
# draw) goes to edvr_logs\pool\ for tools\eye_run_ledger.py,
# a second hitch a few frames later. What you see through the lens, readable off the
# desk: for reporting what a debug view (advanced.temporal_aa_debug) shows
# without photographing the lens. The settings menu's Instruments page has
# the same job as a row. Empty is off; use a bare key that Elite does not
# bind (INSERT is usually free -- check your own bindings). Live.
# dev: label Eye dump key | hotkey
#dump_eyes =

# Read the keys you use for Elite's own cockpit panels (up, down, left,
# right, select, back, next and previous panel and page) and for the Full
# System Scanner (enter, quit, zoom), from Elite's key configuration -- so
# the settings menu answers to the keys you already know and names them on
# its panel, and the scanner screen follows your own keys. EDVR only
# watches these keys, never presses them. A panel key that is also one of
# the menu's own (Tab, Enter, Space, the arrows, Home, End, PgUp/PgDn, R,
# Escape) or your menu key keeps its menu meaning. If your panels are bound
# only to a controller, bind a keyboard key too for now. 1 on, 0 off. Live
# for the menu's panel keys; the scanner keys are read at launch and again
# whenever Elite rewrites its bindings.
read_game_bindings = 1


# ============================================================================
# [menu] -- the in-headset settings menu (docs\settings-menu.md), summoned
# with hotkey.menu above. Every setting here is live.
# ============================================================================
[menu]

# While the menu is open the game sees no keyboard at all ("private", the
# default): every key reads as released to it, and Up, Down, Enter, Escape
# and your own Elite panel keys are the menu's alone. "shared" leaves every
# key reaching the game as well and the menu only watches -- the mode to
# fall back to if a game update changes how Elite reads the keyboard, and
# the mode the menu drops into by itself if one of its input doors faults.
# While keys are shared -- in this mode, and on the Monitor and Status
# pages always -- your Elite panel keys do nothing in the menu, because
# they are the ship's keys; the exception is your next and previous tab
# pair, which changes the menu's page wherever Tab does. The mouse, a
# HOTAS and a gamepad are never touched either way: the ship keeps flying.
# Live.
keyboard = private

# How the highlighted row is chosen: the arrow keys ("keys", the default),
# where your head points ("head"), or whichever moved last ("both" -- a
# key press parks the head until you look two rows away; flown 2026-09-07
# and found to fight the keys, which is why keys is the default). Live.
aim = keys

# Metres from your head to the panel (0.5..5), and how much it wraps
# toward you (0 flat .. 0.9). The panel is placed where you were looking
# when you summoned it and stays there; Shift + the menu key recentres it.
# Live.
distance = 1.4
curve = 0.2

# The height of a capital letter on the panel, in degrees of your view
# (0.6..3). A Pimax and a Quest 3 get the same apparent size from different
# pixel counts. Live.
text_degrees = 1.1

# How wide the settings panel is, in degrees of your view (16..45). This
# is the panel itself; the explanation card sits in a strip beside it and
# is extra, so the whole thing reaches about half as far again to the
# right. While that card is switched on this is held to 36, because past
# that the card falls outside one eye's view. tooltip_delay = 0 removes
# the strip and gives you the full width. Live.
width_degrees = 30

# Close the menu after this many seconds without a key or a look; 0 keeps
# it up until you dismiss it with the menu key or Escape, which is what it
# ships doing. Live.
idle_dismiss = 0

# The card beside the highlighted setting, carrying this file's own words
# about that key, its range, its shipped value and whether the change waits
# for a restart. The number is how long you have to rest on a row before it
# appears, in seconds (0.3..10); 0 never shows one. It sits clear of the
# panel, to the right, so it never covers a value. Live.
tooltip_delay = 1.5

# A one-line note where you are looking when a setting changes from OUTSIDE
# the menu -- the installer's window, or a hand edit to this file -- so a
# change lands without taking the headset off. on | off. Live.
toasts = on

# A small frame-rate readout pinned to your view while the menu is closed,
# the OpenXR Toolkit's overlay: frames per second over the last second, the
# GPU frame time the compositor measured, the time your render thread was
# busy, and frames dropped in the last ten seconds. It rides your head.
# Costs one small compositing pass per eye per frame while it is up; the
# graphics log prints the measured price. on | off. Live.
# ui: Frame-rate readout | menu performance
fps_overlay = off

# Where that readout sits, in degrees from straight ahead: positive across
# is to the RIGHT and negative to the left, positive up is above and
# negative below. (Across ran the other way until 2026-09-08, against what
# this comment has always said.) It ships centred and
# high -- 20 degrees up is roughly three quarters of the way to the top of
# the view on most headsets, clear of the cockpit and of anything you are
# flying at. It shipped 16 degrees BELOW straight ahead until 2026-09-08,
# which on a wide headset put it somewhere you never look. Both are live,
# and both are rows on the menu's Performance page: change one, close the
# menu, and see where it lands.
# ui: Readout position across | range -60..60 | live | menu performance
fps_overlay_yaw = 0
# retired-default: -16
# ui: Readout position up | range -45..45 | live | menu performance
fps_overlay_pitch = 20

# Keep the frame-rate readout visible while the F8 menu is open so you can
# watch FPS while changing settings for A/B tests. When on, the readout is
# shown inside the menu panel; when off, it hides while the menu is open as
# before. on | off. Live.
# ui: FPS readout in menu | menu performance
fps_overlay_lock = off

# Add the Advanced, Experimental and Instruments pages, and show each
# setting's name in this file beside its label. Everything on those pages
# is a safety valve or a developer instrument: the log names one when it
# wants you to change it, and a row there with a "?" badge is one whose
# comment does not yet say whether it is live or needs a restart. on | off.
# Also a switch at the bottom of the menu's own Performance page, so the
# extra pages can be turned on from inside the headset. Live.
# ui: Developer mode | menu performance
developer = off


# ============================================================================
# [log]
# ============================================================================
[log]

# EDVR writes a short plain-text log to edvr_logs\ next to the game. If you
# report a problem, paste the whole file -- it is small and contains nothing
# personal. 0 stops it.
enabled = 1

# Where the log goes. Empty means edvr_logs\ next to the game.
#dir =

# Stop writing once the log reaches this many megabytes; the log then says so
# once, at its end. 16 is the default since 2026-10-01 (it was 4): a long
# session, or one with freeze lines in it, reached 4 MB and went silent. A line
# that says max_mb = 4 here keeps 4. 0 never stops it. The flat edition reads
# this key from edvr-flat.ini first, then from this file, with the same default.
# Needs a game restart: it is read once, when the log opens.
#max_mb = 16

# How much text may queue in memory between two writes to disk, in megabytes.
#
# Not the same thing as max_mb. EDVR hands lines to a background thread that
# writes them every 250 ms; this is how much may pile up in one of those
# gaps. Anything past it is DROPPED, and the log says so where it happened.
#
# It matters for one thing: a draw census emits a line per draw for a few
# whole frames, which at 90 Hz is over in about 20 milliseconds, so the whole
# capture arrives inside a single gap. Measured 2026-09-07, one frame of a
# busy scene is about 3,900 lines and just over a megabyte -- and at the old
# one-megabyte buffer every census taken lost its tail, including the table
# that says what each @N in it refers to, which made the rest unreadable.
#
# 16 covers a three-frame census of a dense scene. It is a ceiling on what
# may queue, not memory EDVR holds: the buffer starts small, grows only as
# far as a burst takes it, and is handed back afterwards. Raise it if a
# census still reports dropped lines; the ceiling is 256.
#
# Needs a game restart: it is read once, when the log opens.
#buffer_mb = 16

# How often EDVR adds an "alive" line to edvr_breadcrumbs.txt, in seconds.
#
# The breadcrumb file is the one thing that survives a hard crash: the log can
# lose its last buffer, this cannot. Without a heartbeat it only ever recorded
# startup, so a game that died after two hours left a trail identical to one
# that died after thirteen seconds -- which is why a crash report can arrive
# with nothing in it. Each line carries a frame number, so two of them together
# say whether frames were still arriving at rate when it stopped.
#
# The cost is one small file write at this interval, made by a small thread of
# EDVR's own (the render thread only hands it the frame number), so a slow or
# filtered disk can delay the line but never a frame. Set it to 0 if you would
# rather EDVR never touched the disk mid-session, at the price of a crash
# landing nowhere.
#
# Needs a game restart: it is read once, on the first frame.
#breadcrumb_heartbeat_seconds = 30


# ============================================================================
# [d3d11] -- what EDVR reads from the game to know where you are. Read-only
# and narrow; nothing here can see your position, cargo, credits or
# missions.
# ============================================================================
[d3d11]

# Read the game's own journal (the documented file Elite writes for
# third-party tools) for gameplay boundaries: session start, disembarking,
# jumps. Event names only -- no other content is read or kept. 0 turns it
# off; EDVR then falls back to heuristics.
journal_watch = 1

# Bring Elite's window to the front as soon as it creates its swap chain,
# for the launcher/Steam/whatever-else-had-focus case where the game loads
# behind another window. 1 on, 0 off.
focus_on_launch = 1

# Where the journal lives, if your Saved Games folder was moved. Empty
# means the standard place.
journal_dir =


# ============================================================================
# [advanced] -- safety valves, measured tuning and developer instruments.
# The log will name one of these if it ever wants you to change it; nothing
# here needs touching on a normal install.
# ============================================================================
[advanced]

# The temporal pass's own settings come next here, and ui_depth's after
# them -- the ones reached from the in-headset menu most, which lists this
# section in the file's order (moved up 2026-09-09; nothing else changed).

# The temporal pass's motion source (see fix.temporal_aa).
# "depth" (the default since 2026-09-03) is the head's rotation AND
# translation, applied per pixel through the scene's own depth buffer:
# exact for the cockpit, and beyond temporal_aa_ship_metres the world's
# motion is taken from the game's own camera rows as well, so a turning
# ship keeps its skybox and a station. "head" moves the history by the
# headset's turn alone, read from the runtime -- exact at infinity, wrong
# by the head's translation for anything near. "none" blends without
# moving anything, for telling the pass from its reprojection. ("camera",
# the rows alone read without the z flip, was retired 2026-09-04.) Live.
# dev: choices depth, head, none
#temporal_aa_motion = depth

# The temporal pass's current-frame sample: "filtered" (a small jitter-
# aware Gaussian over the 3x3 around the pixel, which steadies thin lines
# and the clip; the default since the fifth flight, 2026-09-03) or "raw"
# (the point sample the earlier builds blended) for an A/B. Live.
#temporal_aa_current = filtered

# How sharply the temporal pass resamples its history each frame, 0.5 to
# 1.0: the bicubic's C, 0.5 being Catmull-Rom and larger sharper with more
# ringing. A tracked head is never quite still, so the history is
# resampled a fraction of a pixel off every frame, and those losses
# compound; a sharper kernel keeps more of the text. Live.
#temporal_aa_history_sharp = 0.5

# Two A/B instruments for the sub-pixel offset the temporal pass and
# NVIDIA's history are told each frame (not the one the game renders
# through, which is unchanged). The sign: as_is, flip_x, flip_y or
# flip_both -- if the game displaces its frame the other way from what the
# pass assumes on an axis, that flip is the one that makes text sharper
# with the head still. The lag: 0 or 1 -- 1 hands them the PREVIOUS
# frame's offset, right only if the game reads its projection before the
# boundary the offset changes at. Shipped answers: as_is and 0 (the review
# of 2026-09-04; NVIDIA's side is pinned on the desk by tools/smoke). Live.
#temporal_aa_jitter_sign = as_is
#temporal_aa_jitter_lag = 0

# The flat profile's jitter cycle: how many sub-pixel positions the picture is
# nudged through before the sequence repeats, a whole number from 8 to 64.
# Anything else (a word, 7, 100) reads as 8, the shipped value, and the log
# says so once. More positions give the upscaler more samples of each output
# pixel: the faint pulse a thin bright edge shows as the cycle repeats gets
# slower and may get smaller, and the picture takes longer to settle after a
# cut or a reset. It costs no frame time. NVIDIA and AMD suggest about
# 8 x (output / render)^2 when the game renders below the output: 32 at half
# its size. Flat profile only, and only on the route that moves the camera
# upstream, which is the one it normally runs; the older legacy route keeps 8,
# because its lighting patch refuses a nudge past 7/16 of a pixel. Live: a
# change restarts the temporal history once, and the "flat jitter:" line in the
# log names the count in use (phases=).
# dev: hidden
#temporal_aa_jitter_phases = 8

# Where the ship ends and the world begins, in metres, for the temporal
# pass's motion. What is nearer than this (the cockpit, the hull) moves
# with your head and is registered by the head's own motion; what is
# farther, and the sky, moves with the ship as well, and is registered
# by the game's camera -- which is what stops the skybox smearing and a
# station blurring while the ship turns (the Pimax flight of 2026-09-04).
# A hangar's walls within this distance take the head's motion, which is
# right whenever the ship is not turning. On foot there is no ship: while
# the game's Status.json says you are on foot and not in a ship or an SRV
# (Explorer Cam), every pixel with a depth moves with the camera and this
# distance does not apply (until 2026-10-07 the ground around you smeared
# as you walked). 0 uses the head's motion everywhere, as before, on foot
# too. Needs the scene's depth and a real scene (fifty
# draws into it a frame: the main menu's backdrop has one). 40 was the
# first default and put the main menu's hangar wall beyond the split,
# where it moved with the head. The current camera classification separates
# menu cameras; the flight-tested split is now 10 metres. Live.
#temporal_aa_ship_metres = 10

# A view of the temporal pass's working instead of the picture, for
# diagnosis: motion paints where each pixel's history was fetched from --
# red for rightward, green for downward, mid-grey for still, 16 pixels to
# the rail -- with the pixels registered by the ship's camera in blue;
# error paints how far the fetched history sat from this frame in
# brightness (temporal_aa = on only); depth paints where each pixel's depth
# comes from -- the scene's in grey by distance, none in magenta -- so HUD
# text, which writes no depth of its own, shows magenta.
# The trained modes show motion and depth, with NVIDIA's history skipped
# while a view is up. off is the picture. Live. (movers, the mover mask's
# own view, and objects, the view of the estimated station and ship paths,
# retired on 2026-09-23 with those paths: docs\per-object-motion.md. The
# mover mask stays; its share prints on the registration line.)
# motion_source paints where each pixel's
# motion came from: green a rig record Elite's records followed from last
# frame -- its exact motion, moving or holding still (a still one carries
# the camera's motion), so green is not a count of movers; red a rig record
# with no usable history this frame (first seen, after a gap, or
# unprovable: no history there); blue a surface drawn from the pool that is
# not a rig record (the camera's motion); yellow a surface whose recorded
# depth is not the pixel's (a later draw changed it; the camera's motion);
# magenta a record number that did not survive intact (declined; should
# never appear); the picture dimmed elsewhere. On foot the 2D screen shows
# the same colours for the world it shows. While the VR world route owns the
# world (experimental.temporal_aa_on_foot_world), motion_source paints the
# ROUTE's own classification of the world's pixels instead, in the same
# colours plus cyan for the first-person pixels and white for any other pixel
# whose history it refuses, before the game's tone pass (so the hue holds and
# the brightness does not). Yellow is a stale slot the camera's motion kept,
# pink a stale slot it refused because last frame's depth did not confirm
# the camera's motion there (the depth check is always on; the census counts
# the stale pixels kept and refused); red is a masked record, which it always
# refuses. The log says when the view comes on.
# In the flat profile motion_source paints the flat resolver's classification
# the same way (below native, with DLSS or FSR; not TAA). A pixel whose
# history it refuses shows the raw current frame instead of the DLSS, FSR or
# TAA result, so a jagged edge painted white, pink or red says which refusal
# left it; the log's "flat refusal census" line counts them by class.
# ui_layer (with fix.ui_quality on) replaces the picture with the UI layer
# alone over black, a dark blue wash wherever it covers anything: every
# piece of UI the layer took, in the eye it was assigned to. Anything
# missing was left in the game's frame (the log's "ui layer" lines say
# why), anything extra is a false catch, and a swapped eye is instant
# double vision.
# dev: choices off, motion, error, depth, motion_source, ui_layer
#temporal_aa_debug = off

# Full-rate temporal registration and pixel counters.
# Off keeps both the DLSS motion shader and TAA's own resolve lean: the
# registration instrument (four candidate reprojections per pixel, counted and
# not used), its probes and its counters are compiled out, and the log's
# "temporal aa registration" lines and rejection/clipping percentages only
# print with it on. The DLSS shader also samples its GPU timing every 32
# frames when off. Hologram depth's GPU pixel census (occlusion queries and
# near-light readbacks) also runs only with this on; its draw/resolve heartbeat
# remains available when off. Crisp HUD's primary HDR draw price also needs
# this switch; off reports route machinery only, on adds moved HUD rendering.
# Eye dumps enable detailed motion/resolve diagnostics while capturing, but
# the HDR draw price still requires this switch explicitly. Live.
#temporal_aa_diagnostics = 0

# Hands FSR the same UI-and-movers mask DLSS gets (its bias-current-colour
# input), so AMD's history favours this frame's colour over content that
# changes without moving -- a HUD readout counting down, for instance. Off
# leaves FSR to judge from colour, depth and motion alone. temporal_aa =
# fsr only; ignored under every other mode. Live.
#temporal_aa_fsr_reactive = off

# FSR's own debug view (DRAW_DEBUG_VIEW) in place of the picture, for
# diagnosing the port itself rather than EDVR's inputs to it. temporal_aa =
# fsr only; ignored under every other mode. Live.
#temporal_aa_fsr_debug = off

# With an external, trained engine (temporal_aa = dlaa, dlss or fsr) on the
# native OpenXR path, the engine's runtime is initialised and both eyes'
# features are made on the loading screen, as soon as openvr_api.dll has
# named the per-eye render size, instead of inside the first frame the
# headset shows -- which paid about 0.8 s for it on both installs
# (2026-09-15). The log says "warmed before the first submitted frame" with
# the split, or why not. Off (0) leaves it to the first frame, as before; an
# A/B that needs no rebuild. A flat session, the OpenVR path and the pass's
# own history (temporal_aa = on) never run it. Needs a game restart.
#temporal_aa_warm = 1

# Developer instrument, with hotkey.dump_eyes: captures matching raw C00..C15
# and treated T00..T15 crops, plus a whole treated overview and per-eye motion
# metadata in eye_HHMMSS_motion.csv. Files are written after both eyes finish.
# Crop pixel scales differ under DLSS; the CSV records input/output sizes.
# On by default. Set off to use the older single-sequence selection below.
#eye_run_paired = 1

# With eye_run_paired off: on, the eye run's sixteen
# crops are of the TREATED frame -- NVIDIA's output, what the headset
# receives -- as eye_HHMMSS_T00..T15.bmp, instead of the raw input's, so a
# flicker or a shimmer seen after the history has had its say can be
# measured frame to frame (2026-09-10: "j looks much better, I did still
# see some flickering"). Off, the run is the raw input's (C00..C15). Live.
#eye_run_treated = 0

# A depth, in metres, assumed for pixels that have none in a scene that is
# not a real one (under fifty draws a frame: the main menu). The menu's
# hangar wall reads no depth and reprojects as the sky, so it shifts as
# your head moves; 3 puts it three metres away instead. 0 is off. Live.
#temporal_aa_menu_metres = 0

# The tuning of experimental.temporal_aa_movers. tolerance: how far, in percent of
# its depth, a pixel's surface may sit from where last frame's depth put
# it before it counts as moving, 0.5 to 25 -- lower catches slower movers
# and fires on more of the reprojection's own noise; 3 is the start, and
# the registration line's "mover mask set N% of pixels" with the ship
# docked and the head still is the noise floor to read it against.
# strength: how much of its history a masked pixel loses, 0 (none: the
# mask changes nothing) to 1 (all of it: a moving edge is the fresh frame
# alone, spatially settled). Both live.
#temporal_aa_movers_tolerance = 3
#temporal_aa_movers_strength = 1.0

# The smoke's coverage, for the experiment the review of 2026-09-10 asked
# for. The trail is a ribbon of some fifty segments whose texture scrolls
# and fades along them; each segment crosses the depth floor at its own
# time, a hard step between the smoke's depth and the sky's, and the
# rectangles trace it. smoke_floor is the opacity above which the smoke's
# dense core writes its depth (0.08, the value so far; higher leaves the
# faint fringe to the sky's path). smoke_reactive is the strength of the
# current-colour mark NVIDIA gets at full opacity, the mark following the
# smoke's own opacity below it, so its scrolling texture keeps less
# history where it is dense; 0 is the one-quantum mark of before, as good
# as unmarked. smoke_floor 0.01 to 0.9, smoke_reactive 0 to 1. Both live;
# measure through a fade-out with the stars behind.
#temporal_aa_smoke_floor = 0.08
#temporal_aa_smoke_reactive = 0

# The pool probe (docs\per-object-motion.md). It finds the pool of poses
# the scene's vertex shaders read (a buffer of 336-byte records at t33) --
# with fix.temporal_aa on it always does -- so an eye run's ledger can copy
# it every frame of the run for tools\eye_run_ledger.py. 1 also runs it
# without fix.temporal_aa and says in the log when no pool turns up. (The
# per-object motion estimate it once fed -- two frames diffed every eighth
# frame, the rigid motions they carried, the origin's rebasing -- retired
# on 2026-09-23.) Nothing on the draw path but one shader-resource read a
# second; nothing changes on screen. 1 on, 0 off. Live.
#object_probe = 0

# Eye-run depth capture: with an armed eye run (the eye-dump hotkey), also
# save each eye pass's COMPLETED depth -- the depth-stencil texture the scene
# drew into (R32_TYPELESS or the R32G8X24 family), copied the moment the pass
# ends, for the first two frames of the run -- as
# edvr_logs\pool\depth_HHMMSS_f<frame>_<A|B>.bin, one binary file per eye per
# frame (header, then that pass's VS b1 float4 registers [256..336) from its
# first pool-carrying draw -- the view-projection at registers 270..273, the
# eye origin at 275 -- then the depth as plain R32_FLOAT texels; the
# R32G8X24 family is converted at capture, stencil byte dropped). Files
# before 2026-09-22 (version 1) hold registers 64..147 and no camera.
# tools\eye_depth_dump.py reads the files. This is the eval-level culling
# evidence the colour-only eye dumps cannot carry: which submitted pool
# record actually won the depth test at a pixel. Eye A/B is the depth
# probe's scene pair (first-bound pass = A), which this instrument switches
# on by itself even with fix.temporal_aa off. About
# 28 MB per eye per frame at the flight rig's 2665x2632; nothing changes on
# screen; off unless a depth question is open. 1 on, 0 off. Live.
#eye_depth_capture = 0

# Eye-run cull-gate capture: with an armed eye run (the eye-dump hotkey),
# also record what the game's own per-view visibility tests decided for
# every scene object in the run's first three complete frames -- the
# distance/LOD test, the per-view gate, the draw builder's frustum test and
# its per-part test (each part's own sphere, per view), per eye and per
# offscreen view, beside each object's pose, bounding sphere and parts --
# plus the game's view array (every view's planes and camera) and the
# geometry, index buffers and blend state of the first frame's instanced
# scene draws, so the occlusion-culling design (its doc's sections 9 and 10)
# can be priced offline against the depth capture. Files:
# edvr_logs\pool\gate_HHMMSS.bin and version 9 of
# drawstate_HHMMSS.eyemesh.bin; tools\cull_gate_probe.py reads them. Pair it
# with eye_depth_capture = 1. It watches only -- nothing is culled, nothing
# changes on screen -- and costs a few milliseconds on the three frames it
# records and ~80 MB of buffers while armed. Since version 3 of the file it
# also keeps each part's level-of-detail table, once per table, so a
# level-of-detail question is exact offline. 1 on, 0 off. Live.
#cull_gate_capture = 0

# Eye-run pixel probe: with an armed eye run (the eye-dump hotkey), name
# every draw that changes up to four chosen pixels of the run's first
# frame -- vertex/pixel shader hashes, topology, counts, blend and depth
# state -- so a pixel with no known source (wrong depth or motion, no UI or
# holo marking) can be tied to the draw that painted it. Up to 4 "x,y"
# points, normalised eye-texture coordinates (0 to 1), separated by ';',
# applied to both eyes -- for example 0.583,0.50;0.583,0.53. A 16x16 window
# around each point is copied on every eye draw of that one frame and
# diffed at frame end; nothing is changed on screen, and it costs nothing
# unless this is set. Malformed values are refused and logged, not
# half-applied. Empty is off. Live.
#pixel_probe =

# DLSS where you look (docs/performance.md, feature 6). NVIDIA's pass costs
# by the pixels it processes, so running it at full resolution only where
# you are looking is most of its cost back. This is the width of that fovea,
# in degrees of visual angle, centred on straight ahead (an eye-tracked
# centre waits on a headset whose driver publishes gaze; the Pimax's does
# not yet, so this is the fixed centre). NVIDIA runs on that crop at full
# resolution; the periphery is handled as temporal_aa_periphery says below,
# and the two are blended over the edge band. Works under temporal_aa = dlaa
# (the crop 1:1) and dlss (the game renders small and NVIDIA upscales just
# the crop to the native output). 0 is the whole frame, exactly as before.
# A value under 10 is treated as 10; a crop that would cover most of the
# frame runs full-frame instead. For scale: on a Pimax Crystal Super at HMD
# Quality 1.0, 40 is a 1232-pixel disc in a 4336-pixel-wide eye -- about a
# third of the eye's ~103 degrees across; 60 is nearly half of it, at 2.3
# times the fovea's cost.
#
# Instead of a number this may be set to edges, which shapes the crop from
# separate trims (temporal_aa_fovea_vertical, or its own _top/_bottom, plus
# _outer and _nasal, below) rather than one width -- useful because the
# outer and nasal edges are rarely equally precious. A headset already
# giving up field on an edge (experimental.fov_trim_vertical/_outer/_nasal)
# needs less width taken back by the fovea there, so each fovea trim is
# reduced by whatever FOV trim already cut that same edge, floored at 2
# degrees so an edge can never close or invert. Unlike the FOV trims, the
# fovea trims are plain degrees, not per-headset runtime/system:degrees
# lists: the FOV trim is a fact about the lenses, this is a choice about
# where DLSS spends its pixels. Live.
#temporal_aa_fovea = 0

# The fovea's shape: round (a disc; an ellipse where the crop is clamped by
# the frame's edge) or square (the crop itself). The eye picks out a straight
# edge and a corner at far lower contrast than a smooth radial gradient, so
# round hides the seam better for the same band; square is the A/B. Live.
#temporal_aa_fovea_shape = round

# The blend band at the fovea's edge, in degrees: NVIDIA's crop eases into
# the periphery over this width so the seam is never a hard line. The band
# lies inside the fovea's width. 1..30. Live.
#temporal_aa_fovea_edge = 6

# How far the DLSS rectangle leads a turn, in FRAMES of motion. NVIDIA
# builds up its picture inside the rectangle over several frames, so when
# the view swings -- your head turning, or the ship turning under it -- the
# strip of world just entering at the leading edge has nothing behind it yet
# and is soft for its first frames, and that strip arrives exactly where you
# are about to look. With a lead set, the rectangle slides that way as the
# view swings, so the fresh strip sits further out in the periphery and what
# you turn towards is already sharp; it slides back as things settle. In
# frames, not seconds, because frames are what DLSS takes to settle: 6 is a
# good first value, 0 is off. 0..12. Live.
#temporal_aa_fovea_lead = 0

# Where the two eyes' fovea discs meet in depth, in metres. Each eye's disc is
# centred on its own straight-ahead direction, and two parallel directions
# meet at infinity: in stereo the disc's edge then reads as an object far
# behind the cockpit and the splash panel, sliding over them as your head
# turns -- "set in space away from me" rather than glasses over your eyes.
# A distance shifts each eye's disc toward the nose by the eye's offset over
# that distance, so the edge fuses at the depth of what you are looking at.
# 0.8 is the cockpit, 1.5 a compromise with the panels beyond it; the OpenXR
# Toolkit's fixed nasal offset works out near 0.7. 0 is off (infinity, the
# first flights' behaviour). Live.
#temporal_aa_fovea_distance = 0

# Edges mode's vertical trim (only read when temporal_aa_fovea = edges):
# degrees to take off the fovea's crop at the top AND bottom edge, unless
# temporal_aa_fovea_top or _bottom below sets one of them on its own,
# before it is reduced by whatever experimental.fov_trim_vertical already
# cut there -- max(0, this minus that), floored at 2 degrees so the edge
# cannot close or invert. A plain number of degrees, not a per-headset
# list: unlike the FOV trim this is a choice about the crop, not a fact
# about the lenses. 0..45. Live.
#temporal_aa_fovea_vertical = 0

# The picture's upper edge on its own (only read when temporal_aa_fovea =
# edges): same (the default; also blank) follows temporal_aa_fovea_vertical
# above -- set this instead to trim the top edge to its own number of
# degrees, reduced by experimental.fov_trim_vertical the same way: max(0,
# this minus that), floored at 2 degrees so the edge cannot close or
# invert. 0..45, or same. Live.
#temporal_aa_fovea_top = same

# The picture's lower edge on its own, same rule as temporal_aa_fovea_top
# above: same (the default; also blank) follows temporal_aa_fovea_vertical,
# otherwise its own 0..45 degrees, reduced by
# experimental.fov_trim_vertical the same way. Live.
#temporal_aa_fovea_bottom = same

# The same, on each eye's outer (temple-side) edge, reduced by whatever
# experimental.fov_trim_outer already cut there. 0..45. Live.
#temporal_aa_fovea_outer = 0

# The same, on each eye's inner (nose-side) edge, reduced by whatever
# experimental.fov_trim_nasal already cut there. 0..45. Live.
#temporal_aa_fovea_nasal = 0

# What fills the periphery around the fovea. steady: NVIDIA's DLAA there too,
# on a copy of the frame reduced to temporal_aa_periphery_scale and upscaled
# back at the composite -- softer than the fovea, but as steady under head
# motion as the fovea is, so the seam is a gentle change of sharpness and
# nothing pulses. sharp: EDVR's own temporal history at full resolution --
# sharper at rest, but it blurs a little while the head moves and re-sharpens
# when it stops, and against a fovea that does neither the boundary showed as
# a pulsing outline (the 2026-09-05 flights). steady is also the cheaper of
# the two at large render sizes. Live.
#temporal_aa_periphery = steady

# The steady periphery's size, as a fraction of the output each way: 0.5 is
# half the pixels each way (a quarter of NVIDIA's full-frame price), 0.7
# about half the price. Any value is resampled exactly (an area-weighted
# box), so no scale is better registered than another. Never above the
# render: when the game renders small (temporal_aa = dlss) the periphery is
# the render itself, and at 1:1 a scale that reduces nothing runs full-frame
# DLAA instead. 0.25..1.0. Live.
#temporal_aa_periphery_scale = 0.5

# How much the periphery's own history is eased toward the frame's edge (only
# with the fovea on and temporal_aa_periphery = sharp). Toward the edge the
# history is made LIGHTER (less motion smear, so it matches the DLAA fovea at
# the seam) and the fallback sample is blurred a little more (holding thin
# geometry's flicker down spatially). Mild, because with a fixed centre you
# look straight at the periphery whenever your eyes move. 0 is uniform (no
# easing); 1 is the most. Live.
#temporal_aa_periphery_calm = 0.4

# Developer instrument: vertex-shader hashes (sixteen hex digits, comma
# separated -- the census's vh= column) of draws straight into the eye that
# ui_depth should treat as interface besides the flight HUD's, which is
# built in. Empty adds none. Live.
#ui_depth_families =

# Developer instrument: vertex-shader hashes ui_depth must never treat,
# whatever they sample. Empty excludes none. Live.
#ui_depth_exclude =

# Kill switch: composites drawn through the interface projection -- the
# main menu's panel, the loading screen's dialog, the modals -- get the
# alpha-aware depth pass (1), or are left exactly as the game issued them
# (0). The pass is what makes menu and loading text hold still; turn it off
# only to compare. Live.
#ui_depth_menus = 1

# Elite draws a panel with several different pixel shaders -- the same
# compositing with a colour matrix, or with fewer blur taps -- and EDVR
# carries a stand-in for each one it has read. With this on (1), a shader
# it has not read is drawn by its family's stand-in whenever that one takes
# the interface surface from the slot this draw has it in; off (0), such a
# draw is left alone and its text keeps swimming. On is what covers the
# escape menu you open in flight. Either way the log names every shader
# adopted this way, so a panel that gains depth where nothing is drawn can
# be traced to the draw that did it. Live.
#ui_depth_variants = 1

# The alpha below which an interface-projection composite writes no depth,
# 0 to 1. The loading screen's 40% scrim lies over the ship model, and a
# depth written there would move the model with the dialog; the dialog's
# box and its text are opaque and write. 0.5 sits between. The system
# scanner's screen is the one exception: its spectral graph is drawn dim
# (strokes at alpha 0.2-0.3) and its surface holds nothing translucent, so
# while the scanner is up it writes down to one alpha step whatever this
# says (docs\fss-scanner.md). Live.
#ui_depth_alpha = 0.5

# Optional legacy NVIDIA bias mask, 0 to 1. Current NVIDIA documentation
# supports it only on preset F; newer presets ignore it. Default 0.
# Raising it on F favors fresh UI and can shimmer. Full-eye DLAA/DLSS also
# bounds stale UI colour after reconstruction, independently of this mask;
# native TAA uses adaptive UI history. Both work with this value at zero.
# Existing explicit values remain supported. Live.
#ui_depth_reactive = 0

# How far, in 8-bit colour steps (0 to 64), the post-DLSS UI resolve may let
# the temporal AA's output stray from the current frame's own colours around
# HUD text before EDVR treats the difference as a stale UI ghost and clamps
# it. 0 restores the exact clamp that dimmed the star corona around
# targeting labels (issue 36). 12 is the measured reconstruction envelope:
# on the star corona the temporal AA's output strays from the frame's own
# colours by up to 12..16 steps at the 99th percentile. Higher values let
# fainter ghosts through. It also decides how far the temporal output may
# differ from a just-changed HUD element before that element is rebuilt
# from the fresh frame. Live.
#ui_ghost_tolerance = 12

# The brightness, in 8-bit steps (0 to 255), up to which the post-DLSS UI
# resolve holds a faint, smooth pixel at the frame's own level: the fix
# for the dark smear beside targeting labels, orbit lines and cockpit
# struts over a star's faint glow (issue 36). After a stretch of motion
# the temporal AA's accumulated output sits 2..3.5 steps above the
# frame's own level on faint smooth glow, and beside anything whose
# surroundings are refreshed every frame it does not, which reads as a
# dark halo and, moving fast, a wake; the hold keeps the field at the
# frame's level the way HUD text already is. Always on under
# fix.temporal_aa; 0 turns the hold off. It fades out over the top
# quarter of the range and over texture (a 3x3 spread above 8 steps
# fades it, 16 ends it); bright or textured pixels are never touched.
# 64 covers a star's outer glow with margin; lower it if a held region
# shows a seam against brighter glow, raise it if a brighter glow still
# smears. Live.
#corona_smear_level = 64

# The interface projection's planes, "near, far" in metres. The menu's and
# the loading screen's composites are drawn through a projection of their
# own (0.1..1000 m on game build 332841; the log's "IVRSystem: the game
# asks for its projection with planes" lines list every pair a session
# saw), while the temporal pass decodes the scene's depth with the scene's
# planes, and a reversed-Z value carries the ratio of the two nears. The
# rebound composites are written through a viewport depth range of that
# ratio so they decode right. Change only if the log names a different
# pair. Live.
#ui_depth_planes = 0.1, 1000

# Developer instrument: which eye a rebound composite belongs to is read
# from the order its colour target first appears in the frame (first =
# left, the depth probe's own rule for the scene's pair). swapped reverses
# it -- the A/B if a menu's text steadies in one eye and not the other.
# as_is | swapped. Live.
#ui_depth_eyes = as_is

# Developer instrument: the depth test at the interface draws ui_depth
# treats. as_is keeps the game's own test, so the cockpit still occludes a
# panel; always drops it, which is the A/B for the one thing the kept test
# can cost -- a piece of interface drawn later and farther losing its
# overlap against an earlier, nearer one (the flight HUD is drawn before the
# panels). Live.
#ui_depth_test = as_is

# Cockpit holograms and icons (the ship and target holograms, the radar's
# star icon) write no depth of their own, so where the sky is behind them
# they take the sky's motion and the upscaler smears them, FSR most. This
# gives each one its cockpit depth wherever it is really what you see:
# bright enough (floor, below), most of the pixel's light (share, below),
# and inside the cockpit (temporal_aa_ship_metres), which keeps the real
# sun out -- except the target reticle's three triangles, given their own
# depth at the target itself, however far, since they track it. Needs
# fix.temporal_aa. on | off. Live.
#temporal_aa_hologram_depth = on

# Extra vertex-shader hashes (sixteen hex digits, comma separated) for the
# hologram depth above to cover, besides its eleven built in: the holo
# panels (which also draw the ship hologram), the target hologram, the
# radar's star icon, its stalks and its contact markers, and the sun's
# corona family (which also draws the icon's glow). advanced.ui_depth_exclude
# applies. The canopy glass is refused even if named: covering it would
# smear every star seen through it. Empty adds none. Live.
#temporal_aa_hologram_families =

# How bright the pixel must look on screen, on its brightest channel (0
# black, 1 full), before the hologram depth pass above gives it its own
# depth. Raise it if a faint outer glow smears; lower it if a dim
# hologram does not get its depth. Pixels darker than this floor near a
# cockpit element's own light move with the cockpit rather than the sky,
# so the gaps between glyphs and rows of its text do not smear when the
# ship rolls. Live.
#temporal_aa_hologram_floor = 0.05

# How much of the pixel's light the element must supply, measured before
# tonemapping, 0 to 1; 0.5 means at least half. Keeps a faint glow over a
# bright station from pulling the station's pixels onto the cockpit's
# motion. Lower it if a hologram loses its depth where it crosses
# something bright. Live.
#temporal_aa_hologram_share = 0.5

# The keyboard gate's probe, a dev instrument for the settings menu
# (docs\settings-menu.md, Phase 0 gate G1): every five seconds, a line
# counting how the game read the keyboard -- DirectInput state and buffered
# reads (and whether the game's own device reached EDVR's hook), the user32
# key-state calls, the keyboard messages through its pump, any WM_INPUT
# (which would mean Raw Input after all) -- and how many the gate zeroed or
# swallowed. Answers which of the three doors matter on a given build. Live.
#input_probe = off

# Local GPU elapsed time from the first covered render command after poses
# through both accepted submits and EDVR follow-up copies. Shown separately
# on Monitor; excludes later mirror work.
# Also logs sparse original-game-draw GPU timing and passed-sample statistics
# in bounded windows, separately from the Monitor interval. These diagnostics
# observe draw calls without suppressing them; query overhead is not a saving.
# Live; off disables the local queries for an overhead comparison.
#app_gpu_timing = on

# Bounded OpenVR port evidence: exact historical interface calls plus CPU
# frame/context order and submitted texture/device identities. Writes to the
# normal vr/gfx logs; no GPU queries or rendering changes. Read at launch.
# Calls not seen within a bounded capture remain unproven. Developer use only.
#openvr_census = off

# Run alongside another mod that also installs as d3d11.dll (EDHM, ReShade):
# rename the other mod's d3d11.dll (e.g. d3d11_edhm.dll), put EDVR's in its
# place, and put the name you chose here. Both then work. Needs a restart.
real_dll =

# Pin the brightness fix to one specific shader. Empty means EDVR finds the
# right one itself each launch; only fill this if the log says it picked
# wrong.
exposure_shader =

# The size this rig renders one eye at, when supersampling or an upscaler
# makes it differ from what the headset is handed. Empty is right for
# everyone: EDVR measures it only when needed and says so in the log. Set
# "off" to refuse the measurement, or WIDTHxHEIGHT to pin it. Live.
#eye_render_size =

# RemLok tuning: how much of each eye's width "outer" keeps, from the
# temple inward (0.50..0.95); swap which eye is which if the lines land on
# your nose (the log's "first applied" line is the evidence); and the
# manual overlay scale used only when the angle placement is off or the
# second file is not installed (0.50..1.00). All live.
#remlok_keep_fraction = 0.55
#remlok_swap_eyes = 0
#remlok_scale = 1.0

# The brightness of the calm hologram pattern, 0 (black) to 255 (white).
# Live -- change it during a loading screen and look.
#holo_pattern_level = 255

# How much of the loading dialog's wash to keep when fix.loading_dim is
# "off", 0 (none) to 255 (full). The wash is a blurred, tinted copy of the
# interface that this value scales, so 0 removes it and 255 is stronger
# than stock -- not the other way round. Live: change it during a load and
# look.
#loading_dim_level = 0

# How flat a patch of the menu backdrop has to be before it is treated as
# banding rather than as detail, 0 to 64 (of 255). 10 is the measured
# default. Raise it and more of the picture is smoothed -- past about 24
# this stops being a deband and starts being a blur that eats stars. Set it
# to 0 to smooth nothing, which is the A/B against "stock". Live: change it,
# go back to the menu, and the picture is rebuilt.
#menu_backdrop_threshold = 6

# How much dither to lay over the rebuilt backdrop, 0 to 8 (of 255). One
# level is enough to break the last residual contour without reading as
# noise; 0 turns it off. Live, same as the threshold.
#menu_backdrop_dither = 1

# How far away the intro movie's screen sits, in metres, when
# fix.intro_video_lock is "world". 3.35 is where the splash's own screen
# was measured, so the default puts the movie exactly there; 1 to 20.
# The screen keeps its size in the world, so bringing it closer makes it
# look bigger. Live.
#intro_video_distance = 3.35

# Smooth the blocking out of the intro movie before it is enlarged, and
# sharpen it after. Only read when fix.intro_video_upscale is on.
#
# The movie's blockiness is in the ENCODE, not in anything EDVR does: the
# launch idents run from 2.9 to 15.5 megabits a second at 1920x1080, and
# the low ones band heavily in dark gradients. No resampler removes that,
# so the deband goes first, at the movie's own size, where the blocks are.
# It is the menu backdrop's own pass and takes the same kind of number:
# how flat a patch has to be before it counts as banding rather than
# detail, 0 to 64 of 255, 0 off. Past about 24 it stops being a deband and
# starts eating detail. The dither is how much noise breaks the last
# residual contour, 0 to 8; one level is plenty.
#intro_video_deband = 8
#intro_video_dither = 1

# Sharpening after the upscale -- AMD's RCAS, from the same vendored FSR
# sources, and only with fix.intro_video_upscale = fsr. The number is
# AMD's own unit, STOPS of sharpness reduction: 0 is the sharpest they
# allow, 2 the mildest. "off" skips the pass and its memory entirely.
#intro_video_sharpen = 0.25

# Sun-glare developer instruments: in-shader diagnostic variants (0 normal,
# 2-4 test renderings), and the probe -- heavy per-second measurement
# logging in every mode, for debugging sessions only. Both live.
# dev: range 0..4
#sun_glare_variant = 0
#sun_glare_probe = 0

# Developer instrument: log the particle billboards' basis constants once a
# second while smoke or steam is drawing, to see which vector follows your
# head. Reads only, changes nothing. Live.
#particle_probe = 0

# Transition-flash sensitivity: world units a frame must land off the
# viewpoint's path to count as bad, and the speed multiple that covers
# legitimate acceleration. If the log shows far more frames withheld than
# you made jumps, raise the first number.
transition_flash_units = 2000
transition_flash_speed_factor = 8.0

# Developer instrument, and NOT a way to fly. Which of the game's two
# projection query channels the terrain guard's widened frustum is told
# through (docs\terrain-culling.md). The game asks for its projection twice
# -- once as four tangents (GetProjectionRaw) and once as a matrix
# (GetProjectionMatrix) -- and the terrain culler appears to cache its frustum
# from one of them when the eye targets are built. This key is how "which"
# gets shown. The rest of the guard runs unchanged in every mode: the larger
# render targets are still asked for, so the rebuild that recomputes the
# cache still happens.
#   both    the guard as it has always run: both channels widened, the true
#           region cropped back out at submit. The only mode that is safe
#           to play with.
#   raw     ONLY the tangents channel is widened; the matrix channel answers
#           the content frustum and nothing is cropped.
#   matrix  ONLY the matrix channel is widened; the tangents channel answers
#           the content frustum.
# Reading it, parked over terrain with the guard on: edges covered
# with cull_guard_channel = raw means the culler's cache derives from the
# tangents; covered only with = matrix means it derives from the matrix.
# Fly one channel per session. A split channel hands the game deliberately
# inconsistent answers within one frame; expect it to look wrong, that is
# the measurement. Needs cull_guard on. Live.
# dev: choices both, raw, matrix
#cull_guard_channel = both

# TEMPORARY test key of the canted-display arc (docs\canted-projection.md); it
# goes when the arc closes. Elite composes each eye's eye-to-head matrix with
# its head pose in a z-negated space but takes the eye matrix raw, so a canted
# headset's per-eye yaw and pitch would arrive inverted (invisible on
# parallel panels, which have no such rotation).
#   on   the runtime answers Elite's eye-to-head query with S*E*S, S =
#        diag(1,1,-1): each eye's rotation in Elite's own handedness. EDVR's
#        own frame tables and the submitted layer keep the true transform.
#   off  Elite is given the eye matrix as the runtime located it.
# A parallel-panel headset cannot tell the two apart until simulate_cant is
# set. Live.
#canted_eye_fix = on

# TEMPORARY test key of the canted-display arc (docs\canted-projection.md); it
# goes when the arc closes. Degrees of outward cant per eye, 0 to 15, 0 off.
# The runtime turns each located eye outward by this much (the left eye's
# forward toward -x) and widens its field of view to the box that holds the
# turned frustum, so a parallel-panel headset stands in for a canted one.
# Elite's projection and eye-to-head answers, the temporal frusta and the
# submitted layer all carry the cant; the runtime's hidden-area mesh is
# withheld while it is on. Fly it with canted_eye_fix on, then off, then on,
# live: a fused, stable world with on and a split with off says the rotation
# is composed in the wrong handedness. Live.
# dev: range 0..15
#simulate_cant = 0

# TEMPORARY test key of the terrain-culling arc (docs\terrain-culling.md); it
# goes when the arc closes. Elite culls planet terrain at the outer edges of VR
# eyes, and static analysis cannot say which of its six GetProjectionRaw call
# sites builds the culler's frustum. EDVR answers that call itself, so this
# tells chosen callers the per-axis symmetric superset of what they would have
# been told (the jitter shift included) and everyone else the truth. The eye
# camera takes its horizontal extent from the aspect the fov getter reads from
# the recommended render size, so a selected group (all, camera, ui, other) is
# also told, at that one call only, the width that makes the camera's centred
# frustum the symmetric superset (the height kept; the log says "also told
# aspect"); every other asker of the render size, the target allocation first,
# is told what it was. Nothing else changes: not the projection matrix, not
# any crop. The census of who calls (the log's "projection callers" lines)
# runs whatever this says.
#   off     the truth for every caller.
#   all     every caller answered wide.
#   camera  the eye camera's call (the first site, reached from RVA 0x2878E1B).
#   ui      the UI scale's call (the same site, reached from RVA 0x8D269A).
#   sky     the full-screen quad pass (RVA 0x4E3C93).
#   sizes   the four size queries for the UI.
#   other   any caller not named above.
#   mono    the mono camera's aspect times 1.30, on every frame: the one camera
#           left that the game builds on its own (its aspect is read by a
#           getter at RVA 0x2841190 and the lie reaches only the call that
#           returns to RVA 0x2871D89). Not a group the runtime is told about,
#           so `all` does not include it.
#   cycle   all of them in turn, by itself: off, all, off, camera, off, ui, off,
#           sky, off, sizes, off, other, off, mono, in 2.0 s windows (the first
#           30 frames of each dropped), counting the planet-terrain draws each
#           eye gets per frame and logging a `cull cycle:` line per window and
#           the pairs of each group against its neighbouring off windows at the
#           end of each cycle. Park landed with the head still, forward, for
#           about four minutes (eight cycles of 28 s), then set off
#           and read the log with `edvr_log.py --tally cull`.
#   measure the same counting and window lines with NO lie, each window
#           labelled by the cull guard's stage (off, waiting, adopting, live)
#           in place of a group: the positive control. Set it with
#           fix.cull_guard off for 60 s, then symmetric (the guard arms live)
#           for 60 s once the log says live; the tally prints live minus off.
#           Unlike the lies it keeps counting while the guard runs, on any
#           build.
# cycle, measure and mono also put two observe-only hooks into the game's
# aspect code (build 332841 only; one log line says whether they went in, and
# why not): the first sight of every caller of the aspect getter, and one line
# per call of the function that writes a camera's aspect (50 at most). With
# the hook live each window line ends `, mono reads N`.
# The lies (all through cycle) act only with the cull guard off, and only on
# Elite build 332841; the log says when they are ignored or stand down. By
# hand, parked over terrain with squares at the outer edge, one value at a
# time, the squares flicker too much with head motion to judge: use cycle, and
# the group that raises the terrain count names the culler's input. Live.
# dev: choices off, all, camera, ui, sky, sizes, other, mono, cycle, measure
#cull_probe = off

# The remaining flash tuning is set from measured field sessions; each
# rule's escape hatch is its zero. The log reports what every rule did, so
# change these only against a log, not a hunch. Details:
# docs\transition-flash.md.
#transition_flash_max_consecutive = 2
#transition_flash_repeat_percent = 2.0
#transition_flash_radius_tolerance = 0.005
#transition_flash_park_units = 64
#transition_flash_dwell_frames = 20
#transition_flash_burst_limit = 3
#transition_flash_burst_window = 60
#transition_flash_separation = act
#transition_flash_drift_pct = 10
#transition_flash_resubmit = 1

# Names the game's own call stack at every write to the eye-origin buffer
# (the same 5376-byte camera_buffer_bytes/camera_buffer_offset below), so a
# flight can show WHICH of the game's own functions writes it instead of
# guessing an address -- a guessed address was flown once and refuted. Off:
# nothing runs, not even the stack capture. On: every write is hashed into
# a 64-entry table of distinct stacks (a 65th distinct stack reports as
# overflow); the camera history key (Pause by default) prints the table and,
# per frame, which stack wrote the eye's origin; and every frame the old
# detector would withhold (or did) automatically dumps a window of ring
# frames around it to edvr_logs\flash\eyetrace_HHMMSS_fN.txt, at most 12
# dumps a session -- no key press needed. off | on. Needs a game restart:
# read once, at install, like camera_buffer_bytes/offset below.
#eye_origin_trace = off

# The head-pose reader hunt (docs\design-transition-flash-engine-fix-
# 2026-09-23.md, parts A2/B): who in the game reads the pose EDVR's
# runtime hands back, and whether the game's own camera positioner swaps
# at a transition. On also turns eye_origin_trace's own stack capture on,
# even if that key above is off, so the two share one dump timeline. Two
# instruments behind this one key:
#   A hardware data breakpoint on the exact float the runtime handed back,
#   armed once its address has held steady for 60 frames and is off the
#   calling thread's own stack (otherwise it says why in the log instead
#   of arming). Every hit inside EliteDangerous64.exe is unwound and
#   deduped into a table of at most 32 distinct readers; armed at most 30s
#   or 5000 hits, whichever first, then stays down for the session.
#   Read-only CodeHooks on the game's per-frame camera-positioner Tick and
#   its swap-sync routine, build- and prologue-keyed -- each stands down on
#   its own if either has moved.
# Automatic dumps go to the same edvr_logs\flash\eyetrace_HHMMSS_fN.txt
# files as eye_origin_trace, narrowed to the scene-judged eye-camera-reset
# verdict and a positioner swap (not every render-pass jump). off | on.
# Needs a game restart the first time it is turned on, to install the two
# CodeHooks; after that the on/off bit itself is live.
#eye_origin_readers = off

# The engine fix, round 6 (docs\design-transition-flash-engine-fix-
# 2026-09-23.md, "Static round 6"): the game's camera driver copies a 4x4
# "mailbox" out of the ship object before composing the eye views, then
# resets the mailbox to an identity constant. Some writer has to refill it
# every frame; on the frame after a render-frame switch it is not refilled
# in time, so the eye composes against the head pose alone -- the flash.
# This hooks the driver itself (build- and prologue-keyed -- stands down
# on its own if either has moved) and, once a candidate stand-in from
# elsewhere on the ship object
# has agreed with the mailbox at least 120 times with under 2% disagreeing,
# writes it into the mailbox on the one call that finds the mailbox already
# reset, before the driver runs.
#   off        nothing installed. One log line.
#   watch      the consumer hook and its own hardware write-watch on the
#              mailbox run and compare; nothing the game sees is ever
#              changed.
#   on         writes the validated stand-in in on an unrefilled call,
#              subject to a 60-acted-frame session cap.
#   alternate  transition EVENTS alternate watched, acted, watched,
#              acted... (the first is watched), so a flight can compare an
#              acted transition against an adjacent untreated one without a
#              second flight.
# Automatic dumps (this fix's own event, or the detector's scene-judged
# eye-camera-reset verdict) go to edvr_logs\flash\eyebase_HHMMSS_fN.txt, at
# most 12 a session. Needs a game restart the first time it is turned on,
# to install the consumer hook; after that watch/on/alternate move live.
#transition_flash_eye_base = off

# Where the viewpoint lives in the game's memory. Build-specific; if an
# update moves it, EDVR notices the data stops behaving like a viewpoint
# and says so.
#camera_buffer_bytes = 5376
#camera_buffer_offset = 1100

# Which number in the screen's position data is its distance. Only change
# if panel_distance stops working after a game update.
#panel_distance_index = 47

# Install the render hooks even with both panel fixes off (the flash fix
# reads the camera through them).
#panel_hooks_always = 1

# Ignore the crash sentinel for one launch.
#ignore_sentinel = 0

# Turn every fix in d3d11.dll off, permanently, without uninstalling
# anything. The crash sentinel already does this for ONE launch after a
# crash; this is the setting for a machine where they crash EVERY launch,
# so the game stops alternating crash and play. The openvr half keeps
# running: the terrain guard, the launch recentre and the compositor's own
# fixes never touched this half. 1 is normal.
#d3d11_fixes = 1

# Intercept DirectInput keyboard creation and gate keyboard input while the
# in-headset or flat settings menu is open, so keystrokes do not leak into
# ship controls. 1 (the default) hooks keyboard devices created by the game.
# 0 turns off DirectInput keyboard hooking and leaves input untouched.
#input_gate = 1

# How EDVR hooks the game's render context.
#   auto     let EDVR decide, by asking whose code implements the context.
#            It picks live when the methods are Windows' own and shared when
#            another mod wraps them. The shipped default; the log names which
#            one it chose. This is what makes the launch crash (issues #20 and
#            #21) fix itself with no setting here at all -- auto used to pick
#            private, and private is the mode that hung.
#   shared   patch the table the game shares with every other tool. Composes
#            with wrappers; anything else that writes those slots can bypass
#            EDVR's fixes, and EDVR says so in the log when it happens.
#   private  give the context a FROZEN copy of the table to itself. A tool
#            that writes the shared table cannot bypass EDVR's fixes, but the
#            copy is a snapshot: it does not follow the runtime if the runtime
#            re-points its own entries, and on a rig where Windows' d3d11.dll
#            re-lays the table mid-frame that snapshot desyncs and hangs the
#            GPU a second or two after launch (issues #20/#21). The older
#            mechanism, kept only as an escape hatch -- live supersedes it.
#   live     give the context a table to itself in which every entry reads
#            the game's own entry at the moment of each call. Keeps what
#            private buys -- nothing else can write the table the context
#            dispatches through -- and gives up the snapshot, so the runtime
#            may change its own entries as often as it likes and the next
#            call follows. Costs two extra jumps per call, which is nothing
#            anybody has been able to measure. This is what auto chooses when
#            the methods are Windows' own.
# Only change this against a log. auto already avoids the launch crash; if the
# game still dies a second or two after "arming d3d11 hooks", try shared. If
# shared keeps the game alive but the log then says EDVR's hooks are being
# pushed out of the table, live is the one to set by hand: it is both
# unbypassable and never out of date. Please report whether it helps, with
# both logs. Needs a game restart.
#context_hook_mode = auto

# Developer instrument: name whoever writes to one of the render context's
# function-table slots. 0 is off; any other number is the slot to watch.
#
# Every other line in the log that names a module for a slot is naming the
# POINTER FOUND THERE, not the code that stored it. This makes the slot's
# page read-only, catches the next write, and reports the instruction that
# did it -- the author, with no guessing. Needs context_hook_mode = shared.
#
# ARMED, EVERY WRITE ANYWHERE ON THAT PAGE TAKES AN EXCEPTION, and a page
# holds far more than one table. For one short session with a purpose; set
# it back to 0 afterwards. It stops on its own once it has seen enough.
# Needs a game restart.
#vtable_writer_probe = 0

# Developer instrument: log every change to the render context's function
# table -- what changed, from what to what, when, and who did it.
#
# The probe above names whoever writes to one slot. This answers the
# question a crash report needs instead: the game's own function table is
# rewritten constantly, almost always with the values it already held, and
# the interesting event is the rare write that puts something DIFFERENT
# there. Writes that change nothing are counted and dropped. Writes that
# change something get a line with the frame number, the time to a tenth of
# a millisecond, the slot, both values, the instruction that did it, which
# thread it was on and how it was reached -- and the first few are also
# written to edvr_breadcrumbs.txt, which survives the game being killed by
# a hung graphics card. A long frame and the once-a-second table check each
# print the last few as well, so a log that ends in a crash says whether
# the table changed before it or after.
#
# In the shared hook mode the table churns constantly -- the game's own
# graphics runtime writes its entry back over EDVR's hook, every frame -- so
# the per-change lines stop early there, after 4000 of them. (EDVR's own
# writes are not in the list at all: it opens the memory before writing, so
# those never reach this.) The running tally of who changed what carries on
# to the end of the session either way, and the closing summary says where
# the lines stopped.
#
# ARMED, EVERY WRITE ANYWHERE ON THAT MEMORY TAKES TWO EXCEPTIONS, which on a
# healthy machine is hundreds a frame; the closing summary says what that
# cost, in milliseconds per frame. It switches itself off, loudly, if that
# ever passes 4 ms a frame -- but never in the first ten seconds, because the
# crash it exists for happens in the first two. It also stops after two
# million caught writes, whichever comes first. One short session with a
# purpose, then back to 0. Only one of this and vtable_writer_probe can be
# armed at a time -- the log says which one is holding it if both are asked
# for. Needs a game restart.
#vtable_flip_timeline = 0

# Developer instrument: install the private table with NOTHING in it.
#   off    normal
#   swap   the render context gets a byte-identical private copy of its
#          function table and no fix is installed on it at all -- every
#          call runs exactly the code it always ran, from a new address.
#   live   the same, except every entry reads the game's own entry at the
#          moment of the call, so nothing can ever be out of date. The only
#          thing that is not stock is where the table lives.
# For a machine that dies seconds after the private-copy mode goes in:
# if it still dies with swap, the copy itself is fatal and no fix was ever
# the cause; if it lives, a fix is. If swap dies and live lives, what was
# fatal was the copy being a SNAPSHOT rather than the copy existing, which
# is a different thing to fix. Every d3d11 fix is off while either is set.
# One session each, then back to off. Needs a game restart.
#context_hook_probe = off

# Developer instrument: name the frame scheduler that drives the engine's
# kinematic/bucket worker entries (docs/engine-render-pipeline.md stage 0).
# Every worker entry is invoked only through a vtable-table callback stub, so
# no static read of the binary can say who calls them. This watches the four
# scheduler-fed entries (the two worker entries, the per-record drain and the
# reset+repopulate) and captures, read-only, the return addresses on the live
# stack at each entry -- one bounded scan, hashed into a signature, counted
# per target. 0 is off (the shipped state). One session with a purpose, then
# back to 0. What a flight tells you: ONE VA recurring at a consistent frame
# position across signatures is the dispatcher; VAs in 0x1462b0000..0x1462c0000
# or 0x145dd0000..0x145dde000 are the table stubs (the caller above the stub
# is the scheduler); anything else named in .text is a scheduler candidate
# directly. Totals and the top three signatures per target print every 20 s.
# Needs a game restart.
#scheduler_probe = 0

# Flat camera producer probe (docs/design-flat-camera-integration.md, the C1
# step): who computes the scene CB's camera rows. on hooks the game's
# Ghidra-validated single-site constant-upload helper (executable patch, the
# same mechanism as the write watches), learns the 5376-byte staging block,
# and arms a bounded hardware write breakpoint on its camera-row span -- the
# writer's RIP is named with a bounded stack. Budgets: 8 blocks, 8 re-arms, 8
# writers, 30 s armed; every budget says its name when reached. Diagnostic
# only; off is the shipped state. Live (hot-reload), no game restart needed.
#flat_camera_producer_probe = off

# Flat resolver context isolation: how the temporal resolver (EDVR's TAA, DLSS,
# DLAA and FSR) puts the game's pipeline state out of the way while it works,
# and back afterwards. auto, the shipped value, swaps the game's context state
# for a fresh one (ID3D11DeviceContext1::SwapDeviceContextState) on every
# device but DXMT, the D3D11-to-Metal layer under CrossOver on a Mac, where that
# call is not implemented and ends the process; there a capture of the whole
# state (every shader stage with its resources, the input assembler, the output
# merger, the rasterizer, predication), cleared and put back call by call, runs
# instead. swap and capture force one or the other, for testing: swap on DXMT
# ends the game at the first treated frame; capture on Windows works and costs
# a few dozen calls a frame. The log names the mode and the reason on one line
# ("flat resolver: context isolation by ..."). Flat profile only; the VR world
# route always reads it as auto. Needs a game restart. It has no say in the HDR
# route's breadcrumbs (edvr_breadcrumbs.txt): those are written on DXMT alone,
# whatever this is set to.
# dev: hidden
#flat_context_isolation = auto

# Flat constant-buffer map cache. auto enables it only when sampling finds
# slow reads of a mapped buffer (as with some D3D11 translation layers).
# on and off are temporary validation settings; auto is the default.
# Flat profile only. Restart the game after changing it.
#flat_cb_map_cache = auto

# VR camera census (design doc section 82, "Pre-build findings"): which camera
# is which at the game's view-constant refresh, so the on-foot world route's
# jitter can reach the world's camera and never an eye's. on installs the hook
# the flat camera path uses (EliteDangerous64.exe+0x592200) in an OBSERVE-ONLY
# mode: it never writes a bound pair, a dirty flag or a row, and the flat
# runtime is never asked anything. It logs "vr camera census" lines, about four
# hundred a session at most: a 5 s line (calls, calls on other threads, kinds,
# callers, distinct cameras, where in the frame the calls fall against the tone
# draw), one line per distinct camera with its field signature and the view it
# belongs to, the whole call sequence of the first three on-foot frames, and,
# at the eye composite draw of the first four on-foot frames, the eye's own
# constant-buffer rows read back from the GPU (a stall of a few milliseconds
# each, eight times a session). An on-foot frame is one in which the tone is
# drawn while Elite's own journal says on foot; with no journal the tone alone
# decides, and with no tone (the world route reports no draw progress) the
# journal alone does. Read it with python tools\edvr_log.py --camera-census.
# While it is on, the world route also counts the pixels its resolver refuses
# (stage 2 experiment build): one frame in four, a small compute pass over a
# class byte per pixel, summed by cause on a "vr world route refusal 5s:" line,
# which splits the stale-slot pixels into stale-refused and stale-kept (what
# the steady-detail depth check, always on, kept). The line is printed while the
# census is off as well, carrying only the depth check's frame counts.
# VR profile only: the flat profile reads it as off. Diagnostic. Zero mutation.
# Off is the shipped state. Live: on installs the hook at the next frame; off
# stops the census and leaves the hook in place, inert, until the game exits.
# dev: choices off, on
vr_camera_census = off

# Developer instruments for isolating which draw makes an effect: skip
# eye-texture draws matching a census spec ("X:15360", ranges and @ filters
# supported, or "vs:4435F2E50020E7F3" to skip everything drawn by one
# vertex shader -- the census logs each draw's shader as vh=, and two
# effects sharing a pipeline can still be told apart that way), skip draws
# into an offscreen buffer named by size, or skip by position in the frame
# and bisect. Live; empty is off, and off is the only shipped state. The
# log counts what it drops.
#
# census_skip_offscreen also takes an optional draw spec after the size:
# "4259x2395" skips everything drawn into that buffer, "4259x2395:X:2508"
# skips only the indexed-instanced draws with 2508 indices. A size alone
# answers "is the thing built in here"; the spec answers "which draw".
#
# The particle billboard family, mapped 2026-08-29 by disassembling every
# vertex shader in a shader dump (advanced.glare_shader_dump) and looking
# for the construction docs/particle-billboards.md describes: a quad basis
# built once from the camera, cross(cb1[278], cb1[279]) -- cameraUp with
# cameraForward. That pair, crossed, is the fingerprint of this bug in any
# dump. SEVEN shaders carry it, and fix.particle_billboard now replaces
# two of them:
#
#   vs:EB787F983BC1F5A3   the geyser and smoke plume -- REPLACED
#   vs:6041FD2D3D0164E1   the solar flare -- REPLACED (found this way)
#   vs:9AEC596A2B036EA6   the witchspace starfield -- NOT replaced, and
#                         must not be: 0.12.3 gave it the flare's
#                         replacement on a likeness and the starfield
#                         vanished. It writes the same values to different
#                         output registers under different TEXCOORD
#                         indices, so it needs its own transcription or
#                         nothing at all.
#   vs:9F4BBCFCD3B68BC9
#   vs:78F5F08D02EE38CC
#   vs:BBAD1CA808E1E292
#   vs:1B285CBC9F185D4D
#
# The last four are the same bug on effects nobody has named yet. To find
# which of them draws an effect, park where it is visible and set
# census_skip to one at a time -- the key is live, so no restart is needed,
# and the effect disappearing names its shader.
#
# Two things the flare hunt cost, worth not paying twice. A dump holds only
# shaders CREATED in sessions that ran with the dump on, so it records
# scenes visited rather than the game: the flare's shader was in no dump,
# and a sweep over the dump could not have found it. And these shaders do
# NOT share a signature -- the plume is 13-in/12-out, the flare 10-in/5-out
# -- so a replacement cannot simply be pointed at another hash; each
# signature group needs its own transcription.
#
# DB113566B6A59C5B shares the family's inputs but selects a supplied axis
# or world up instead of the camera, and guards its length BEFORE dividing.
# It is what a correct one looks like inside the game; read it first.
#census_skip =
#census_skip_offscreen =

# Developer instrument: re-issue ONE batched draw without some of its
# rectangles. WIDTHxHEIGHT:KIND:COUNT:LO[-HI] -- the draw of that shape
# into that offscreen target is drawn as the indices before quad LO plus
# the indices after quad HI, six indices to a quad. Elite batches its solid
# UI rectangles, so skipping the whole draw takes a dialog and the wash
# behind it together; this is how one of them gets named. Live; empty is
# off, and off is the only shipped state.
#census_skip_quad =

# With census_skip_quad set, CLIP its quads to a centred box instead of
# omitting them: fractions of the target, 0 to 1, and both must be set.
# For a dark rectangle that is not unwanted but the wrong SIZE -- it spans
# the view when it only needs to sit behind a dialog. Empty or 0 keeps the
# omit behaviour. Live: change and look.
#census_clip_width =
#census_clip_height =

# Developer instrument: read the RECTANGLES a draw paints.
# WIDTHxHEIGHT:KIND:COUNT[:SKIPFRAMES] names a draw signature into one
# target -- any target, the eye textures included. COUNT is INDICES for
# kinds I and X (six to a quad) and VERTICES for D and N, where the only
# shape read is a four-vertex strip quad. After letting SKIPFRAMES matching
# frames pass (the first is usually mid fade-in -- 120 waits out about two
# seconds for steady state), the next frame containing a match has EVERY
# draw of that signature copied, each from ITS OWN vertex buffer, and each
# occurrence's quads are logged -- extents, viewport and scissor, plus the
# vertex bytes past the position, where a colour or uv would live. Two
# same-signature draws with different extents are different rectangles
# sharing one widget, which is what a census, matching by signature, can
# never show. One capture per session; re-set the value to ask for
# another. Empty is off.
#quad_probe =

# Developer instrument: hold the quad probe until this many milliseconds
# into the session, then let its SKIPFRAMES count start. 0 is off.
#
# The skip counts MATCHING FRAMES, which is right for "let the fade-in
# finish" and wrong for "wait until the intro movie is over": the movie
# plays at about 178 frames a second on the measured rig and the menu
# behind it runs at 13, so a skip big enough to clear the movie leaves you
# sitting at the menu for minutes while the rest trickles past. This says
# the same thing in the unit that survives a frame rate changing under it.
# Both have to be satisfied, so "thirty seconds in, then two seconds of
# steady frames" is expressible; neither alone can say it. Live.
#quad_probe_at_ms = 0

# Developer instrument: record the STARTUP sequence -- what the game draws
# between the first frame and the menu, which is the stretch no other
# instrument here can be aimed at (docs\intro-video.md). For each frame it
# counts the draws by the render target they land in and writes a line
# whenever that shape changes, whenever a frame takes 200 ms or more (the
# intro movie's freeze is one of these), and for each new clear colour it
# sees -- read before the black void fix substitutes, so the line says what
# the GAME asked for. Eye-sized targets are starred, and the first frame to
# draw into one is called out: that is where VR takes over. With the movie
# not skipped, the same forwarding file-open hooks the skip uses are
# installed at launch, so the movie's open and its first and last fill are
# timed against the device line; a reload after the movie has drawn
# declines the hooks and says so. Refuses nothing, stands down after three
# minutes or 96 lines, 1 on 0 off. Live.
#intro_probe = 0

# Developer instrument: arm a census at named moments after the session's
# first frame, in milliseconds -- up to eight, comma separated, e.g.
# "1000,4000,9000". Everything else that arms a census needs something
# known in advance (a hand on the census key, a journal event, or the size
# of a target somebody already censused), and the startup has none of
# those: it is over before a human reacts, and for its first phase the
# size of one eye has not been published to the d3d11 half yet. These
# censuses record offscreen draws whatever census_offscreen says, since
# that is the only thing worth aiming them at. Read once, at the first
# frame -- editing it mid-session does nothing. Empty is off.
#census_at_ms =

#census_skip_range =

# Developer instrument: dump both eyes' render targets at five moments of
# ONE Full System Scanner build frame -- before/after the ring quad,
# before/after the body composite, and at frame end -- as raw pixel files
# in edvr_logs\dumps\ (~700 MB, one visible hitch, one dump per arming).
# The number is which body frame to capture, counted from arming; the
# build's squares animate over roughly the first 30 frames, so 12 lands
# mid-build. The offline comparison (tools\diff_eye_dump.py) then names
# the exact interval of the frame where the left eye's image starts
# differing from the right's. 0 or empty is off and the only shipped
# state. Live; re-arming needs the key cleared and set again.
#fss_eye_dump = 0

# Developer instrument: the field's own design -- fold every submitted eye
# image to a 16-pixel tile-luminance row from the moment the scanner's
# body appears, N consecutive frames (max 48), both eyes, into
# edvr_logs\dumps\fssseries_eye*.bin. No full-frame copies, no hitches;
# the offline diff reads the per-eye CADENCE of the black-square flashes
# -- the one measurement two-frame dumps could never make. 0 or empty is
# off and the only shipped state. Re-arming needs the key cleared and set
# again. Live.
#fss_eye_series = 0

# Developer instrument: arm a census at a scanner zoom's FIRST frame. A
# world-camera jump landing while the scanner's chrome is up starts the
# standard auto census, so the capture covers the ARRIVAL -- the frames
# where the left eye's reveal-gated blacks live, which every census
# triggered by the body layer starts too late to see. Uses the census
# frame/line settings; one census per jump, capped by the auto machinery.
# 1 on, 0 off and the only shipped state.
#census_fss_jump = 0

# Developer instrument: skip compute DISPATCHES by shader hash -- the hash
# the census logs as "ch" on DCX lines -- up to four comma-separated. The
# draw skips' completing half: the FSS black-square stack is built by
# compute (a per-eye 16x16-tile mask with no draw to skip), and a system
# only compute touches needs its dispatches skippable to be localised live.
# The scene may look very wrong while set; that is the probe working. Live;
# empty is off, and off is the only shipped state. The log counts drops.
#census_skip_dispatch =

# Developer instrument: make the draw census (the dump_draws key) also record
# draws that land OUTSIDE the eye textures, logged as DCO lines. Off by
# default, because a full scene is thousands of draws a frame and three frames
# of that spends the census line cap on the way past.
#
# Turn it on when the question is "where is this actually drawn". An FSS
# census in 2026-08 showed 220 eye draws a frame, and skipping both of its
# largest families removed nothing visible -- the bodies on screen were being
# built in an offscreen target and composited in, where the eye-sized gate
# could not see them. The r= column on a DCO line names that target, and the
# interned table at the end of the census gives its size.
#census_offscreen = 0

# Developer instruments: how many whole frames one census records, and how
# many lines it may write. The defaults (3 and 4096) are right for the
# steady-state diffs the census was built for; a capture that has to span a
# progressive build -- the FSS body tiling in after a zoom -- wants the
# window long (30) and the cap high (16384, about 2.3 MB of log), or the tail
# of the build falls off the end. Read when a census starts.
# Name a render target by size and the colour every clear gives it is
# logged, up to eight times. For finding a wash that no draw paints --
# a buffer's clear colour is invisible to any draw census, however the
# spec is written. Nothing is changed; empty is off.
#clear_probe =

#census_frames = 3
#census_lines = 4096

# Developer instrument: arm a census AUTOMATICALLY the first time a draw
# lands in an offscreen target of exactly this size after two quiet seconds,
# as if the dump_draws key were pressed at that moment. One WIDTHxHEIGHT;
# empty is off. At most 8 firings a session; re-saving the ini resets the
# allowance. The census it arms records offscreen draws even if
# census_offscreen is 0, since an offscreen build is the only thing worth
# aiming this at.
#
# It exists because a keypress census records what the scanner looks like
# AFTER it settles -- human reaction lands twenty frames late -- and the FSS
# ring bug lives only in the build frames. Set this to the body target's size
# (2170x2142 on the measured headset; check your own census's interned
# table), open the FSS, and zoom onto a ringed body: the census arms itself
# on the first build draw and catches what no keypress can.
#census_auto =

# Developer instrument: the vertex-shader hash target_indicator watches for,
# as sixteen hex digits (the census's vh= column). Empty uses the measured
# one, E508648660A352B2 on game build 332753. A game update can recompile a
# shader without changing what it does, and this is how the fix is re-pinned
# without a new build: take a census with a target selected, diff it against
# one without, and the added draw's vh= is the value.
#target_indicator_vs =

# How hard RCAS sharpens the target indicator after EASU, in AMD's own unit:
# STOPS of sharpness reduction, so 0 is the sharpest and each whole number
# halves it. "off" runs EASU with no sharpening pass.
#
# It is not free. RCAS reads a five-tap neighbourhood of the upscaled image,
# which does not exist as a texture here, so each tap re-evaluates EASU: 1648
# shader instructions against 413 with sharpening off. That is one small quad
# per eye either way, but "off" is the first thing to try if this ever costs
# frames.
#target_indicator_sharpen = 0.25

# Developer instrument: paint the target indicator a flat colour for its
# local SCALE instead of its own art, to settle whether the source is being
# magnified or minified. 1 on, 0 off.
#
# The whole question is which side of 1:1 we are on. A magnified source wants
# a reconstruction kernel, which is what target_indicator does; a minified one
# wants averaging over the footprint instead, and no reconstruction kernel
# will help it. Texels of the surface per output pixel:
#
#   blue     magnified 2x or more
#   green    about 1:1
#   yellow   minified up to 3x
#   red      minified 3 to 6x
#   magenta  minified more than 6x
#
# Painted without the HUD colour matrix, which would map every hue onto the
# commander's own HUD colour and erase the answer. Needs target_indicator =
# sharp; live, and 0 is the shipped state.
#target_indicator_scale_probe = 0

# The index counts that identify the wake pulse's draw, comma separated.
# Empty uses the measured set: 1728 and 576.
#
# The count is TESSELLATION, not content. The GUI subdivides its vector
# curves by pixel size, so the same marker needs a different number of
# segments on a different-sized panel -- measured on one machine, two
# headsets, same build and same ship: 1728 where the panel comes out
# 2440x1996 and 576 where it comes out 1002x820, which are 288 quads and 96
# quads of one ring. A third render resolution would want a third number, so
# the list is only a head start for panels already measured.
#
# On any other panel it FINDS THE DRAW BY ITS SHAPE, which is the part that
# does not change with resolution, build or ship. The marker is a ring: every
# one of its vertices sits on a circle about 0.47 of the way out from the
# panel's centre, and nothing else drawn there is -- the clip frames reach
# the corners, the widgets are rectangles, the text is a strip. One
# vertex-buffer readback settles a candidate, and the adopted count then
# matches for free. A draw present in nearly every frame is refused however
# well it fits, because that is furniture rather than a pulse.
#
# The ring must be ON SCREEN to be recognised, so on an unmeasured panel the
# first high wake of a session can still flash before it locks on. The log
# says which count it adopted and why. Setting a value here overrides all of
# that.
#wake_pulse_indices =

# Developer instrument: while a census runs, every recorded draw whose vertex
# shader matches this hash (the census's vh= column) also dumps the CONTENTS
# of its b0 constant buffers -- vertex and pixel stage -- as DCW lines: the
# bytes the GPU reads for exactly that draw, captured from the game's own
# writes. Same-frame dumps pair by q; diffing eye A's against eye B's is how
# a per-eye value hiding in shared buffer objects gets caught. Empty is off.
#
# For the FSS ring split: 953C8123AD8DC13B is the composite that pastes the
# scanner body into each eye. Its textures are measured identical between
# the eyes (2026-08-25); its constants are the channel the census cannot
# otherwise see.
#
# Also matches COMPUTE shaders (2026-08-26): a dispatch of a watched hash
# dumps its CS b0 and b1 the same way (slots x and y in the DCW lines), and
# a second comma-separated hash watches two shaders in one census -- built
# for the reconstruction pair E861F611375E7ECC,B74273EC13F7CD59, whose
# shared 80-byte block is the per-eye-rewrite idiom this key exists for.
#census_cb_watch =

# Developer instrument: which constant-buffer SLOT census_cb_watch reads,
# 0 to 13. 0 is b0 and the old behaviour.
#
# It was b0 and only b0, and twice that has been the wrong buffer: the
# loading wash's pixel shader reads b2, and the intro movie's panel is
# placed by a scale and a transform in its VERTEX shader's b2. Both times
# the census reported "no constant buffer" for a draw whose whole
# behaviour was in one, because the column only looked at slot zero. Set
# this to 2 with census_cb_watch naming the shader to dump it.
#census_cb_slot = 0

# Developer instrument: write every shader the game creates to
# edvr_logs\shaders, for reading a draw's own code when a fix needs it.
# Costs file writes during loading; needs a restart.
#
# Vertex, pixel AND compute (vs_, ps_, cs_ by content hash). Compute was
# added 2026-09-07: their hashes had been recorded on census dispatch lines
# since the hook was written, so a capture could name one and nothing could
# read it. Two of them turned out to be reading the scene depth's stencil
# plane, which is a thing a fix needs to know before it writes there.
#glare_shader_dump = 0

# Curved-screen tuning. The sign is 1 for "toward you", correct on the game
# build this was measured against; -1 is the escape hatch if an update
# flips the panel transform's handedness. Segments is how many columns the
# screen is cut into -- 64 is far past what the eye can see, and below
# about 8 the screen visibly facets. The gain is the bend's depth scale in
# the panel's own units: EDVR reads it from the game automatically, and
# this overrides that reading if a game update moves it (0 = use what was
# read).
#panel_curvature_sign = 1
# dev: range 1..256
#panel_curvature_segments = 64
#panel_curvature_z_gain = 0.0

# Texture filtering, for the shimmer a repeating pattern makes on a
# distant surface -- a station's ribbed panels, a hull's hatching. That
# is a mip chosen sharper than the pixel covers, and nothing at the
# submit door can undo it: the detail was never sampled. anisotropy
# forces the game's plainly linear and anisotropic samplers to that
# many taps (1 to 16); lod_bias adds to their mip choice, positive for
# blurrier and quieter, negative for sharper. Point, comparison,
# minimum and maximum filters are never touched. 0 leaves the game's
# own choice alone; the log's texture filtering
# census says what it asked for. Read at device creation, so a change
# needs a restart.
#
# lod_bias also takes "auto", which is the right answer whenever the game
# renders smaller than the headset asks for and something brings it back
# up. Mips are chosen for the size being RENDERED, so an upscaled frame is
# reconstructed from textures blurrier than its output deserves, and the
# correction is log2 of the render fraction: -0.42 at three quarters,
# -1.00 at a half. auto reads that fraction from Elite's own graphics
# preset (its HMDRenderTargetMultiplier) instead of asking you to keep a
# number in step with it by hand, so changing HMD Quality moves the bias
# on the next launch. The log line names the fraction it read and the bias
# it derived, and says so plainly if the preset gave it nothing.
#texture_anisotropy = 0
# Auto is the default with temporal AA enabled; AA off leaves the mip bias
# unchanged unless explicitly overridden. Read at device creation: restart
# after changing AA mode to pick up its default texture bias.
#texture_lod_bias = auto

# --------------------------------------------------------------------------
# Freezes: where the render thread stopped
# --------------------------------------------------------------------------

# on (the default) or off. When the game's render thread goes about 150 ms
# without a Present -- the one-to-two-second freezes some setups see -- the
# log says which module and address it was stuck in, in lines that start
# "stall:". A watchdog thread notices the stall, and at 150, 500 and 1000 ms
# of it stops the render thread for a few tens of microseconds, copies its
# stack, lets it go, and then names the modules on the copy: the game, the
# graphics driver (nvwgf2umx), a chained mod such as EDHM, or an ntdll wait.
# That is the question a freeze report cannot otherwise answer.
#
# It works in this process only, on this one thread, and writes nothing to
# it. While the game is not stalling it costs one store a frame and a thread
# that wakes about seven times a second. At most six stalls back to back, one
# more every two seconds, and two hundred a session, so a bad session cannot
# fill the log with them.
#
# off starts no thread and takes no sample. The LONG FRAME and FREEZE lines
# are written either way: they do not depend on it.
#
# Needs a game restart: it is read once, on the first frame.
#freeze_location = on

# TEST ONLY. 0 (the default) does nothing. A value from 1 to 5000 makes the
# render thread sleep that many milliseconds, once, sixty seconds into the
# session, so the freeze lines and the stall sampler above can be checked in
# one flight without waiting for a real freeze: the log shows a freeze of
# about that length and a "stall:" line naming an ntdll sleep called from
# EDVR's own d3d11.dll. It stops the game on purpose; leave it at 0.
#
# Needs a game restart: it is read once, on the first frame.
#freeze_test_ms = 0

# TEST ONLY. 0 (the default) does nothing. A value from 1 to 500 makes the
# OpenXR runtime hold every xrEndFrame it makes that many milliseconds longer,
# for 40 seconds, starting 90 seconds into the session, so the runtime's
# long-xrEndFrame lines and its slow-frame-rate lines can be checked in one
# flight without a headset runtime that misbehaves: the runtime's log shows a
# native_end_frame_episode line for the first held call and its end line, and
# native_slow_regime lines (SLOW, still_slow, end) naming the vendor's
# xrEndFrame; the graphics log shows "slow test:" lines at the start and the
# end. 80 is about the length of the Quest 3 report this was written for (six
# display periods at 72 Hz, 10 fps). It slows the game on purpose; leave it
# at 0.
#
# Needs a game restart: it is read once, on the first frame.
#slow_test_ms = 0

# ============================================================================
# [experimental] -- present but not finished; off by default and safe to
# ignore. Here so the curious can try them and the log can name them.
# ============================================================================
[experimental]

# --------------------------------------------------------------------------
# Night vision
# --------------------------------------------------------------------------

# Experimental alternative appearance: outline geometry instead of fine
# surface textures, without a green fill. Brighten exterior terrain while
# retaining its colour and texture, and exclude cockpit/body surfaces and
# their outlines on the background. Off by default. The normal Night vision
# pulse stability fix remains independent and on by default. Live.
# ui: Realistic nightvision | live
night_vision_realistic = 0

# How bright the exterior terrain and its outlines are with Realistic
# nightvision on, 1.0 to 16.0. It multiplies the light already there,
# keeping the terrain's colour and texture; 1.0 removes the extra lift
# altogether, and 8.0 is the default. Lower it if the ground reads washed
# out, raise it for a darker world. The cockpit and your body stay excluded
# at every value. Has no effect when Realistic nightvision is off. Live.
# moved-from: fix.night_vision_brightness
# moved-from: advanced.night_vision_brightness (default 2.0)
# ui: Night vision brightness | range 1..16 | live
night_vision_brightness = 8.0

# Calm the brightness swing when you tilt your head between a bright console
# and dark space near a star. 0 is the game's own behaviour; 0.7 keeps 30% of
# the swing; 1 holds brightness steady. Only acts around stars -- menus,
# stations and on-foot always run stock. Experimental: it has been flown and
# it works, but how much damping is right is still a matter of taste rather
# than a measurement, and holding brightness still is not always what an eye
# expects. Live.
# moved-from: fix.exposure_damping
#exposure_damping = 0

# How slowly the damped brightness above follows a genuinely new scene, in
# seconds. Larger is steadier but adapts slower. 1..600. Live.
# moved-from: fix.exposure_damping_tau
#exposure_damping_tau = 45

# Developer instrument: for ONE compute shader that runs twice a frame
# (once per eye -- the census's DCX lines show the pattern), copy the first
# occurrence's UAV0 resource over the second's after it runs, so both eyes
# read one eye's product. One 16-digit hex hash; append :r to reverse the
# copy direction. Built for probing per-eye compute state (the FSS tile
# stack); a probe AND the fix shape in one, live on save. Empty is off.
# Do not aim it at the exposure shader -- the exposure fix owns that pair.
#
# By default it engages only while the FSS scanner is up (the mode latch),
# because the interesting pairs run game-wide and the cockpit is not the
# ground. Append :all to lift that and let it act everywhere -- suffixes
# may be given in either order, so 593E...:r:all and 593E...:all:r are the
# same thing.
#
# :all exists for the black-planet hunt (2026-08-30), where an all-stages
# eye dump (since removed) placed the loss between the geometry buffer and the lit image: the
# body's surface reaches BOTH eyes and one eye loses it during lighting.
# That points at the clustered light-culling dispatches, which have nothing
# to do with the scanner. Equalising their b1 INPUT healed nothing; this
# equalises their OUTPUT, the half never tested.
#dispatch_pair_sync =

# Developer instrument pair: equalise CS b1 across a compute shader's
# dispatches. The round-14 census caught the FSS mask builder running with
# its 480-byte b1 parameter block bound for ONE eye and empty (= zeros)
# for the other, every frame -- the first hard per-eye state difference
# the black-square hunt measured. lend: a dispatch of the named shader
# arriving with b1 EMPTY runs with the buffer the same shader last ran
# bound with (restored to empty after). strip: a dispatch arriving with
# b1 BOUND runs without it (restored after). Whichever direction heals
# names the good state. One 16-digit hex hash each; arm one at a time,
# and not together with dispatch_pair_sync on the same hash. Live. Empty
# is off and the only shipped state.
#dispatch_cb1_lend =
#dispatch_cb1_strip =

# Render the Full System Scanner's zoomed body -- planet and rings -- at
# full eye resolution instead of the half resolution the game picks. The
# body is a mono image pasted into both eyes; at half size it reads as a
# pixelated sprite, and a thin ring resampled per eye from too few pixels
# can alias differently in each -- segments visible in one eye and not the
# other while a scan resolves (docs/fss-scanner.md). Costs 4x the pixels
# for that one offscreen layer, only while the scanner is zoomed. Live:
# flipping it changes the next FSS zoom, no restart. 1 on, 0 off.
# moved-from: fix.fss_res
#fss_res = 0

# Reconstruct the selected target's direction indicator instead of smearing
# it. stock is the game's own; sharp is the fix.
#
# Selecting a target adds exactly one draw per eye: a quad that composites a
# sub-region of an interface surface into the view, through a pixel shader
# that is -- in full -- one bilinear sample, an alpha discard and a colour
# matrix. The indicator's content occupies a fixed number of surface texels
# however large that surface is (measured: the surface grew 1.635x between
# two headsets and the indicator did not sharpen, and creating it larger
# changed nothing), so the quad always magnifies it by the same factor and
# that one bilinear tap is where the blockiness comes from.
#
# sharp replaces that shader with the same colour maths -- transcribed from
# the game's own disassembly and diffed against it instruction for
# instruction -- over AMD's EASU, an edge-adaptive kernel that is meaningfully
# better than a cubic on thin line art. A rig where EASU will not compile
# falls back to Catmull-Rom and says so.
#
# It CANNOT add detail: no resampler can. Cleaner edges and no bilinear
# diamonds is the whole prize. Live; any compile failure draws the game's own
# shader and says so.
#target_indicator = stock

# How far away the Full System Scanner's screen sits. 1.0 (the default)
# is the game's own distance; 0 inherits panel_distance, so one setting
# places both screens -- opt-in, because with a customised on-foot
# distance it moves the WHOLE scanner UI (field-attributed 2026-08-27:
# inherit at 0.7 shifted everything on zoom). The screen moves along
# your line of sight without changing its angular size -- closer means
# nearer stereo depth, not a bigger picture. Drawn through a replacement
# of the game's own composite shader pair (docs/fss-panel.md); if a game
# update rebuilds those shaders this does nothing and the log says the
# fix never engaged. Live.
# moved-from: fix.fss_panel_distance
#fss_panel_distance = 1.0

# --------------------------------------------------------------------------
# Anti-aliasing: the tuning keys
# --------------------------------------------------------------------------
#
# The switches are under [fix] (temporal_aa and render_sharpness, which
# the installer's settings window shows); what sits here is their tuning
# -- the temporal pass's jitter, weight and clamp -- all live, and worth
# touching only when the log names one. A line left under [fix] or
# [experimental] from an earlier layout still works and is read as the
# new name for that session, with a note in the log saying so.

# --------------------------------------------------------------------------
# Temporal anti-aliasing
# --------------------------------------------------------------------------

# Optional depth-disagreement rejection. It can reduce trails on moving
# edges but can also reject useful history on thin features. The motion
# from Elite's own records and adaptive UI history do not need this. Off by
# default.
# moved-from: fix.temporal_aa_movers
# ui: Temporal depth rejection (experimental) | choices off, on | live
temporal_aa_movers = off

# The sub-pixel jitter of the projection. off = a temporal smoother only:
# real integration while the head moves, nothing new while it is held
# still. Leave it on unless you are testing. Live.
# moved-from: fix.temporal_aa_jitter
temporal_aa_jitter = on

# Local refusal ("partial" temporal AA), one raster phase: when a scene draw
# cannot be jittered for a reason specific to that one draw, the draw goes out
# unjittered (it cannot be stopped), that frame's temporal history is
# invalidated, and EDVR returns to observation until a refusal-free frame
# requalifies the contract -- treatment then resumes through the usual warm-up.
# With the setting turned off, treatment is retried every frame even while
# such draws persist (the old reset-storm behaviour). Live.
temporal_aa_partial = on

# Flat profile: resolve the game's HDR scene image BEFORE its bloom, depth of
# field and tone map, instead of the tone-mapped picture at its final copy.
# The game's own post passes then act on an anti-aliased image, and treatment
# stops depending on the shape of the post chain: a bloom, depth-of-field or
# grade variant EDVR has never seen is treated all the same. auto, the default
# since the route flew, resolves every frame where the game renders at least at
# the output's size and its scene target is R11G11B10F (DLSS, DLAA and FSR;
# EDVR's TAA at the output's own size). Every other frame -- the game rendering
# below the output (Elite's supersampling under 1.0, which is how flat upscales),
# or EDVR's TAA above it -- keeps the copy route, which then admits the game's
# final copy by what it is, an image the scene's own size made after the scene
# image was first read, scaled uniformly to the output, instead of by the tone
# pass in front of it: bloom, depth of field and the tone variant do not matter
# there either (a game anti-aliasing filter after the tone pass still does, and
# the F8 panel says so). off keeps the copy route alone, exactly as before, with
# its list of known tone passes; the route's trigger still runs and only counts
# what it finds (a "flat hdr route 5s:" line in the log). Any other value reads
# as off. The game's own anti-aliasing still filters the result again (softer);
# the F8 panel says so. Live.
# dev: choices off, auto
temporal_aa_before_post = auto

# VR on foot: resolve the world ONCE a frame instead of running the upscaler
# over each eye's view of it (design doc section 82). On foot Elite draws the
# world once, flat, into the 2D screen's target and shows that screen to each
# eye. auto, the default, resolves the game's HDR scene image where it is drawn,
# before the game's own post chain, with the engine fix.temporal_aa names, and
# hands the eyes the resolved screen through the UI layer (fix.ui_quality must
# be on): the two eye upscaler passes, their motion prep and UI resolve stand
# aside for those frames. While it owns the world the route moves the world's own
# cameras by a sub-pixel amount each frame, so the resolver has something to
# accumulate; experimental.temporal_aa_jitter off stops that. Every frame the
# route cannot take (a refusal, a 3D map, no scene target, a transition) keeps
# the two-eye route. off keeps the two-eye route for every frame, exactly as
# on-foot VR was before the route: the way back if a frame looks wrong, kept for
# one release candidate. Any other value reads as off. With fix.panel_curvature
# above 0 the route draws the curved screen through the same curve the game's
# own draw is bent with, and its 5 s log line names it (curve=). Live.
# dev: choices off, auto
temporal_aa_on_foot_world = auto

# VR on foot: keep the galaxy and system maps and the menus sharp when they move
# (design doc design-world-camera-motion-2026-09-30.md, Phase 1). On foot Elite
# draws everything, the world and the maps alike, into one flat screen and shows
# it to each eye, and EDVR filters that screen as the world with the camera
# motion the world supplies. Nothing supplies a map's motion, so a dragged map
# smears. on, the default, decides by the game's own camera instead: the screen
# is the world only while a draw that reads the world camera names it (2 frames
# in a row hold it, 3 release it). Anything else the screen shows, a map or a
# menu, is drawn by the UI layer, sharp, after the upscaler, with no temporal
# filtering, and an eye that holds nothing else skips the upscaler while it does
# (about 2.6 ms of GPU time a frame in a map, measured from the route's first
# flight). Needs fix.ui_quality (on by default) and fix.temporal_aa on. off keeps
# the journal's and the screen's own depth reading, exactly as on-foot VR was
# before the gate: the way back if a map or a menu looks wrong, kept for one
# release candidate. With experimental.temporal_aa_on_foot_world = auto the route
# and this gate let go together when a map opens, and the route warms again for
# 8 frames after it closes. A curved screen (fix.panel_curvature above 0) is
# handled the same way, for the route and for this gate (unflown). Any other
# value reads as off. Live.
# dev: choices off, on
on_foot_maps_sharp = on

# How much of each frame is history, 0.50 to 0.95: higher is calmer and
# slower to change, lower is livelier and flickers more. Live.
# moved-from: fix.temporal_aa_blend
temporal_aa_blend = 0.90

# How far the history may stray from what the current frame shows around
# a pixel, in standard deviations of that neighbourhood, 0.5 to 3.0: lower
# means less ghosting behind moving things and more flicker, higher the
# reverse. Live.
# moved-from: fix.temporal_aa_clamp
temporal_aa_clamp = 1.0

# --------------------------------------------------------------------------
# Field of view trim
# --------------------------------------------------------------------------

# Take degrees off the top AND the bottom edge of each eye. The game is told
# a narrower view and given a smaller render target, so DLSS and every
# full-screen pass shrink with it. You lose visible field at the trimmed
# edges; beyond them is black. Costs nothing but what you choose to give up.
# Applies within a second or two, because the game rebuilds its render targets
# when the recommended size changes, as it does for the terrain fix. Needs
# openvr_api.dll installed.
#
# All three trims are PER HEADSET: how many degrees you can give up is a
# fact about the lenses in front of you, so the value is a list of
# runtime/system:degrees entries, one per headset, separated by commas, up
# to 8, each 0 to 30:
#
#   pimax-openxr/pimax-crystal-super:10, virtualdesktopxr/meta-quest-3:5
#
# The key for the headset you are wearing is the log's "headset_key," line:
# the runtime name and the headset name lowercased, with everything but
# letters and digits turned into "-". Copy it from there rather than typing
# the names, which contain slashes. These three are set in this file only:
# there is no menu row for them. A headset with no entry gets no trim; a
# bare number on its own (the 5 this key used to take) names no headset and
# is ignored, with the log saying so; and emptying the value clears every
# headset's entry. Live.
# moved-from: fix.fov_trim_vertical
# dev: hidden
fov_trim_vertical =

# The same, on each eye's outer (temple-side) edge. You lose visible field at
# the outer edges; beyond them is black. Per headset, in the same entries as
# the key above (pimax-openxr/pimax-crystal-super:5). Live.
# moved-from: fix.fov_trim_outer
# dev: hidden
fov_trim_outer =

# The same, on each eye's inner (nose-side) edge. This one shrinks only the
# stereo overlap -- the part both eyes see -- not the total field of view, so
# it is the cheapest degrees to give up. Per headset, in the same entries as
# the keys above (pimax-openxr/pimax-crystal-super:5). Live.
# moved-from: fix.fov_trim_nasal
# dev: hidden
fov_trim_nasal =
